{% extends "base.html" %}
{% block title %}Settings - SOVA{% endblock %}
{% block content %}
<h2 class="text-2xl font-semibold mb-6">Settings</h2>

<!-- Configuration groups (accordion) -->
<div id="config-groups" class="space-y-3 mb-6">
  <p class="text-gray-500 text-sm">Loading configuration...</p>
</div>

<!-- Two columns: Invariants + Personas -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <!-- Invariants -->
  <div class="sova-card">
    <div class="sova-card-header">
      <h3 class="text-sm font-medium text-gray-400">Invariants</h3>
    </div>
    <div class="sova-card-body" id="invariants-list">
      <p class="text-gray-500 text-sm">Loading...</p>
    </div>
  </div>

  <!-- Personas -->
  <div class="sova-card">
    <div class="sova-card-header">
      <h3 class="text-sm font-medium text-gray-400">Personas</h3>
    </div>
    <div class="sova-card-body" id="personas-list">
      <p class="text-gray-500 text-sm">Loading...</p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function formatValue(val, type) {
  if (val === null || val === undefined || val === '') {
    return '<span class="text-gray-600 italic text-xs">not set</span>';
  }
  if (type === 'boolean' || val === true || val === false) {
    var isTrue = (val === true || val === 'true');
    if (isTrue) {
      return '<span class="sova-badge" style="background:rgb(var(--ctp-green-rgb)/0.15);color:var(--ctp-green)">true</span>';
    }
    return '<span class="sova-badge" style="background:rgb(var(--ctp-red-rgb)/0.15);color:var(--ctp-red)">false</span>';
  }
  if (type === 'list') {
    if (Array.isArray(val)) {
      if (val.length === 0) return '<span class="text-gray-600 italic text-xs">empty list</span>';
      return val.map(function(v) {
        return '<span class="sova-badge mr-1 mb-0.5" style="background:rgb(var(--ctp-surface1-rgb)/0.5);color:var(--ctp-subtext1)">' + escapeHtml(String(v)) + '</span>';
      }).join('');
    }
    return '<span class="text-gray-300 text-xs">' + escapeHtml(String(val)) + '</span>';
  }
  if (type === 'object') {
    if (typeof val === 'object' && val !== null) {
      var entries = Object.entries(val);
      if (entries.length === 0) return '<span class="text-gray-600 italic text-xs">empty</span>';
      return '<div class="space-y-0.5">' + entries.map(function(kv) {
        return '<div class="text-xs"><span class="text-gray-500 font-mono">' + escapeHtml(kv[0]) + '</span>' +
          '<span class="text-gray-600 mx-1">=</span>' +
          '<span class="text-gray-300">' + escapeHtml(String(kv[1])) + '</span></div>';
      }).join('') + '</div>';
    }
    return '<span class="text-gray-300 text-xs">' + escapeHtml(String(val)) + '</span>';
  }
  if (type === 'number') {
    return '<span class="text-gray-300 text-xs font-mono">' + escapeHtml(String(val)) + '</span>';
  }
  return '<span class="text-gray-300 text-xs">' + escapeHtml(String(val)) + '</span>';
}

function renderSettingRow(s) {
  var valHtml = formatValue(s.value, s.value_type);
  var descHtml = s.description
    ? '<div class="text-xs text-gray-600 mt-0.5">' + escapeHtml(s.description) + '</div>'
    : '';
  return '<tr class="border-b border-gray-700/20 hover:bg-surface-hover/30 group">' +
    '<td class="px-4 py-3 align-top w-2/5">' +
      '<div class="flex items-baseline">' +
        '<span class="text-sm text-gray-300">' + escapeHtml(s.label) + '</span>' +
        '<span class="font-mono text-gray-600 text-xs ml-2 opacity-0 group-hover:opacity-100 transition-opacity">' + escapeHtml(s.key) + '</span>' +
      '</div>' +
      descHtml +
    '</td>' +
    '<td class="px-4 py-3 align-top">' +
      '<div class="flex items-center gap-2">' +
        '<span class="config-val flex-1" data-key="' + escapeHtml(s.key) + '">' + valHtml + '</span>' +
        '<button onclick="editConfig(\'' + escapeHtml(s.key) + '\', this)" ' +
          'class="text-xs text-gray-600 hover:text-gray-300 opacity-0 group-hover:opacity-100 transition-opacity shrink-0" ' +
          'data-tooltip="Edit">' +
          'edit' +
        '</button>' +
      '</div>' +
    '</td>' +
  '</tr>';
}

function toggleGroup(groupId) {
  var body = document.getElementById('group-body-' + groupId);
  var chevron = document.getElementById('group-chevron-' + groupId);
  if (!body) return;

  var isOpen = body.style.maxHeight && body.style.maxHeight !== '0px';
  if (isOpen) {
    body.style.maxHeight = '0px';
    chevron.style.transform = 'rotate(-90deg)';
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';
    chevron.style.transform = 'rotate(0deg)';
  }
}

async function loadConfig() {
  try {
    var data = await fetchAPI(apiUrl('/settings/config/grouped'));
    var container = document.getElementById('config-groups');
    var groups = data.groups;

    if (!groups || groups.length === 0) {
      container.innerHTML = '<p class="text-gray-500 text-sm">No configuration found</p>';
      return;
    }

    container.innerHTML = groups.map(function(group) {
      var rows = group.settings.map(renderSettingRow).join('');
      var count = group.settings.length;

      return '<div class="sova-card sova-settings-group">' +
        '<button onclick="toggleGroup(\'' + group.id + '\')" ' +
          'class="w-full sova-card-header cursor-pointer hover:bg-surface-hover/30 transition-colors">' +
          '<div class="flex items-center gap-2">' +
            '<svg id="group-chevron-' + group.id + '" class="w-4 h-4 text-gray-500 transition-transform duration-200" ' +
              'fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">' +
              '<path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>' +
            '</svg>' +
            '<h3 class="text-sm font-medium text-gray-300">' + escapeHtml(group.label) + '</h3>' +
            '<span class="text-xs text-gray-600">' + count + '</span>' +
          '</div>' +
        '</button>' +
        '<div id="group-body-' + group.id + '" class="sova-settings-body" style="max-height:0px">' +
          '<table class="w-full text-left"><tbody>' + rows + '</tbody></table>' +
        '</div>' +
      '</div>';
    }).join('');

    // Auto-expand first group
    if (groups.length > 0) {
      toggleGroup(groups[0].id);
    }
  } catch (e) {
    console.error('Failed to load config:', e);
    document.getElementById('config-groups').innerHTML =
      '<p class="text-gray-500 text-sm">Failed to load configuration</p>';
  }
}

function editConfig(key, btn) {
  var row = btn.closest('tr');
  var span = row.querySelector('.config-val');
  var currentVal = span.textContent.trim();
  if (currentVal === 'not set') currentVal = '';

  var input = document.createElement('input');
  input.type = 'text';
  input.value = currentVal;
  input.className = 'sova-input text-xs py-1';
  input.onkeydown = function(e) {
    if (e.key === 'Enter') saveConfig(key, input.value, span, input);
    if (e.key === 'Escape') cancelEdit(span, input);
  };
  input.onblur = function() { cancelEdit(span, input); };

  span.dataset.origHtml = span.innerHTML;
  span.innerHTML = '';
  span.appendChild(input);
  btn.style.display = 'none';
  input.focus();
  input.select();
}

function cancelEdit(span, input) {
  if (!input.parentNode) return;
  input.onblur = null;
  span.innerHTML = span.dataset.origHtml;
  var btn = span.closest('td').querySelector('button');
  if (btn) btn.style.display = '';
}

async function saveConfig(key, value, span, input) {
  try {
    var res = await fetch(apiUrl('/settings/config'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({key: key, value: value}),
    });
    var data = await res.json();
    if (data.error) {
      alert(data.error);
      cancelEdit(span, input);
    } else {
      input.onblur = null;
      // Reload to get proper formatting
      loadConfig();
    }
  } catch (e) {
    alert('Failed to save: ' + e.message);
    cancelEdit(span, input);
  }
}

async function loadInvariants() {
  try {
    var data = await fetchAPI(apiUrl('/settings/invariants'));
    var container = document.getElementById('invariants-list');
    if (data.invariants.length === 0) {
      container.innerHTML = '<p class="text-gray-500 text-xs">No invariants found</p>';
      return;
    }
    container.innerHTML = data.invariants.map(function(inv) {
      var dotColor = inv.executable ? 'bg-accent-green' : 'bg-gray-500';
      return '<div class="flex items-center gap-2 py-1">' +
        '<span class="w-2 h-2 rounded-full ' + dotColor + '"></span>' +
        '<span class="text-xs font-mono text-gray-300">' + escapeHtml(inv.name) + '</span>' +
        (inv.executable ? '' : '<span class="text-xs text-gray-600">(not executable)</span>') +
      '</div>';
    }).join('');
  } catch (e) {
    console.error('Failed to load invariants:', e);
  }
}

async function loadPersonas() {
  try {
    var data = await fetchAPI(apiUrl('/settings/personas'));
    var container = document.getElementById('personas-list');

    var html = '';
    if (data.detected) {
      html += '<div class="mb-3 text-xs">' +
        '<span class="text-gray-500">Detected:</span> ' +
        '<span class="text-accent-green font-medium">' + escapeHtml(data.detected) + '</span>' +
      '</div>';
    }

    if (data.personas.length === 0) {
      html += '<p class="text-gray-500 text-xs">No persona files found</p>';
    } else {
      html += data.personas.map(function(p) {
        var isActive = data.detected && p.name === data.detected;
        return '<div class="flex items-center gap-2 py-1">' +
          '<span class="w-2 h-2 rounded-full ' + (isActive ? 'bg-accent-green' : 'bg-gray-600') + '"></span>' +
          '<span class="text-xs text-gray-300">' + escapeHtml(p.name) + '</span>' +
          (isActive ? '<span class="text-xs text-accent-green">(active)</span>' : '') +
        '</div>';
      }).join('');
    }

    container.innerHTML = html;
  } catch (e) {
    console.error('Failed to load personas:', e);
  }
}

loadConfig();
loadInvariants();
loadPersonas();
</script>
{% endblock %}
