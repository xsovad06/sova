{% extends "base.html" %}
{% block title %}Settings - SOVA{% endblock %}
{% block content %}
<h2 class="text-2xl font-semibold mb-6">Settings</h2>

<!-- Capacity recommendation (loaded async) -->
<div id="capacity-callout" class="hidden mb-6 bg-surface-card rounded-lg border border-gray-700/50 p-4">
  <div class="flex items-start gap-3">
    <div class="shrink-0 w-8 h-8 rounded-full bg-accent-purple/20 flex items-center justify-center">
      <span class="text-accent-purple text-sm font-bold">C</span>
    </div>
    <div class="min-w-0">
      <p class="text-sm font-medium text-gray-300">Capacity Recommendation</p>
      <p class="text-xs text-gray-500 mt-1" id="capacity-detail"></p>
      <div class="flex gap-4 mt-2" id="capacity-metrics"></div>
    </div>
  </div>
</div>

<!-- All settings in a responsive two-column grid -->
<div id="config-groups" class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6 items-start">
  <p class="text-gray-500 text-sm lg:col-span-2">Loading configuration...</p>
</div>
{% endblock %}

{% block scripts %}
<script>
function formatValue(val, type, key) {
  if (val === null || val === undefined || val === '') {
    return '<span class="text-gray-600 italic text-xs">not set</span>';
  }
  if (type === 'boolean' || val === true || val === false) {
    var isTrue = (val === true || val === 'true');
    return '<label class="sova-toggle">' +
      '<input type="checkbox"' + (isTrue ? ' checked' : '') +
        ' onchange="toggleBool(\'' + escapeJsStr(key) + '\', this.checked)">' +
      '<span class="sova-toggle-track"></span>' +
    '</label>';
  }
  if (type === 'list') {
    if (Array.isArray(val)) {
      if (val.length === 0) return '<span class="text-gray-600 italic text-xs">empty list</span>';
      return val.map(function(v) {
        return '<span class="sova-badge mr-1 mb-0.5" style="background:rgb(var(--ctp-surface1-rgb)/0.5);color:var(--ctp-subtext1)">' + escapeHtml(String(v)) + '</span>';
      }).join('');
    }
    return '<span class="text-gray-300 text-xs">' + escapeHtml(String(val)) + '</span>';
  }
  if (type === 'object') {
    if (typeof val === 'object' && val !== null) {
      var entries = Object.entries(val);
      if (entries.length === 0) return '<span class="text-gray-600 italic text-xs">empty</span>';
      return '<div class="space-y-0.5">' + entries.map(function(kv) {
        return '<div class="text-xs"><span class="text-gray-500 font-mono">' + escapeHtml(kv[0]) + '</span>' +
          '<span class="text-gray-600 mx-1">=</span>' +
          '<span class="text-gray-300">' + escapeHtml(String(kv[1])) + '</span></div>';
      }).join('') + '</div>';
    }
    return '<span class="text-gray-300 text-xs">' + escapeHtml(String(val)) + '</span>';
  }
  if (type === 'secret') {
    var masked = '•'.repeat(Math.min(String(val).length, 20));
    var uid = 'secret-' + key.replace(/\./g, '-');
    return '<span id="' + uid + '-masked" class="text-gray-300 text-xs font-mono">' + masked + '</span>' +
      '<span id="' + uid + '-plain" class="text-gray-300 text-xs font-mono" style="display:none">' + escapeHtml(String(val)) + '</span>' +
      '<button onclick="event.stopPropagation(); toggleSecret(\'' + uid + '\')" ' +
        'class="text-xs text-gray-600 hover:text-gray-300 ml-2" ' +
        'aria-label="Show secret" id="' + uid + '-btn">' +
        '<span id="' + uid + '-toggle">show</span></button>';
  }
  if (type === 'number') {
    return '<span class="text-gray-300 text-xs font-mono">' + escapeHtml(String(val)) + '</span>';
  }
  return '<span class="text-gray-300 text-xs">' + escapeHtml(String(val)) + '</span>';
}

function toggleSecret(uid) {
  var masked = document.getElementById(uid + '-masked');
  var plain = document.getElementById(uid + '-plain');
  var toggle = document.getElementById(uid + '-toggle');
  var btn = document.getElementById(uid + '-btn');
  if (!masked || !plain || !toggle) return;
  var showing = plain.style.display !== 'none';
  masked.style.display = showing ? '' : 'none';
  plain.style.display = showing ? 'none' : '';
  toggle.textContent = showing ? 'show' : 'hide';
  if (btn) btn.setAttribute('aria-label', showing ? 'Show secret' : 'Hide secret');
}

function renderSettingRow(s) {
  var isBool = (s.value_type === 'boolean' || s.value === true || s.value === false);
  var isStructured = (s.value_type === 'list' || s.value_type === 'object');
  var editable = !isBool && !isStructured;
  var valHtml = formatValue(s.value, s.value_type, s.key);
  var descHtml = s.description
    ? '<div class="text-xs text-gray-600 mt-0.5">' + escapeHtml(s.description) + '</div>'
    : '';
  var clickAttr = editable ? ' onclick="editConfig(\'' + escapeJsStr(s.key) + '\')" style="cursor:pointer"' : '';
  var editBtn = editable
    ? '<button onclick="event.stopPropagation(); editConfig(\'' + escapeJsStr(s.key) + '\')" ' +
      'class="text-xs text-gray-600 hover:text-gray-300 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">' +
      'edit' +
    '</button>'
    : '<span class="text-xs opacity-0 shrink-0 pointer-events-none">edit</span>';
  return '<tr class="border-b border-gray-700/20 hover:bg-surface-hover/30 group">' +
    '<td class="px-4 py-3 align-top">' +
      '<div class="flex items-baseline">' +
        '<span class="text-sm text-gray-300">' + escapeHtml(s.label) + '</span>' +
        '<span class="font-mono text-gray-600 text-xs ml-2 opacity-0 group-hover:opacity-100 transition-opacity">' + escapeHtml(s.key) + '</span>' +
      '</div>' +
      descHtml +
    '</td>' +
    '<td class="px-4 py-3 align-top text-right">' +
      '<div class="flex items-center gap-2 justify-end"' + clickAttr + '>' +
        '<span class="config-val" data-key="' + escapeHtml(s.key) + '" data-type="' + escapeHtml(s.value_type) + '" data-raw="' + escapeHtml(JSON.stringify(s.value)) + '">' + valHtml + '</span>' +
        editBtn +
      '</div>' +
    '</td>' +
  '</tr>';
}

function toggleGroup(groupId) {
  var body = document.getElementById('group-body-' + groupId);
  var chevron = document.getElementById('group-chevron-' + groupId);
  var toggle = document.getElementById('group-toggle-' + groupId);
  if (!body) return;

  var isOpen = body.style.maxHeight && body.style.maxHeight !== '0px';
  if (isOpen) {
    body.style.maxHeight = '0px';
    chevron.style.transform = 'rotate(-90deg)';
    if (toggle) toggle.setAttribute('aria-expanded', 'false');
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';
    chevron.style.transform = 'rotate(0deg)';
    if (toggle) toggle.setAttribute('aria-expanded', 'true');
  }
}

async function loadConfig() {
  try {
    var res = await fetch(apiUrl('/settings/config/grouped'));
    if (!res.ok) {
      var detail = await getErrorDetail(res, 'Failed to fetch configuration');
      throw new Error(detail);
    }
    var data = await res.json();
    var container = document.getElementById('config-groups');
    var groups = data.groups;

    if (!groups || groups.length === 0) {
      groups = [];
    }

    // Remember which groups are expanded before rebuilding DOM
    var expanded = [];
    document.querySelectorAll('.sova-settings-body').forEach(function(body) {
      if (body.style.maxHeight && body.style.maxHeight !== '0px') {
        expanded.push(body.id.replace('group-body-', ''));
      }
    });

    var html = groups.map(function(group) {
      var rows = group.settings.map(renderSettingRow).join('');
      var count = group.settings.length;

      return '<div class="sova-card sova-settings-group">' +
        '<button id="group-toggle-' + group.id + '" onclick="toggleGroup(\'' + group.id + '\')" ' +
          'class="w-full sova-card-header cursor-pointer hover:bg-surface-hover/30 transition-colors" ' +
          'aria-label="Toggle ' + escapeHtml(group.label) + ' settings" ' +
          'aria-expanded="false" ' +
          'aria-controls="group-body-' + group.id + '">' +
          '<div class="flex items-center gap-2">' +
            '<svg id="group-chevron-' + group.id + '" class="w-4 h-4 text-gray-500 transition-transform duration-200" ' +
              'fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">' +
              '<path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>' +
            '</svg>' +
            '<h3 class="text-sm font-medium text-gray-300">' + escapeHtml(group.label) + '</h3>' +
            '<span class="text-xs text-gray-600">' + count + '</span>' +
          '</div>' +
        '</button>' +
        '<div id="group-body-' + group.id + '" class="sova-settings-body" style="max-height:0px">' +
          '<div class="overflow-x-auto">' +
            '<table class="w-full text-left" style="table-layout:fixed"><colgroup><col style="width:65%"><col style="width:35%"></colgroup><tbody>' + rows + '</tbody></table>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    // Append Invariants and Personas cards into the same grid
    html += '<div class="sova-card">' +
      '<div class="sova-card-header">' +
        '<h3 class="text-sm font-medium text-gray-400">Invariants</h3>' +
      '</div>' +
      '<div class="sova-card-body" id="invariants-list">' +
        '<p class="text-gray-500 text-sm">Loading...</p>' +
      '</div>' +
    '</div>';

    html += '<div class="sova-card">' +
      '<div class="sova-card-header">' +
        '<h3 class="text-sm font-medium text-gray-400">Personas</h3>' +
      '</div>' +
      '<div class="sova-card-body" id="personas-list">' +
        '<p class="text-gray-500 text-sm">Loading...</p>' +
      '</div>' +
    '</div>';

    html += '<div class="sova-card">' +
      '<div class="sova-card-header">' +
        '<div class="flex items-center justify-between">' +
          '<h3 class="text-sm font-medium text-gray-400">Operations Persona</h3>' +
          '<button type="button" onclick="openPersonaEditor()" ' +
            'class="text-xs text-gray-500 hover:text-gray-300 transition-colors">Edit</button>' +
        '</div>' +
      '</div>' +
      '<div class="sova-card-body" id="persona-preview">' +
        '<p class="text-gray-500 text-sm">Loading...</p>' +
      '</div>' +
    '</div>';

    html += '<div class="sova-card">' +
      '<div class="sova-card-header">' +
        '<h3 class="text-sm font-medium text-gray-400">SOVA Installation</h3>' +
      '</div>' +
      '<div class="sova-card-body" id="installation-status">' +
        '<p class="text-gray-500 text-sm">Checking for updates...</p>' +
      '</div>' +
    '</div>';

    html += '<div class="sova-card">' +
      '<div class="sova-card-header">' +
        '<h3 class="text-sm font-medium text-gray-400">GitHub Labels</h3>' +
      '</div>' +
      '<div class="sova-card-body" id="labels-status">' +
        '<p class="text-gray-500 text-sm">Checking labels...</p>' +
      '</div>' +
    '</div>';

    container.innerHTML = html;

    // Restore previously expanded groups without animation, or auto-expand first on initial load
    var toExpand = expanded.length > 0 ? expanded : (groups.length > 0 ? [groups[0].id] : []);
    toExpand.forEach(function(id) {
      var body = document.getElementById('group-body-' + id);
      if (body) {
        body.style.transition = 'none';
        body.style.maxHeight = body.scrollHeight + 'px';
        body.offsetHeight;
        body.style.transition = '';
      }
      var chevron = document.getElementById('group-chevron-' + id);
      if (chevron) chevron.style.transform = 'rotate(0deg)';
      var toggle = document.getElementById('group-toggle-' + id);
      if (toggle) toggle.setAttribute('aria-expanded', 'true');
    });

    // Load invariants, personas, installation status, and labels into their containers
    loadInvariants();
    loadPersonas();
    loadPersonaPreview();
    loadInstallationStatus();
    loadLabelsStatus();

    // If the URL has a #groupId hash, open that group and scroll to it
    var hash = window.location.hash.replace('#', '');
    if (hash && document.getElementById('group-body-' + hash)) {
      var hashBody = document.getElementById('group-body-' + hash);
      var isAlreadyOpen = hashBody.style.maxHeight && hashBody.style.maxHeight !== '0px';
      if (!isAlreadyOpen) toggleGroup(hash);
      setTimeout(function() {
        hashBody.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 120);
    }
  } catch (e) {
    console.error('Failed to load config:', e);
    var detail = (e.message || '').replace('HTTP 500: ', '');
    if (detail.startsWith('Invalid configuration:')) {
      document.getElementById('config-groups').innerHTML =
        '<div class="lg:col-span-2 p-4 rounded-lg" style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3)">' +
        '<p class="text-red-400 text-sm font-medium mb-1">Configuration Error</p>' +
        '<p class="text-red-300 text-xs font-mono">' + escapeHtml(detail) + '</p>' +
        '<p class="text-gray-500 text-xs mt-2">Fix the value in sova.toml and reload.</p>' +
        '</div>';
    } else {
      document.getElementById('config-groups').innerHTML =
        '<p class="text-gray-500 text-sm lg:col-span-2">Failed to load configuration</p>';
    }
  }
}

async function toggleBool(key, checked) {
  try {
    var res = await fetch(apiUrl('/settings/config'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({key: key, value: String(checked)}),
    });
    var data = await res.json();
    if (data.error) {
      showToast(data.error, 'error');
    }
    loadConfig();
  } catch (e) {
    showToast('Failed to save: ' + e.message, 'error');
    loadConfig();
  }
}

function editConfig(key) {
  var span = document.querySelector('.config-val[data-key="' + key + '"]');
  if (!span || span.querySelector('input')) return;

  var currentVal;
  if (span.dataset.raw) {
    var raw = JSON.parse(span.dataset.raw);
    currentVal = (typeof raw === 'string') ? raw : JSON.stringify(raw);
  } else {
    currentVal = span.textContent.trim();
  }
  if (currentVal === 'null' || currentVal === 'not set') currentVal = '';

  var input = document.createElement('input');
  var fieldType = span.dataset.type || 'string';
  if (fieldType === 'secret') {
    input.type = 'password';
  } else if (fieldType === 'number') {
    input.type = 'number';
    input.step = 'any';
    input.min = '0';
  } else {
    input.type = 'text';
  }
  input.value = currentVal;
  input.className = 'sova-input text-xs py-1';

  // Add datalist for model field with suggested values
  if (key === 'agent.model') {
    var datalistId = 'datalist-agent-model';
    input.setAttribute('list', datalistId);
    var datalist = document.createElement('datalist');
    datalist.id = datalistId;
    var modelOptions = ['opus', 'sonnet', 'haiku', 'fast', 'smart', 'cheap'];
    modelOptions.forEach(function(opt) {
      var option = document.createElement('option');
      option.value = opt;
      datalist.appendChild(option);
    });
    span.appendChild(datalist);
  }

  var saving = false;
  input.onkeydown = function(e) {
    if (e.key === 'Enter') { saving = true; saveConfig(key, input.value, span, input); }
    if (e.key === 'Escape') { cancelEdit(span, input); }
  };
  input.onblur = function() {
    if (saving) return;
    var newVal = input.value;
    var origRaw = span.dataset.raw ? JSON.parse(span.dataset.raw) : '';
    var origStr = (typeof origRaw === 'string') ? origRaw : JSON.stringify(origRaw);
    if (newVal !== origStr) {
      saving = true;
      saveConfig(key, newVal, span, input);
    } else {
      cancelEdit(span, input);
    }
  };

  span.dataset.origHtml = span.innerHTML;
  span.innerHTML = '';
  span.appendChild(input);
  var btn = span.closest('td').querySelector('button');
  if (btn) btn.style.display = 'none';
  input.focus();
  input.select();
}

function cancelEdit(span, input) {
  if (!input.parentNode) return;
  input.onblur = null;
  span.innerHTML = span.dataset.origHtml;
  var btn = span.closest('td').querySelector('button');
  if (btn) btn.style.display = '';
}

async function saveConfig(key, value, span, input) {
  try {
    var res = await fetch(apiUrl('/settings/config'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({key: key, value: value}),
    });
    var data = await res.json();
    if (data.error) {
      showToast(data.error, 'error');
      cancelEdit(span, input);
    } else {
      input.onblur = null;
      // Reload to get proper formatting
      loadConfig();
    }
  } catch (e) {
    showToast('Failed to save: ' + e.message, 'error');
    cancelEdit(span, input);
  }
}

async function loadInvariants() {
  try {
    var data = await fetchAPI(apiUrl('/settings/invariants'));
    var container = document.getElementById('invariants-list');
    if (data.invariants.length === 0) {
      container.innerHTML = '<p class="text-gray-500 text-xs">No invariants found</p>';
      return;
    }
    container.innerHTML = data.invariants.map(function(inv) {
      var dotColor = inv.executable ? 'bg-accent-green' : 'bg-gray-500';
      return '<div class="flex items-center gap-2 py-1">' +
        '<span class="w-2 h-2 rounded-full ' + dotColor + '"></span>' +
        '<span class="text-xs font-mono text-gray-300">' + escapeHtml(inv.name) + '</span>' +
        (inv.executable ? '' : '<span class="text-xs text-gray-600">(not executable)</span>') +
      '</div>';
    }).join('');
  } catch (e) {
    console.error('Failed to load invariants:', e);
  }
}

async function loadPersonas() {
  try {
    var data = await fetchAPI(apiUrl('/settings/personas'));
    var container = document.getElementById('personas-list');

    var html = '';
    if (data.detected) {
      html += '<div class="mb-3 text-xs">' +
        '<span class="text-gray-500">Detected:</span> ' +
        '<span class="text-accent-green font-medium">' + escapeHtml(data.detected) + '</span>' +
      '</div>';
    }

    if (data.personas.length === 0) {
      html += '<p class="text-gray-500 text-xs">No persona files found</p>';
    } else {
      html += data.personas.map(function(p) {
        var isActive = data.detected && p.name === data.detected;
        return '<div class="flex items-center gap-2 py-1">' +
          '<span class="w-2 h-2 rounded-full ' + (isActive ? 'bg-accent-green' : 'bg-gray-600') + '"></span>' +
          '<span class="text-xs text-gray-300">' + escapeHtml(p.name) + '</span>' +
          (isActive ? '<span class="text-xs text-accent-green">(active)</span>' : '') +
        '</div>';
      }).join('');
    }

    container.innerHTML = html;
  } catch (e) {
    console.error('Failed to load personas:', e);
  }
}

async function loadInstallationStatus() {
  var container = document.getElementById('installation-status');
  if (!container) return;
  try {
    var data = await fetchAPI(apiUrl('/settings/installation/status'));
    var html = '';

    if (data.has_updates) {
      html += '<div class="text-sm text-accent-yellow font-medium mb-2">' +
        data.total_updates + ' update' + (data.total_updates !== 1 ? 's' : '') + ' available</div>';

      var cmdCount = data.commands.changed.length + data.commands.new.length + data.commands.removed.length;
      var guideCount = data.guidelines.changed.length + data.guidelines.new.length + data.guidelines.removed.length;

      if (cmdCount > 0) {
        var parts = [];
        if (data.commands.changed.length > 0) parts.push(data.commands.changed.length + ' changed');
        if (data.commands.new.length > 0) parts.push(data.commands.new.length + ' new');
        if (data.commands.removed.length > 0) parts.push(data.commands.removed.length + ' removed');
        html += '<div class="text-xs text-gray-400 mb-1">Commands: ' + parts.join(', ') + '</div>';
      }

      if (guideCount > 0) {
        var gparts = [];
        if (data.guidelines.changed.length > 0) gparts.push(data.guidelines.changed.length + ' changed');
        if (data.guidelines.new.length > 0) gparts.push(data.guidelines.new.length + ' new');
        if (data.guidelines.removed.length > 0) gparts.push(data.guidelines.removed.length + ' removed');
        html += '<div class="text-xs text-gray-400 mb-1">Guidelines: ' + gparts.join(', ') + '</div>';
      }

      html += '<div class="mt-3 flex items-center gap-3">' +
        '<button type="button" id="btn-sync-installation" onclick="syncInstallation()" ' +
          'class="px-4 py-2 text-sm bg-accent/20 text-accent border border-accent/40 rounded hover:bg-accent/30 transition-colors">' +
          'Sync Now</button>' +
        '<span id="sync-installation-status" class="text-xs text-gray-500"></span>' +
      '</div>';
    } else {
      html += '<div class="text-sm text-accent-green mb-1">Up to date</div>' +
        '<div class="mt-2">' +
          '<button type="button" onclick="loadInstallationStatus()" ' +
            'class="text-xs text-gray-500 hover:text-gray-300 transition-colors">Re-check</button>' +
        '</div>';
    }

    container.innerHTML = html;
  } catch (e) {
    console.error('Failed to load installation status:', e);
    container.innerHTML = '<p class="text-gray-500 text-xs">Failed to check installation status</p>';
  }
}

async function syncInstallation() {
  var btn = document.getElementById('btn-sync-installation');
  var status = document.getElementById('sync-installation-status');
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = 'Syncing...';
  if (status) status.textContent = '';
  try {
    var res = await fetch(apiUrl('/setup/commands/sync'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
    });
    if (!res.ok) {
      var err = await res.json();
      if (status) {
        status.textContent = 'Error: ' + (err.detail || res.status);
        status.className = 'text-xs text-accent-red';
      }
      btn.disabled = false;
      btn.textContent = 'Sync Now';
      return;
    }
    var data = await res.json();
    var parts = [];
    if (data.commands && data.commands.updated > 0) {
      parts.push(data.commands.updated + ' command' + (data.commands.updated !== 1 ? 's' : '') + ' updated');
    }
    if (data.guidelines && data.guidelines.updated > 0) {
      parts.push(data.guidelines.updated + ' guideline' + (data.guidelines.updated !== 1 ? 's' : '') + ' updated');
    }
    if (parts.length === 0) parts.push('Already up to date');

    var conflicts = [];
    if (data.commands && data.commands.conflicts && data.commands.conflicts.length > 0) {
      conflicts = conflicts.concat(data.commands.conflicts);
    }
    if (data.guidelines && data.guidelines.conflicts && data.guidelines.conflicts.length > 0) {
      conflicts = conflicts.concat(data.guidelines.conflicts);
    }

    var container = document.getElementById('installation-status');
    var html = '<div class="text-sm text-accent-green mb-1">Sync complete</div>' +
      '<div class="text-xs text-gray-400 mb-1">' + escapeHtml(parts.join(', ')) + '</div>';

    if (conflicts.length > 0) {
      html += conflicts.map(function(f) {
        return '<div class="text-xs text-accent-yellow">! ' + escapeHtml(f) + ' -- locally modified, skipped</div>';
      }).join('');
    }

    html += '<div class="mt-2">' +
      '<button type="button" onclick="loadInstallationStatus()" ' +
        'class="text-xs text-gray-500 hover:text-gray-300 transition-colors">Re-check</button>' +
    '</div>';

    container.innerHTML = html;
  } catch (e) {
    if (status) {
      status.textContent = 'Error: ' + e.message;
      status.className = 'text-xs text-accent-red';
    }
    btn.disabled = false;
    btn.textContent = 'Sync Now';
  }
}

async function loadPersonaPreview() {
  var container = document.getElementById('persona-preview');
  if (!container) return;
  try {
    var data = await fetchAPI(apiUrl('/settings/persona'));
    var html = '';

    html += '<div class="text-xs text-gray-600 mb-2">' + escapeHtml(data.path) + '</div>';

    if (data.is_default) {
      html += '<div class="text-xs text-gray-500 mb-2">(using default template)</div>';
    }

    html += '<pre class="text-xs text-gray-400 whitespace-pre-wrap break-words font-mono ' +
      'bg-surface-hover/30 rounded p-3 max-h-48 overflow-y-auto">' +
      escapeHtml(data.content) + '</pre>';

    container.innerHTML = html;
  } catch (e) {
    console.error('Failed to load persona:', e);
    container.innerHTML = '<p class="text-gray-500 text-xs">Failed to load operations persona</p>';
  }
}

async function openPersonaEditor() {
  try {
    var res = await fetch(apiUrl('/settings/persona/open'), {method: 'POST'});
    if (!res.ok) {
      var err = await res.json();
      alert(err.detail || 'Failed to open editor');
    }
  } catch (e) {
    alert('Failed to open editor: ' + e.message);
  }
}

loadConfig();
loadCapacityRecommendation();

async function loadCapacityRecommendation() {
  try {
    var rec = await fetchAPI(apiUrl('/resources/capacity'));
    if (!rec) return;
    var callout = document.getElementById('capacity-callout');
    callout.classList.remove('hidden');
    document.getElementById('capacity-detail').textContent = rec.reason || 'Insufficient data for recommendation.';
    if (rec.confidence === 'insufficient') {
      document.getElementById('capacity-metrics').innerHTML =
        '<span class="text-xs text-gray-600">Confidence: insufficient</span>';
      return;
    }
    var confColor = rec.confidence === 'high' ? 'text-accent-green' : rec.confidence === 'medium' ? 'text-accent-yellow' : 'text-gray-400';
    var metricsContainer = document.getElementById('capacity-metrics');
    metricsContainer.innerHTML = '';
    function appendMetric(text, cls) {
      var span = document.createElement('span');
      span.className = cls;
      span.textContent = text;
      metricsContainer.appendChild(span);
    }
    appendMetric('Current: ' + rec.current_max, 'text-sm font-medium text-gray-300');
    appendMetric('Recommended: ' + rec.recommended_max, 'text-sm font-medium text-accent-purple');
    if (rec.headroom_cpu_percent != null) appendMetric('CPU headroom: ' + rec.headroom_cpu_percent + '%', 'text-xs text-gray-500');
    if (rec.headroom_memory_percent != null) appendMetric('Mem headroom: ' + rec.headroom_memory_percent + '%', 'text-xs text-gray-500');
    appendMetric('Confidence: ' + rec.confidence, 'text-xs ' + confColor);
  } catch (e) {
    // Capacity data not available
  }
}

let _labelsLoading = false;

async function loadLabelsStatus() {
  var container = document.getElementById('labels-status');
  if (!container) return;
  if (_labelsLoading) return;
  _labelsLoading = true;
  try {
    var data = await fetchAPI(apiUrl('/settings/labels/audit'));
    var html = '';

    if (data.error) {
      html += '<div class="text-sm text-accent-yellow mb-1">Warning</div>' +
        '<div class="text-xs text-gray-400 mb-2">' + escapeHtml(data.error) + '</div>' +
        '<div class="text-xs text-gray-500">Ensure GitHub CLI is installed and authenticated with <code class="font-mono bg-surface-hover/30 px-1 rounded">gh auth login</code></div>';
      container.innerHTML = html;
      return;
    }

    if (data.missing && data.missing.length > 0) {
      html += '<div class="text-sm text-accent-yellow font-medium mb-2">' +
        data.missing.length + ' missing label' + (data.missing.length !== 1 ? 's' : '') + '</div>';

      html += '<div class="text-xs text-gray-500 mb-3">Required labels for SOVA issue management</div>';

      html += '<div class="space-y-1 mb-3 max-h-32 overflow-y-auto">';
      var labelItems = data.missing.map(function(label) {
        return '<div class="flex items-center gap-2 text-xs">' +
          '<span class="inline-block w-3 h-3 rounded" style="background:#' + escapeHtml(label.color) + '"></span>' +
          '<span class="font-mono text-gray-300">' + escapeHtml(label.name) + '</span>' +
        '</div>';
      });
      html += labelItems.join('');
      html += '</div>';

      html += '<div class="mt-3 flex items-center gap-3">' +
        '<button type="button" id="btn-create-labels" onclick="createMissingLabels()" ' +
          'class="px-4 py-2 text-sm bg-accent/20 text-accent border border-accent/40 rounded hover:bg-accent/30 transition-colors">' +
          'Create ' + data.missing.length + ' missing label' + (data.missing.length !== 1 ? 's' : '') + '</button>' +
        '<span id="create-labels-status" class="text-xs text-gray-500"></span>' +
      '</div>';
    } else {
      html += '<div class="text-sm text-accent-green mb-1">All required labels exist</div>' +
        '<div class="text-xs text-gray-500">' + data.total_required + ' labels configured</div>' +
        '<div class="mt-2">' +
          '<button type="button" onclick="loadLabelsStatus()" ' +
            'class="text-xs text-gray-500 hover:text-gray-300 transition-colors">Re-check</button>' +
        '</div>';
    }

    container.innerHTML = html;
  } catch (e) {
    console.error('Failed to load labels status:', e);
    container.innerHTML = '<p class="text-gray-500 text-xs">Failed to check label status</p>';
  } finally {
    _labelsLoading = false;
  }
}

async function createMissingLabels() {
  var btn = document.getElementById('btn-create-labels');
  var status = document.getElementById('create-labels-status');
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = 'Creating...';
  if (status) status.textContent = '';
  try {
    var res = await fetch(apiUrl('/settings/labels/create'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
    });
    if (!res.ok) {
      var err = await res.json();
      showToast(err.detail || 'Failed to create labels', 'error');
      btn.disabled = false;
      btn.textContent = 'Retry';
      return;
    }
    var data = await res.json();
    var message = data.created + ' label' + (data.created !== 1 ? 's' : '') + ' created';
    if (data.errors && data.errors.length > 0) {
      var errorCount = data.errors.length;
      if (data.errors_truncated) {
        errorCount += data.errors_truncated;
      }
      showToast(message + ', but ' + errorCount + ' failed (see console)', 'warning');
      console.error('Label creation errors:', data.errors);
      if (data.errors_truncated) {
        console.warn('Plus ' + data.errors_truncated + ' more errors (truncated)');
      }
    } else {
      showToast(message, 'success');
    }
    loadLabelsStatus();
  } catch (e) {
    showToast('Failed to create labels: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Retry';
  }
}
</script>
