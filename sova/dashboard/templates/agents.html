{% extends "base.html" %}
{% block title %}Agents - SOVA{% endblock %}
{% block content %}
<h2 class="text-2xl font-semibold mb-6">Agents</h2>

<!-- Start Panel -->
<div class="bg-surface-card rounded-lg border border-gray-700/50 p-4 mb-6">
  <div class="flex items-center gap-3 flex-wrap">
    <!-- Issue combobox -->
    <div class="relative" id="issue-combobox">
      <input type="text" id="agent-issue" placeholder="Search issues..." autocomplete="off"
        class="bg-surface border border-gray-700 rounded px-3 py-2 text-sm text-gray-200 w-72 focus:border-accent focus:outline-none"
        oninput="filterIssues()" onfocus="showIssueDropdown()" onkeydown="issueKeydown(event)">
      <input type="hidden" id="agent-issue-number" value="">
      <div id="issue-dropdown"
        class="hidden absolute z-50 mt-1 w-96 max-h-64 overflow-y-auto bg-surface border border-gray-700 rounded-lg shadow-xl">
      </div>
    </div>
    <select id="agent-role" class="bg-surface border border-gray-700 rounded px-3 py-2 text-sm text-gray-200 focus:border-accent focus:outline-none"
      onchange="togglePrInput()">
      <option value="">Auto (dispatcher)</option>
      <option value="developer">Developer</option>
      <option value="triage">Triage</option>
      <option value="researcher">Researcher</option>
      <option value="reviewer">Reviewer</option>
    </select>
    <input type="text" id="agent-pr" placeholder="PR # (optional)"
      class="bg-surface border border-gray-700 rounded px-3 py-2 text-sm text-gray-200 w-36 focus:border-accent focus:outline-none hidden">
    <label class="flex items-center gap-1.5 text-sm text-gray-400 cursor-pointer select-none">
      <input type="checkbox" id="agent-force" class="rounded border-gray-600 bg-surface text-accent focus:ring-accent/50">
      <span>--force</span>
    </label>
    <button onclick="startAgent()" id="start-btn"
      class="px-4 py-2 rounded text-sm bg-accent/20 text-accent hover:bg-accent/30 transition-colors disabled:opacity-30 disabled:cursor-not-allowed">
      Start
    </button>
    <div class="flex-1"></div>
    <span id="slots-info" class="text-xs text-gray-500"></span>
  </div>
</div>

<!-- Handoff Action Panel (shown when no agents running but handoff awaits action) -->
<div id="handoff-panel" class="hidden mb-6">
  <div class="bg-accent-yellow/5 border border-accent-yellow/20 rounded-lg p-4">
    <div class="flex items-center gap-2 mb-3">
      <span class="w-2.5 h-2.5 rounded-full bg-accent-yellow animate-pulse"></span>
      <span class="text-sm text-accent-yellow font-medium">Review Complete -- Action Required</span>
    </div>
    <div id="handoff-panel-details" class="mb-3">
      <p id="handoff-panel-summary" class="text-sm text-gray-300"></p>
      <p id="handoff-panel-meta" class="text-xs text-gray-500 mt-1"></p>
    </div>
    <div id="handoff-panel-actions" class="flex flex-wrap gap-2"></div>
    <div class="mt-3 border-t border-gray-700/30 pt-3">
      <button onclick="dismissHandoff()" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">
        Dismiss
      </button>
    </div>
  </div>
</div>

<!-- Running Agents Grid -->
<div id="agents-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
  <div class="text-gray-500 text-sm">No agents running</div>
</div>

<!-- Interrupted Runs Banner -->
<div id="interrupted-banner" class="hidden mb-6"></div>

<!-- Log Viewer -->
<div id="log-viewer" class="hidden bg-surface-card rounded-lg border border-gray-700/50 overflow-hidden">
  <div class="flex items-center border-b border-gray-700/50">
    <div id="log-tabs" class="flex flex-1 overflow-x-auto"></div>
    <button onclick="closeLogViewer()" class="px-3 py-2 text-gray-500 hover:text-gray-300 text-xs transition-colors">Close</button>
  </div>
  <div id="log-content" class="p-4 font-mono text-xs text-gray-300 max-h-[500px] overflow-y-auto whitespace-pre-wrap"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
var activeLogRunId = null;

// -- Issue combobox --

var _allIssues = [];
var _filteredIssues = [];
var _highlightIdx = -1;
var _issuesLoaded = false;

async function loadIssues() {
  if (_issuesLoaded) return;
  try {
    var res = await fetch(apiUrl('/tasks/issues'));
    if (!res.ok) return;
    var data = await res.json();
    var issues = data.issues || [];
    _allIssues = issues.sort(function(a, b) {
      return parseInt(b.number) - parseInt(a.number);
    });
    if (issues.length > 0) _issuesLoaded = true;
  } catch (e) { /* ignore */ }
}

function stateTag(state) {
  var colors = {
    backlog: 'bg-gray-600/30 text-gray-400',
    triaged: 'bg-accent-yellow/20 text-accent-yellow',
    researched: 'bg-accent-purple/20 text-accent-purple',
    in_progress: 'bg-accent/20 text-accent',
    in_review: 'bg-accent-green/20 text-accent-green',
    done: 'bg-accent-green/30 text-accent-green',
  };
  var cls = colors[state] || 'bg-gray-600/30 text-gray-400';
  return '<span class="px-1.5 py-0.5 rounded text-xs ' + cls + '">' + escapeHtml(state) + '</span>';
}

function renderIssueDropdown() {
  var dd = document.getElementById('issue-dropdown');
  if (_filteredIssues.length === 0) {
    dd.innerHTML = '<div class="px-3 py-2 text-xs text-gray-500">No matching issues</div>';
    dd.classList.remove('hidden');
    return;
  }
  var html = _filteredIssues.map(function(issue, idx) {
    var active = idx === _highlightIdx ? 'bg-accent/10' : '';
    return '<div class="px-3 py-2 cursor-pointer hover:bg-accent/10 transition-colors text-sm ' + active + '" ' +
      'onmousedown="selectIssue(' + idx + ')" ' +
      'id="issue-opt-' + idx + '">' +
      '<div class="flex items-center gap-2">' +
        '<span class="text-accent font-medium">#' + escapeHtml(issue.number) + '</span>' +
        stateTag(issue.state) +
      '</div>' +
      '<div class="text-gray-300 text-xs mt-0.5 truncate">' + escapeHtml(issue.title) + '</div>' +
    '</div>';
  }).join('');
  dd.innerHTML = html;
  dd.classList.remove('hidden');
}

function filterIssues() {
  var q = document.getElementById('agent-issue').value.trim().toLowerCase().replace(/^#/, '');
  document.getElementById('agent-issue-number').value = '';
  if (!q) {
    _filteredIssues = _allIssues.slice(0, 20);
  } else {
    _filteredIssues = _allIssues.filter(function(i) {
      return i.number.toString().includes(q) || i.title.toLowerCase().includes(q);
    }).slice(0, 20);
  }
  _highlightIdx = -1;
  renderIssueDropdown();
}

function showIssueDropdown() {
  loadIssues().then(function() {
    filterIssues();
  });
}

function hideIssueDropdown() {
  document.getElementById('issue-dropdown').classList.add('hidden');
}

function selectIssue(idx) {
  var issue = _filteredIssues[idx];
  if (!issue) return;
  document.getElementById('agent-issue').value = '#' + issue.number + ' ' + issue.title;
  document.getElementById('agent-issue-number').value = issue.number;
  hideIssueDropdown();
}

function issueKeydown(e) {
  var dd = document.getElementById('issue-dropdown');
  if (dd.classList.contains('hidden')) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _highlightIdx = Math.min(_highlightIdx + 1, _filteredIssues.length - 1);
    renderIssueDropdown();
    var el = document.getElementById('issue-opt-' + _highlightIdx);
    if (el) el.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _highlightIdx = Math.max(_highlightIdx - 1, 0);
    renderIssueDropdown();
    var el2 = document.getElementById('issue-opt-' + _highlightIdx);
    if (el2) el2.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (_highlightIdx >= 0) {
      selectIssue(_highlightIdx);
    } else if (_filteredIssues.length > 0) {
      selectIssue(0);
    }
  } else if (e.key === 'Escape') {
    hideIssueDropdown();
  }
}

document.addEventListener('click', function(e) {
  if (!document.getElementById('issue-combobox').contains(e.target)) {
    hideIssueDropdown();
  }
});
var logCursor = 0;
var agentPollInterval = null;
var logPollInterval = null;

async function loadAgents() {
  try {
    var data = await fetchAPI(apiUrl('/agents/active'));
    var grid = document.getElementById('agents-grid');
    var slotsInfo = document.getElementById('slots-info');
    var startBtn = document.getElementById('start-btn');

    slotsInfo.textContent = data.slots_available + '/' + data.max_concurrent + ' slots available';
    startBtn.disabled = data.slots_available <= 0;

    if (data.agents.length === 0 && data.completed.length === 0) {
      grid.innerHTML = '<div class="col-span-2 text-gray-500 text-sm py-8 text-center">No agents running</div>';
      updateLogTabs([]);
      checkStandaloneHandoff();
      return;
    }
    hideHandoffPanel();

    var cards = [];

    // Running agents
    data.agents.forEach(function(agent) {
      cards.push(renderAgentCard(agent, false));
    });

    // Recently completed
    data.completed.forEach(function(agent) {
      cards.push(renderCompletedCard(agent));
    });

    grid.innerHTML = cards.join('');
    updateLogTabs(data.agents);
    checkHandoffForAgents(data.agents);
  } catch (e) {
    console.error('Failed to load agents:', e);
  }
}

function renderAgentCard(agent, completed) {
  var colors = roleColor(agent.role);
  var pipeline = renderStepPipeline(agent.current_step, agent.role, false);
  var cost = agent.cost_usd ? '$' + agent.cost_usd.toFixed(4) : '$0.00';
  var elapsed = formatElapsed(agent.elapsed_seconds);

  return '<div id="agent-card-' + agent.run_id + '" class="bg-surface-card rounded-lg border ' + colors.border + ' p-4 transition-all">' +
    '<div class="flex items-center justify-between mb-3">' +
      '<div class="flex items-center gap-2">' +
        '<span class="w-2 h-2 rounded-full ' + colors.dot + ' animate-pulse"></span>' +
        '<span class="text-sm font-medium text-gray-200">#' + escapeHtml(agent.issue) + '</span>' +
        '<span class="px-1.5 py-0.5 rounded text-xs font-medium ' + colors.bg + ' ' + colors.text + '">' + escapeHtml(formatRole(agent.role)) + '</span>' +
        (agent.source === 'external' ? '<span class="px-1.5 py-0.5 rounded text-xs font-medium bg-gray-700 text-gray-300">CLI</span>' : '') +
      '</div>' +
      '<div class="flex items-center gap-3 text-xs">' +
        '<span class="text-accent-green">' + cost + '</span>' +
        '<span class="text-gray-500">' + elapsed + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="mb-3">' + pipeline + '</div>' +
    '<div id="handoff-inline-' + agent.run_id + '"></div>' +
    '<div class="flex items-center gap-2 mt-3">' +
      '<button onclick="viewLogs(' + agent.run_id + ')" class="px-3 py-1.5 rounded text-xs bg-surface-hover text-gray-300 hover:text-white transition-colors">' +
        (activeLogRunId === agent.run_id ? 'Viewing Logs' : 'View Logs') +
      '</button>' +
      (agent.source !== 'external'
        ? '<button onclick="stopAgent(' + agent.run_id + ')" class="px-3 py-1.5 rounded text-xs bg-accent-red/10 text-accent-red hover:bg-accent-red/20 transition-colors">Stop</button>'
        : '') +
    '</div>' +
  '</div>';
}

function renderCompletedCard(agent) {
  var colors = roleColor(agent.role);
  var borderColor = agent.status === 'done' ? 'border-accent-green/40' : 'border-accent-red/40';
  var statusDotClass = agent.status === 'done' ? 'bg-accent-green' : 'bg-accent-red';
  var cost = agent.cost_usd ? '$' + agent.cost_usd.toFixed(4) : '$0.00';
  var agoText = agent.completed_seconds_ago + 's ago';

  return '<div class="bg-surface-card rounded-lg border ' + borderColor + ' p-4 opacity-75 transition-all">' +
    '<div class="flex items-center justify-between">' +
      '<div class="flex items-center gap-2">' +
        '<span class="w-2 h-2 rounded-full ' + statusDotClass + '"></span>' +
        '<span class="text-sm font-medium text-gray-300">#' + escapeHtml(agent.issue) + '</span>' +
        '<span class="px-1.5 py-0.5 rounded text-xs font-medium ' + colors.bg + ' ' + colors.text + '">' + escapeHtml(formatRole(agent.role)) + '</span>' +
        '<span class="text-xs ' + (agent.status === 'done' ? 'text-accent-green' : 'text-accent-red') + '">' + agent.status + '</span>' +
      '</div>' +
      '<div class="flex items-center gap-3 text-xs">' +
        '<span class="text-accent-green">' + cost + '</span>' +
        '<span class="text-gray-500">' + agoText + '</span>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// -- Log Viewer --

function updateLogTabs(agents) {
  var tabs = document.getElementById('log-tabs');
  if (!tabs) return;

  if (agents.length === 0) {
    if (activeLogRunId !== null) closeLogViewer();
    return;
  }

  tabs.innerHTML = agents.map(function(a) {
    var colors = roleColor(a.role);
    var isActive = activeLogRunId === a.run_id;
    var activeClass = isActive ? 'bg-surface text-white border-b-2 border-accent' : 'text-gray-500 hover:text-gray-300';
    return '<button onclick="viewLogs(' + a.run_id + ')" class="px-4 py-2 text-xs transition-colors whitespace-nowrap ' + activeClass + '">' +
      '#' + escapeHtml(a.issue) + ' <span class="' + colors.text + '">' + escapeHtml(formatRole(a.role)) + '</span>' +
    '</button>';
  }).join('');
}

function viewLogs(runId) {
  var viewer = document.getElementById('log-viewer');
  var content = document.getElementById('log-content');

  if (activeLogRunId === runId) {
    closeLogViewer();
    return;
  }

  activeLogRunId = runId;
  logCursor = 0;
  content.textContent = '';
  viewer.classList.remove('hidden');

  pollLogs();

  if (logPollInterval) clearInterval(logPollInterval);
  logPollInterval = setInterval(pollLogs, 1000);
}

function closeLogViewer() {
  activeLogRunId = null;
  logCursor = 0;
  if (logPollInterval) { clearInterval(logPollInterval); logPollInterval = null; }
  var viewer = document.getElementById('log-viewer');
  if (viewer) viewer.classList.add('hidden');
}

async function pollLogs() {
  if (activeLogRunId === null) return;
  try {
    var data = await fetchAPI(apiUrl('/agents/' + activeLogRunId + '/output?since=' + logCursor));
    if (data.lines && data.lines.length > 0) {
      var content = document.getElementById('log-content');
      data.lines.forEach(function(line) {
        content.textContent += line + '\n';
      });
      logCursor = data.total;
      content.scrollTop = content.scrollHeight;
    }
  } catch (e) {
    // Agent may have completed
  }
}

// -- Agent actions --

function togglePrInput() {
  var role = document.getElementById('agent-role').value;
  var prEl = document.getElementById('agent-pr');
  if (role === 'reviewer') {
    prEl.classList.remove('hidden');
  } else {
    prEl.classList.add('hidden');
    prEl.value = '';
  }
}

async function startAgent() {
  var issueEl = document.getElementById('agent-issue');
  var issueNumEl = document.getElementById('agent-issue-number');
  var roleEl = document.getElementById('agent-role');
  var forceEl = document.getElementById('agent-force');
  var prEl = document.getElementById('agent-pr');
  var issue = issueNumEl.value || issueEl.value.replace(/^#/, '').split(/\s/)[0].trim();
  if (!issue) { issueEl.focus(); return; }

  var btn = document.getElementById('start-btn');
  btn.disabled = true;
  btn.textContent = 'Starting...';

  var payload = {
    issue: issue,
    role: roleEl.value || null,
    force: forceEl.checked,
  };
  var prVal = prEl.value.trim();
  if (prVal) payload.pr_number = parseInt(prVal, 10);

  try {
    var result = await fetch(apiUrl('/agents/start'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).then(function(r) { return r.json(); });

    if (result.error) {
      alert(result.error);
    } else {
      issueEl.value = '';
      issueNumEl.value = '';
      prEl.value = '';
      forceEl.checked = false;
      if (result.run_id) viewLogs(result.run_id);
    }
  } catch (e) {
    alert('Failed to start agent: ' + e.message);
  }

  btn.disabled = false;
  btn.textContent = 'Start';
  loadAgents();
}

async function stopAgent(runId) {
  try {
    await fetch(apiUrl('/agents/' + runId + '/stop'), { method: 'POST' });
    loadAgents();
  } catch (e) {
    alert('Failed to stop agent: ' + e.message);
  }
}

// -- Handoff inline --

async function checkHandoffForAgents(agents) {
  try {
    var res = await fetch(apiUrl('/handoff'));
    if (!res.ok) return;
    var data = await res.json();

    if (!data.has_handoff || !data.handoff) return;
    var handoff = data.handoff;
    if (handoff.status !== 'awaiting_action') return;

    var targetIssue = handoff.issue || '';

    agents.forEach(function(agent) {
      var container = document.getElementById('handoff-inline-' + agent.run_id);
      if (!container) return;

      if (targetIssue && targetIssue !== agent.issue) {
        container.innerHTML = '';
        return;
      }

      var actions = (handoff.next_actions || []).map(function(action) {
        var btnStyle = action.style === 'approve' ? 'bg-accent-green/20 text-accent-green hover:bg-accent-green/30' :
                       action.style === 'danger' ? 'bg-accent-red/20 text-accent-red hover:bg-accent-red/30' :
                       'bg-accent/20 text-accent hover:bg-accent/30';
        return '<button onclick="executeHandoffAction(\'' + escapeHtml(action.id) + '\')" ' +
          'class="px-3 py-1.5 rounded text-xs transition-colors ' + btnStyle + '" title="' + escapeHtml(action.description || '') + '">' +
          escapeHtml(action.label) + '</button>';
      }).join(' ');

      container.innerHTML = '<div class="bg-accent-yellow/5 border border-accent-yellow/20 rounded p-3 mt-2">' +
        '<div class="flex items-center gap-2 mb-2">' +
          '<span class="w-2 h-2 rounded-full bg-accent-yellow animate-pulse"></span>' +
          '<span class="text-xs text-accent-yellow font-medium">Action Required</span>' +
        '</div>' +
        '<p class="text-xs text-gray-300 mb-2">' + escapeHtml(handoff.summary || '') + '</p>' +
        '<div class="flex gap-2">' + actions + '</div>' +
      '</div>';
    });
  } catch (e) { /* ignore */ }
}

async function executeHandoffAction(actionId) {
  try {
    await fetch(apiUrl('/handoff/execute'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action_id: actionId }),
    });
    loadAgents();
  } catch (e) {
    alert('Failed to execute action: ' + e.message);
  }
}

// -- Standalone handoff panel (shown when no agents running) --

async function checkStandaloneHandoff() {
  try {
    var res = await fetch(apiUrl('/handoff'));
    if (!res.ok) { hideHandoffPanel(); return; }
    var data = await res.json();

    if (!data.has_handoff || !data.handoff || data.handoff.status !== 'awaiting_action') {
      hideHandoffPanel();
      return;
    }

    var handoff = data.handoff;
    var panel = document.getElementById('handoff-panel');
    var summary = document.getElementById('handoff-panel-summary');
    var meta = document.getElementById('handoff-panel-meta');
    var actionsDiv = document.getElementById('handoff-panel-actions');

    summary.textContent = handoff.summary || 'Review completed';
    var metaParts = [];
    if (handoff.issue) metaParts.push('Issue #' + handoff.issue);
    if (handoff.pr_number) metaParts.push('PR #' + handoff.pr_number);
    if (handoff.details && handoff.details.cost_usd) metaParts.push('Cost: $' + parseFloat(handoff.details.cost_usd).toFixed(4));
    meta.textContent = metaParts.join('  |  ');

    var actions = (handoff.next_actions || []).map(function(action) {
      var btnStyle = action.style === 'approve'
        ? 'bg-accent-green/20 text-accent-green hover:bg-accent-green/30 border border-accent-green/30'
        : action.style === 'danger'
        ? 'bg-accent-red/20 text-accent-red hover:bg-accent-red/30 border border-accent-red/30'
        : 'bg-accent/20 text-accent hover:bg-accent/30 border border-accent/30';
      return '<button onclick="executeHandoffAction(\'' + escapeHtml(action.id) + '\')" ' +
        'class="px-4 py-2 rounded text-sm font-medium transition-colors ' + btnStyle + '" ' +
        'title="' + escapeHtml(action.description || '') + '">' +
        escapeHtml(action.label) + '</button>';
    }).join(' ');

    actionsDiv.innerHTML = actions;
    panel.classList.remove('hidden');
  } catch (e) {
    hideHandoffPanel();
  }
}

function hideHandoffPanel() {
  document.getElementById('handoff-panel').classList.add('hidden');
}

async function dismissHandoff() {
  try {
    await fetch(apiUrl('/handoff/clear'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
    });
  } catch (e) { /* ignore */ }
  hideHandoffPanel();
}

// -- Interrupted runs --

async function checkInterrupted() {
  try {
    var data = await fetchAPI(apiUrl('/agents/interrupted'));
    var banner = document.getElementById('interrupted-banner');
    if (!data.interrupted || data.interrupted.length === 0) {
      banner.classList.add('hidden');
      return;
    }

    banner.classList.remove('hidden');
    banner.innerHTML = '<div class="bg-accent-yellow/10 border border-accent-yellow/30 rounded-lg p-4">' +
      '<div class="flex items-center justify-between mb-2">' +
        '<div class="flex items-center gap-2">' +
          '<span class="text-sm font-medium text-accent-yellow">Interrupted Runs</span>' +
          '<span class="text-xs text-gray-500">Dashboard was restarted while these were running</span>' +
        '</div>' +
        '<button onclick="dismissInterrupted()" class="px-2 py-1 rounded text-xs text-gray-500 hover:text-gray-300 hover:bg-surface-hover transition-colors">Dismiss all</button>' +
      '</div>' +
      '<div class="flex flex-wrap gap-2">' +
      data.interrupted.map(function(r) {
        return '<button onclick="restartInterrupted(\'' + escapeHtml(r.issue_number) + '\', \'' + escapeHtml(formatRole(r.role)) + '\')" ' +
          'class="px-3 py-1.5 rounded text-xs bg-accent-yellow/20 text-accent-yellow hover:bg-accent-yellow/30 transition-colors">' +
          '#' + escapeHtml(r.issue_number) + ' ' + escapeHtml(formatRole(r.role)) +
        '</button>';
      }).join('') +
      '</div>' +
    '</div>';
  } catch (e) { /* ignore */ }
}

async function dismissInterrupted() {
  try {
    await fetch(apiUrl('/agents/interrupted/dismiss'), { method: 'POST' });
    document.getElementById('interrupted-banner').classList.add('hidden');
  } catch (e) { /* ignore */ }
}

function restartInterrupted(issue, role) {
  document.getElementById('agent-issue').value = issue;
  document.getElementById('agent-role').value = role === 'auto' ? '' : role;
  startAgent();
}

// -- Init --
loadAgents();
checkInterrupted();
agentPollInterval = setInterval(loadAgents, 2000);
</script>
{% endblock %}
