{% extends "base.html" %}
{% block title %}Agents - SOVA{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-4">
  <h2 class="text-2xl font-semibold">Agents</h2>
  <button onclick="startPlanner()" id="run-planner-btn"
    class="px-3 py-1.5 rounded text-sm bg-accent-purple/20 text-accent-purple hover:bg-accent-purple/30 border border-accent-purple/30 transition-colors"
    data-tooltip="Analyze project and propose new tasks" data-tooltip-pos="left">
    Run Planner
  </button>
</div>

<!-- Task Browser -->
<div class="bg-surface-card rounded-lg border border-gray-700/50 mb-6">
  <!-- Header bar -->
  <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-700/50">
    <h3 class="text-sm font-medium text-gray-300">Tasks</h3>
    <span id="tasks-attention-badge" class="hidden w-5 h-5 rounded-full bg-accent-peach text-surface text-xs font-bold flex items-center justify-center -ml-1" data-tooltip="Items needing your attention"></span>
    <div class="relative flex-1 max-w-xs ml-2">
      <label for="task-search" class="sr-only">Search issues</label>
      <input type="text" id="task-search" placeholder="Search all issues..." autocomplete="off"
        class="w-full bg-surface border border-gray-700 rounded px-3 py-1.5 text-xs text-gray-200 pl-8 focus:border-accent focus:outline-none"
        oninput="filterTaskCards()">
      <svg class="absolute left-2.5 top-2 w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </div>
    <span id="slots-info" class="text-xs text-gray-600 ml-auto"></span>
  </div>
  <!-- Task list -->
  <div id="task-grid" class="divide-y divide-gray-700/30">
    <p class="text-gray-500 text-sm py-6 text-center">Loading tasks...</p>
  </div>
</div>

<!-- PR Tracker -->
<div class="bg-surface-card rounded-lg border border-gray-700/50 mb-6">
  <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-700/50">
    <button id="pr-tracker-toggle" type="button" class="flex items-center gap-3 cursor-pointer select-none text-left flex-1" onclick="togglePrTracker()" aria-controls="pr-tracker-list" aria-expanded="true">
      <h3 class="text-sm font-medium text-gray-300">Pull Requests</h3>
      <span id="pr-tracker-count" class="text-xs text-gray-500"></span>
    </button>
    <div id="pr-filter-toggle" class="flex rounded-md overflow-hidden border border-gray-600/50 text-xs" onclick="event.stopPropagation()">
      <button type="button" data-pr-filter="mine" onclick="setPrFilter('mine')" class="px-2.5 py-1 transition-colors">Mine</button>
      <button type="button" data-pr-filter="all" onclick="setPrFilter('all')" class="px-2.5 py-1 transition-colors">All</button>
    </div>
    <svg id="pr-tracker-chevron" class="w-4 h-4 text-gray-500 transition-transform shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
  </div>
  <div id="pr-summary-strip" class="hidden"></div>
  <div id="pr-tracker-list" class="divide-y divide-gray-700/30">
    <p class="text-gray-500 text-sm py-4 text-center">Loading PRs...</p>
  </div>
</div>

<!-- CodeRabbit Quota Widget -->
<div id="cr-quota-widget" class="hidden bg-surface-card rounded-lg border border-gray-700/50 mb-6 px-4 py-3">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span id="cr-quota-dot" class="w-2 h-2 rounded-full bg-accent-green"></span>
      <span class="text-sm font-medium text-gray-300">CodeRabbit Quota</span>
      <span id="cr-quota-usage" class="text-xs text-gray-500"></span>
    </div>
    <div class="flex items-center gap-2">
      <span id="cr-quota-status" class="text-xs"></span>
      <button onclick="_syncCrQuota()" class="text-xs text-gray-500 hover:text-gray-300 transition-colors" data-tooltip="Sync from GitHub">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>
    </div>
  </div>
  <div id="cr-quota-bar-container" class="mt-2">
    <div class="w-full bg-surface rounded-full h-1.5">
      <div id="cr-quota-bar" class="h-1.5 rounded-full transition-all duration-300" style="width: 0%"></div>
    </div>
  </div>
  <div id="cr-quota-wait" class="hidden mt-1 text-xs text-accent-peach"></div>
</div>

<!-- Hidden inputs for runCommand/startAgent backward compat -->
<input type="hidden" id="agent-issue" value="">
<input type="hidden" id="agent-issue-number" value="">

<!-- PR Actions Panel (shown when selected issue has a linked PR) -->
<div id="pr-actions-panel" class="hidden mb-6">
  <div id="pr-actions-card" class="rounded-lg border p-4">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <span id="pr-status-dot" class="w-2.5 h-2.5 rounded-full"></span>
        <span id="pr-status-label" class="text-sm font-medium"></span>
        <a id="pr-link" href="#" target="_blank" class="text-xs text-gray-500 hover:text-accent transition-colors">view on GitHub</a>
      </div>
      <div id="pr-status-badges" class="flex items-center gap-2"></div>
    </div>
    <p id="pr-title" class="text-sm text-gray-300 mb-3"></p>
    <div id="pr-action-buttons" class="flex flex-wrap gap-2"></div>
  </div>
</div>

<!-- Handoff actions are now rendered inline in task cards -->

<!-- View Toggle -->
<div class="flex items-center gap-1 mb-4">
  <button onclick="switchAgentView('list')" id="view-list"
    class="px-3 py-1.5 text-xs font-medium rounded-l border border-gray-700 transition-colors bg-surface-hover text-white">
    List
  </button>
  <button onclick="switchAgentView('kanban')" id="view-kanban"
    class="px-3 py-1.5 text-xs font-medium rounded-r border border-gray-700 transition-colors bg-surface text-gray-500 hover:text-gray-300">
    Pipeline
  </button>
</div>

<!-- Running Agents Grid (list view) -->
<div id="agents-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
  <div class="text-gray-500 text-sm">No agents running</div>
</div>

<!-- Kanban Board (pipeline view) -->
<div id="kanban-grid" class="hidden mb-6 overflow-x-auto">
  <div id="kanban-columns" class="flex gap-3 min-h-[200px] pb-2">
    <p class="text-gray-500 text-sm py-8 text-center w-full">Loading pipeline view...</p>
  </div>
</div>

<!-- Memory Pressure Banner -->
<div id="memory-pressure-banner" class="hidden mb-6"></div>

<!-- Interrupted Runs Banner -->
<div id="interrupted-banner" class="hidden mb-6"></div>

<!-- Log Viewer -->
<div id="log-viewer" class="hidden bg-surface-card rounded-lg border border-gray-700/50 overflow-hidden mb-6">
  <div class="flex items-center border-b border-gray-700/50">
    <div id="log-tabs" class="flex flex-1 overflow-x-auto"></div>
    <button onclick="closeLogViewer()" class="px-3 py-2 text-gray-500 hover:text-gray-300 text-xs transition-colors" data-tooltip="Close log viewer">Close</button>
  </div>
  <div id="log-content" class="p-4 font-mono text-xs text-gray-300 max-h-[500px] overflow-y-auto whitespace-pre-wrap"></div>
</div>

<!-- History Section -->
<div class="border-t border-gray-700/30 pt-6">
  <div class="flex items-center gap-1 mb-4 border-b border-gray-700/50">
    <button onclick="switchTab('history')" id="tab-history"
      class="px-4 py-2.5 text-sm transition-colors border-b-2 border-accent text-white"
      data-tooltip="Completed run history" data-tooltip-pos="bottom">
      History
    </button>
    <button onclick="switchTab('failed')" id="tab-failed"
      class="px-4 py-2.5 text-sm transition-colors border-b-2 border-transparent text-gray-500 hover:text-gray-300"
      data-tooltip="Failed runs only" data-tooltip-pos="bottom">
      Failed <span id="tab-failed-count" class="text-xs text-gray-500 ml-1"></span>
    </button>
  </div>

  <div id="panel-history">
    <div class="flex items-center gap-3 mb-4">
      <select id="filter-role" onchange="historyPage=0; loadHistory()" class="bg-surface border border-gray-700 rounded px-3 py-1.5 text-xs text-gray-300 focus:border-accent focus:outline-none">
        <option value="">All roles</option>
        <option value="developer">Developer</option>
        <option value="triage">Triage</option>
        <option value="researcher">Researcher</option>
        <option value="reviewer">Reviewer</option>
        <option value="auto">Auto</option>
      </select>
      <div id="history-pager" class="hidden flex items-center gap-2 ml-auto text-xs text-gray-500">
        <button onclick="historyPrev()" id="history-prev" class="px-2 py-1 rounded hover:bg-surface-hover disabled:opacity-30 transition-colors" disabled>&lt; Prev</button>
        <span id="history-page-info"></span>
        <button onclick="historyNext()" id="history-next" class="px-2 py-1 rounded hover:bg-surface-hover disabled:opacity-30 transition-colors" disabled>Next &gt;</button>
      </div>
    </div>
    <div id="history-table"></div>
  </div>

  <div id="panel-failed" class="hidden">
    <div class="flex items-center gap-3 mb-4">
      <div id="failed-pager" class="hidden flex items-center gap-2 ml-auto text-xs text-gray-500">
        <button onclick="failedPrev()" id="failed-prev" class="px-2 py-1 rounded hover:bg-surface-hover disabled:opacity-30 transition-colors" disabled>&lt; Prev</button>
        <span id="failed-page-info"></span>
        <button onclick="failedNext()" id="failed-next" class="px-2 py-1 rounded hover:bg-surface-hover disabled:opacity-30 transition-colors" disabled>Next &gt;</button>
      </div>
    </div>
    <div id="failed-table"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var activeLogRunId = null;

// Shared 1s interval to update all elapsed timers on the page
setInterval(function() {
  var els = document.querySelectorAll('.sova-status-elapsed');
  if (els.length === 0) return;
  var now = Date.now();
  els.forEach(function(el) {
    var start = parseInt(el.getAttribute('data-start'), 10);
    if (!start) return;
    var secs = Math.max(0, Math.round((now - start) / 1000));
    el.textContent = formatElapsed(secs);
  });
}, 1000);

// -- Task browser --

var _agentHistory = [];
var _suggested = [];
var _runningIssues = new Set();
var _runningAgents = {};

var _roleLabels = {
  'command:integrate-pr': 'Integrating',
  'command:address-pr': 'Addressing PR',
  'command:review-pr': 'Reviewing PR',
  'reviewer': 'Reviewing',
  'developer': 'Developing',
  'triage': 'Triaging',
  'researcher': 'Researching',
  'planner': 'Planning',
};

function stateTag(state, stateLabel, stateColor) {
  var label = stateLabel || state;
  var cls = stateColor || 'bg-gray-600/30 text-gray-400';
  return '<span class="px-2 py-0.5 rounded-full text-xs whitespace-nowrap ' + cls + '">' + escapeHtml(label) + '</span>';
}

var _TIER2_PAGE_SIZE = 15;
var _MIN_BEFORE_COLLAPSE = 8;
var _expansionTier = 0; // 0=top priority only, 1=+15 more, 2=show all
var _cardMenuOpen = false;
var _completedCleanupTimer = null;
var _workItems = [];

// LLM suggestion experiment: keyed by issueKey (issue_number or "pr:N")
// Value: {action_id, action_label, reasoning, for_state, done, pr_number, issue_number,
//         deterministic_action_id, llm_reasoning} | null (null = LLM agrees or unavailable)
var _llmSuggestions = {};
var _llmSuggestionFetching = new Set();

var _PR_STAGE_STATES = new Set([
  'pr_draft', 'pr_ci_running', 'pr_ci_failed',
  'pr_awaiting_review', 'pr_sova_pending',
  'pr_changes_requested', 'pr_sova_changes', 'pr_external_changes',
  'pr_review_addressed', 'pr_approved', 'pr_ready_to_merge'
]);

async function loadWorkItems() {
  try {
    var res = await fetch(apiUrl('/agents/work-items'));
    if (!res.ok) return;
    var data = await res.json();
    _workItems = data.items || [];

    var slotsInfo = document.getElementById('slots-info');
    slotsInfo.textContent = data.slots_available + '/' + data.max_concurrent + ' slots';

    _runningAgents = {};
    _workItems.forEach(function(item) {
      if (item.running_agent && item.issue_number) {
        _runningAgents[String(item.issue_number)] = {
          role: item.running_agent.role,
          run_id: item.running_agent.run_id,
        };
      }
    });
    _runningIssues = new Set(Object.keys(_runningAgents));

    _agentHistory = _workItems.filter(function(i) { return i.last_run || i.pr_number; });
    _suggested = _workItems.filter(function(i) {
      return !i.last_run && !i.pr_number && (i.state === 'triaged' || i.state === 'researched');
    });

    var attentionCount = _workItems.filter(function(i) {
      return i.state === 'handoff_pending' || i.state === 'spec_review' ||
        i.state === 'pr_ready_to_merge' || i.state === 'pr_changes_requested';
    }).length;
    var badge = document.getElementById('tasks-attention-badge');
    if (badge) {
      if (attentionCount > 0) {
        badge.textContent = attentionCount;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    renderTaskCards();
  } catch (e) {
    document.getElementById('task-grid').innerHTML =
      '<p class="text-accent-red text-sm py-6 text-center">Failed to load tasks</p>';
  }
}

function loadTaskCards() { loadWorkItems(); }

function filterTaskCards() {
  renderTaskCards();
}

function expandTasks() {
  _expansionTier++;
  renderTaskCards();
}

function collapseTasks() {
  _expansionTier = 0;
  renderTaskCards();
}

function _extractPriority(labels) {
  for (var i = 0; i < (labels || []).length; i++) {
    var l = labels[i];
    if (l.indexOf('priority:') === 0) return l.replace('priority: ', '').replace('priority:', '').trim();
  }
  return '';
}

var _priorityOrder = { critical: 0, high: 1, medium: 2, low: 3 };

function _renderHandoffBtn(ha, issueNumber) {
  var cls = _actionStyles[ha.style] || _actionStyles.warning;
  return '<button onclick="executeHandoffAction(\'' + escapeJsStr(ha.id || ha.action || ha.label) + '\', \'' + escapeJsStr(issueNumber || '') + '\')" ' +
    'class="text-xs px-3 py-1 rounded transition-colors whitespace-nowrap ' + cls + '">' +
    escapeHtml(ha.label) + '</button>';
}

var _actionStyles = {
  success: 'bg-accent-green/20 text-accent-green hover:bg-accent-green/30',
  warning: 'bg-accent-yellow/20 text-accent-yellow hover:bg-accent-yellow/30',
  danger: 'bg-accent-red/20 text-accent-red hover:bg-accent-red/30',
  primary: 'bg-accent/20 text-accent hover:bg-accent/30',
  purple: 'bg-accent-purple/20 text-accent-purple hover:bg-accent-purple/30',
  approve: 'bg-accent-green/20 text-accent-green hover:bg-accent-green/30',
  neutral: 'bg-gray-600/30 text-gray-400 hover:bg-gray-600/50',
};

function _renderGateBlockedBtn(gateResult, label, cssClass) {
  if (!gateResult || gateResult.passed) return null;
  var reasons = (gateResult.gates || [])
    .filter(function(g) { return g.enabled && !g.passed; })
    .map(function(g) { return g.reason || g.name; });
  var tooltip = 'Blocked: ' + reasons.join('; ');
  return '<button disabled class="' + cssClass + '" data-tooltip="' + escapeHtml(tooltip) + '">' +
    escapeHtml(label) + '</button>';
}

function _renderActionBtn(action, issueKey) {
  if (!action) return '';
  var cls = _actionStyles[action.style] || _actionStyles.primary;
  var args = action.handler_args || {};
  var onclick;
  if (action.handler === 'start_agent') {
    var issueArg = args.issue ? String(args.issue) : '';
    onclick = "quickStartRole('" + escapeJsStr(issueArg) + "', '" + escapeJsStr(args.role || 'developer') + "'" +
      (args.pr ? ', ' + Number(args.pr) : '') + ")";
  } else if (action.handler === 'run_command') {
    var cmdArgs = [];
    if (args.issue) cmdArgs.push('issue: \'' + escapeJsStr(String(args.issue)) + '\'');
    if (args.pr) cmdArgs.push('pr: ' + Number(args.pr));
    onclick = "runCommand('" + escapeJsStr(args.command || '') + "', {" + cmdArgs.join(', ') + "})";
  } else if (action.handler === 'resume_from_approval') {
    onclick = "resumeFromApproval(" + Number(args.run_id) + ")";
  } else if (action.handler === 'handoff_execute') {
    onclick = "executeHandoffAction('" + escapeJsStr(action.id) + "', '" + escapeJsStr(issueKey) + "')";
  } else {
    return '';
  }
  var blocked = _renderGateBlockedBtn(action.gate_result, action.label,
    'text-xs px-3 py-1 rounded whitespace-nowrap bg-gray-600/30 text-gray-500 cursor-not-allowed');
  if (blocked) return blocked;
  return '<button onclick="' + onclick + '" ' +
    'class="text-xs px-3 py-1 rounded transition-colors whitespace-nowrap ' + cls + '">' +
    escapeHtml(action.label) + '</button>';
}

function renderTaskCard(item) {
  var issueKey = item.issue_number || ('pr:' + item.pr_number);
  var isRunning = item.state === 'agent_running';
  var p = _extractPriority(item.labels);
  var pDots = { critical: 'bg-accent-red', high: 'bg-accent-yellow', medium: 'bg-gray-500', low: 'bg-gray-600' };
  var pDot = p ? '<span class="w-1.5 h-1.5 rounded-full shrink-0 ' + (pDots[p] || 'bg-gray-600') + '"></span>' : '';

  var handoffActions = item.handoff_actions || [];
  var isSpecReview = item.state === 'spec_review';
  var isMultiAction = (item.state === 'handoff_pending') && handoffActions.length > 1;

  var specPrimaryBtns = '';
  var specMenuActions = [];
  if (isSpecReview) {
    var prefix = window.SOVA_PROJECT_SLUG ? '/p/' + window.SOVA_PROJECT_SLUG : '';
    var specUrl = prefix + '/spec/' + (item.issue_number || '');
    var viewBtn = '<a href="' + specUrl + '" onclick="event.stopPropagation()" ' +
      'class="text-xs px-3 py-1 rounded transition-colors whitespace-nowrap bg-accent/20 text-accent hover:bg-accent/30">View Spec</a>';
    var approveBtn = '';
    var rejectBtn = '';
    handoffActions.forEach(function(ha) {
      var aid = ha.id || ha.action || '';
      if (aid === 'approve-spec') {
        approveBtn = _renderHandoffBtn(ha, issueKey);
      } else if (aid === 'reject-spec') {
        rejectBtn = _renderHandoffBtn(ha, issueKey);
      } else {
        specMenuActions.push(ha);
      }
    });
    specPrimaryBtns = viewBtn + approveBtn + rejectBtn;
  }

  var actionBtn;
  if (isRunning && item.running_agent) {
    actionBtn = '<span class="flex items-center gap-1.5 text-xs text-accent-yellow whitespace-nowrap">' +
      '<span class="w-1.5 h-1.5 rounded-full bg-accent-yellow animate-pulse"></span>' +
      escapeHtml(item.running_agent.role_label || 'Running') + '</span>';
  } else if (isSpecReview) {
    actionBtn = specPrimaryBtns;
  } else if (item.state === 'handoff_pending' && handoffActions.length === 1) {
    actionBtn = _renderHandoffBtn(handoffActions[0], issueKey);
  } else if (isMultiAction) {
    actionBtn = '';
  } else {
    actionBtn = _renderActionBtn(item.primary_action, issueKey);
  }

  var failedDot = item.last_failed
    ? '<span class="w-1.5 h-1.5 rounded-full bg-accent-red shrink-0" data-tooltip="Last run failed"></span>'
    : '';

  var prBadge = '';
  if (item.pr_details) {
    var prStateClass = _prStateColors[item.pr_details.computed_state] || 'bg-gray-600/30 text-gray-400';
    var prUrl = item.pr_details.url || '';
    var isLink = prUrl.startsWith('https://');
    var openTag = isLink
      ? 'a href="' + escapeHtml(prUrl) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" data-tooltip="Open PR on GitHub"'
      : 'span';
    var closeTag = isLink ? 'a' : 'span';
    prBadge = '<' + openTag + ' class="text-xs px-2 py-0.5 rounded-full ' + prStateClass +
      ' whitespace-nowrap shrink-0' + (isLink ? ' cursor-pointer hover:brightness-125' : '') + '">' +
      'PR #' + escapeHtml(String(item.pr_details.number)) + '</' + closeTag + '>';
  } else if (item.pr_number) {
    prBadge = '<span class="text-xs px-2 py-0.5 rounded-full bg-gray-600/30 text-gray-400 whitespace-nowrap shrink-0">' +
      prLink(item.pr_number) + '</span>';
  }

  var needsAttention = item.state === 'handoff_pending' || item.state === 'spec_review';
  var attentionDot = needsAttention
    ? '<span class="w-2 h-2 rounded-full bg-accent-peach animate-pulse shrink-0"></span>'
    : '';

  var issueDisplay = item.jira_key || item.issue_number;
  var issueRef = (item.issue_number || item.jira_key)
    ? '<span class="text-xs font-medium shrink-0">' + issueLink(issueDisplay, item.url) + '</span>'
    : '<span class="text-xs font-medium shrink-0">' + prLink(item.pr_number) + '</span>';

  var prNum = item.pr_number || (item.last_run ? item.last_run.pr_number : null);
  var menuIssue = item.issue_number || ('pr-' + item.pr_number);

  var rowCls = needsAttention
    ? 'group hover:bg-surface-hover transition-colors relative border-l-2 border-accent-peach'
    : 'group hover:bg-surface-hover transition-colors relative';

  // Metadata indicators
  var assigneeHtml = '';
  var assignees = item.assignees || [];
  var prAuthor = (item.pr_details || {}).author || '';
  if (assignees.length) {
    var isGithub = !item.jira_key;
    assigneeHtml = '<span class="flex items-center shrink-0">' +
      (isGithub ? renderAssigneeAvatar(assignees[0]) : renderJiraInitial(assignees[0])) +
      (assignees.length > 1 ? '<span class="text-[9px] text-gray-500 ml-0.5">+' + (assignees.length - 1) + '</span>' : '') +
      '</span>';
  } else if (prAuthor) {
    assigneeHtml = '<span class="flex items-center shrink-0">' + renderAssigneeAvatar(prAuthor) + '</span>';
  }

  var pd = item.pr_details || {};

  var ageHtml = '';
  var ageSource = item.created_at || '';
  if (ageSource) {
    var ageMs = Date.now() - new Date(ageSource).getTime();
    if (!isNaN(ageMs) && ageMs > 0) {
      ageHtml = formatAgeBadge(Math.floor(ageMs / 1000), ageSource);
    }
  } else if (pd.age_seconds > 0) {
    ageHtml = formatAgeBadge(pd.age_seconds, null);
  }

  var diffHtml = '';
  if (pd.additions || pd.deletions) {
    var sz = diffSizeLabel(pd.additions, pd.deletions);
    diffHtml = '<span class="text-[10px] shrink-0 ' + diffSizeColor(pd.additions, pd.deletions) + '" ' +
      'data-tooltip="+' + pd.additions + ' / -' + pd.deletions + ' in ' + (pd.changed_files || '?') + ' files">' + sz + '</span>';
  }

  var draftHtml = '';
  if (pd.is_draft) {

      '<div class="flex-1 flex justify-end gap-1.5">' + actionBtn + '</div>' +
    '</div>' +
    '<button onclick="toggleCardMenu(event, \'' + escapeJsStr(menuIssue) + '\')" ' +
      'class="opacity-0 group-hover:opacity-100 text-gray-600 hover:text-gray-400 transition-all p-0.5 shrink-0 w-4" ' +
      'data-tooltip="More options">' +
      '<svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><circle cx="10" cy="4" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="10" cy="16" r="1.5"/></svg>' +
    '</button>' +
    '<div id="card-menu-' + menuIssue + '" class="hidden absolute right-4 top-8 z-50 bg-surface border border-gray-700 rounded-lg shadow-xl py-1 min-w-[160px]">' +
      (isRunning
        ? '<button onclick="stopAgent(' + (item.running_agent ? item.running_agent.run_id : 0) + ')" class="w-full text-left px-3 py-1.5 text-xs text-accent-red hover:bg-surface-hover transition-colors">Stop Agent</button>'
        : (isSpecReview && specMenuActions.length
          ? specMenuActions.map(function(ha) {
              return '<button onclick="executeHandoffAction(\'' + escapeJsStr(ha.id || ha.action || ha.label) + '\', \'' + escapeJsStr(issueKey) + '\')" ' +
                'class="w-full text-left px-3 py-1.5 text-xs text-gray-300 hover:bg-surface-hover transition-colors">' +
                escapeHtml(ha.label) + '</button>';
            }).join('')
          : (item.issue_number
            ? '<button onclick="quickStart(\'' + escapeJsStr(item.issue_number) + '\', true)" class="w-full text-left px-3 py-1.5 text-xs text-gray-300 hover:bg-surface-hover transition-colors">Start with --force</button>' +
              '<button onclick="quickStartRole(\'' + escapeJsStr(item.issue_number) + '\', \'reviewer\')" class="w-full text-left px-3 py-1.5 text-xs text-gray-300 hover:bg-surface-hover transition-colors">Start as Reviewer</button>' +
              '<button onclick="quickStartRole(\'' + escapeJsStr(item.issue_number) + '\', \'triage\')" class="w-full text-left px-3 py-1.5 text-xs text-gray-300 hover:bg-surface-hover transition-colors">Start as Triage</button>'
            : ''))) +
      ((item.secondary_actions || []).length && !isRunning && !isSpecReview
        ? (function() {

            return sep + (item.secondary_actions || []).map(function(sa) {
              if (/run_command/.test(sa.handler)) {

                  'w-full text-left px-3 py-1.5 text-xs text-gray-500 cursor-not-allowed');

                  (sa.handler_args.pr ? 'pr: ' + sa.handler_args.pr : '') +
                '}';
                return '<button onclick="runCommand(\'' + escapeJsStr(cmd) + '\', ' + cmdArgs + ')" class="w-full text-left px-3 py-1.5 text-xs text-gray-300 hover:bg-surface-hover transition-colors">' + escapeHtml(sa.label) + '</button>';

function renderTaskCards() {
  _cardMenuOpen = false;
  var grid = document.getElementById('task-grid');
  var q = (document.getElementById('task-search').value || '').trim().toLowerCase().replace(/^#/, '');
  var prefix = window.SOVA_PROJECT_SLUG ? '/p/' + window.SOVA_PROJECT_SLUG : '';

  if (q) {
    var items = _workItems.filter(function(t) {
      return (t.issue_number && t.issue_number.toString().includes(q)) ||
        (t.pr_number && t.pr_number.toString().includes(q)) ||
        t.title.toLowerCase().includes(q) ||
        (t.jira_key && t.jira_key.toLowerCase().includes(q));
    });
    if (!items.length) {
      grid.innerHTML = '<p class="text-gray-500 text-sm py-6 text-center">No matching issues</p>';
      return;
    }
    grid.innerHTML = items.map(renderTaskCard).join('');
    return;
  }

  var html = '';
  var hasHistory = _agentHistory.length > 0;
  var hasSuggested = _suggested.length > 0;

  if (!hasHistory && !hasSuggested) {
    grid.innerHTML = '<p class="text-gray-500 text-sm py-6 text-center">' +
      'No tasks available. <a href="' + prefix + '/queue" class="text-accent hover:underline">Visit the Priority Queue</a> to triage new issues.</p>';
    return;
  }

  if (hasHistory) {
    var _highPriStates = {
      agent_running: 1, handoff_pending: 1, spec_review: 1,
      in_progress: 1, pr_ready_to_merge: 1, pr_approved: 1,
      pr_ci_failed: 1, pr_changes_requested: 1, pr_awaiting_review: 1,
      pr_review_addressed: 1, pr_ci_running: 1,
    };
    var _highPriLabels = { critical: 1, high: 1 };
    var sorted = _agentHistory.slice().sort(function(a, b) {
      if (a.priority !== b.priority) return a.priority - b.priority;
      var pa = _priorityOrder[_extractPriority(a.labels)];
      var pb = _priorityOrder[_extractPriority(b.labels)];
      return (pa === undefined ? 99 : pa) - (pb === undefined ? 99 : pb);
    });

    var tier1 = sorted.filter(function(t) {
      return _highPriStates[t.state] || _highPriLabels[_extractPriority(t.labels)];
    });
    if (tier1.length === 0 && sorted.length > 0) tier1 = sorted.slice(0, 3);
    if (sorted.length <= _MIN_BEFORE_COLLAPSE) tier1 = sorted;

    var visible;
    var hiddenCount;
    if (_expansionTier === 0) {
      visible = tier1;
      hiddenCount = sorted.length - tier1.length;
    } else if (_expansionTier === 1) {
      visible = sorted.slice(0, tier1.length + _TIER2_PAGE_SIZE);
      hiddenCount = Math.max(0, sorted.length - visible.length);
    } else {
      visible = sorted;
      hiddenCount = 0;
    }

    html += visible.map(renderTaskCard).join('');

    if (hiddenCount > 0) {
      var label = hiddenCount <= _TIER2_PAGE_SIZE
        ? 'Show ' + hiddenCount + ' more'
        : 'Show ' + Math.min(hiddenCount, _TIER2_PAGE_SIZE) + ' more (' + hiddenCount + ' remaining)';
      html += '<div class="px-4 py-2 border-t border-gray-700/30">' +
        '<button onclick="expandTasks()" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">' +
        label + '</button></div>';
    } else if (_expansionTier > 0) {
      html += '<div class="px-4 py-2 border-t border-gray-700/30">' +
        '<button onclick="collapseTasks()" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">' +
        'Show less</button></div>';
    }
  }

  if (hasSuggested) {
    var suggestedVisible = _suggested.slice(0, 5);
    html += '<div class="flex items-center gap-2 px-4 py-2 border-t border-gray-700/30">' +
      '<span class="text-xs text-gray-500">Suggested</span>' +
      '<div class="flex-1 border-t border-gray-700/20"></div>' +
    '</div>';
    html += '<div class="opacity-80">' + suggestedVisible.map(renderTaskCard).join('') + '</div>';
    if (_suggested.length > 5) {
      html += '<div class="px-4 py-2 border-t border-gray-700/30">' +
        '<a href="' + prefix + '/queue" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">' +
        (_suggested.length - 5) + ' more in Priority Queue</a></div>';
    }
  }

  grid.innerHTML = html;
  fetchLlmSuggestions();
}

// --- LLM Suggestion Experiment ---

function _renderLlmSuggestionWidget(item, issueKey) {
  var sugg = _llmSuggestions[issueKey];
  if (!sugg || sugg.done) return '';
  if (sugg.for_state !== item.state) return '';
  var detLabel = (item.primary_action && item.primary_action.label) || 'current';
  var safeKey = issueKey.replace(/[^a-zA-Z0-9-]/g, '-');
  return '<div class="px-4 pb-2.5 pl-12">' +
    '<div class="flex items-start gap-2 pt-1.5 border-t border-gray-700/20">' +
      '<span class="text-xs text-accent-yellow font-medium whitespace-nowrap mt-0.5">LLM:</span>' +
      '<div class="flex-1 min-w-0">' +
        '<span class="text-xs text-gray-300 font-medium">' + escapeHtml(sugg.action_label) + '</span>' +
        (sugg.reasoning
          ? '<p class="text-xs text-gray-500 italic mt-0.5 line-clamp-2">' + escapeHtml(sugg.reasoning) + '</p>'
          : '') +
        '<div class="flex gap-2 mt-1.5" id="llm-feedback-' + safeKey + '">' +
          '<button onclick="submitLlmFeedback(event,\'' + escapeJsStr(issueKey) + '\',\'deterministic\')" ' +
            'class="text-xs px-2 py-0.5 rounded bg-surface-hover text-gray-400 hover:text-gray-200 transition-colors">' +
            'Keep: ' + escapeHtml(detLabel) + '</button>' +
          '<button onclick="submitLlmFeedback(event,\'' + escapeJsStr(issueKey) + '\',\'llm\')" ' +
            'class="text-xs px-2 py-0.5 rounded bg-surface-hover text-gray-400 hover:text-gray-200 transition-colors">' +
            'LLM is right</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

async function fetchLlmSuggestions() {
  var toFetch = [];
  _workItems.forEach(function(item) {
    if (!_PR_STAGE_STATES.has(item.state)) return;
    if (!item.pr_number || !item.primary_action) return;
    var key = item.issue_number || ('pr:' + item.pr_number);
    // Clear stale suggestion when the card state changed
    if (key in _llmSuggestions && _llmSuggestions[key] && _llmSuggestions[key].for_state !== item.state) {
      delete _llmSuggestions[key];
    }
    if (!(key in _llmSuggestions) && !_llmSuggestionFetching.has(key)) {
      toFetch.push(item);
    }
  });
  if (!toFetch.length) return;

  toFetch.forEach(function(item) {
    _llmSuggestionFetching.add(item.issue_number || ('pr:' + item.pr_number));
  });

  var anyNew = false;
  await Promise.all(toFetch.map(async function(item) {
    var key = item.issue_number || ('pr:' + item.pr_number);
    try {
      var prDetails = item.pr_details || {};
      var sovaCtx = item.sova_context || {};
      var body = {
        deterministic_state: item.state,
        deterministic_action_id: item.primary_action.id,
        pr_computed_state: prDetails.computed_state || '',
        has_sova_review: sovaCtx.has_sova_review || false,
        sova_verdict: sovaCtx.verdict || null,
        mergeable: prDetails.mergeable || 'UNKNOWN',
        review_decision: prDetails.review_decision || null,
        ci_passed: prDetails.ci_status === 'all_passed',
        external_reviews_enabled: true
      };
      var resp = await fetch(apiUrl('/prs/' + item.pr_number + '/suggestion'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
      if (resp.ok && resp.status !== 204) {
        var data = await resp.json();
        if (data.disagrees) {
          _llmSuggestions[key] = {
            action_id: data.action_id,
            action_label: data.action_label,
            reasoning: data.reasoning,
            for_state: item.state,
            done: false,
            pr_number: item.pr_number,
            issue_number: item.issue_number || null,
            deterministic_action_id: item.primary_action.id
          };
          anyNew = true;
        } else {
          _llmSuggestions[key] = null;
        }
      } else {
        _llmSuggestions[key] = null;
      }
    } catch (e) {
      _llmSuggestions[key] = null;
    }
    _llmSuggestionFetching.delete(key);
  }));

  if (anyNew) {
    renderTaskCards();
  }
}

async function submitLlmFeedback(event, issueKey, choice) {
  event.stopPropagation();
  var sugg = _llmSuggestions[issueKey];
  if (!sugg) return;
  sugg.done = true;
  var safeKey = issueKey.replace(/[^a-zA-Z0-9-]/g, '-');
  var feedbackDiv = document.getElementById('llm-feedback-' + safeKey);
  if (feedbackDiv) {
    feedbackDiv.innerHTML = '<span class="text-xs text-gray-500 italic">Recorded. Thanks!</span>';
  }
  try {
    await fetch(apiUrl('/prs/feedback'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        pr_number: sugg.pr_number,
        issue_number: sugg.issue_number,
        deterministic_state: sugg.for_state,
        deterministic_action_id: sugg.deterministic_action_id,
        llm_action_id: sugg.action_id,
        llm_reasoning: sugg.reasoning,
        user_choice: choice
      })
    });
  } catch (e) { /* feedback failure is non-fatal */ }
}

function toggleCardMenu(event, issue) {
  event.stopPropagation();
  var menu = document.getElementById('card-menu-' + issue);
  if (!menu) return;
  var wasHidden = menu.classList.contains('hidden');
  document.querySelectorAll('[id^="card-menu-"]').forEach(function(m) { m.classList.add('hidden'); });
  if (wasHidden) menu.classList.remove('hidden');
  _cardMenuOpen = wasHidden;
}

document.addEventListener('click', function() {
  document.querySelectorAll('[id^="card-menu-"]').forEach(function(m) { m.classList.add('hidden'); });
  _cardMenuOpen = false;
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && _cardMenuOpen) {
    document.querySelectorAll('[id^="card-menu-"]').forEach(function(m) { m.classList.add('hidden'); });
    _cardMenuOpen = false;
  }
});

var _actionToRole = {
  triage: 'triage',
  research: 'researcher',
  develop: 'developer',
  review: 'reviewer',
  resume: 'developer',
};

var _actionToCommand = {
  spec: 'spec',
};

async function quickStart(issue, force, action) {
  var cmd = action ? _actionToCommand[action] : null;
  if (cmd) {
    await runCommand(cmd, { issue: String(issue) });
    return;
  }
  var roleEl = document.getElementById('agent-role');
  var role = (roleEl && roleEl.value) || null;
  if (!role && action) {
    role = _actionToRole[action] || null;
  }
  await _doStartAgent(issue, role, force || false);
}

async function quickStartRole(issue, role, prNumber) {
  await _doStartAgent(issue, role, false, prNumber);
}

async function _doStartAgent(issue, role, force, prNumber) {
  try {
    var payload = { issue: String(issue), role: role, force: force };
    if (prNumber) payload.pr_number = prNumber;
    var res = await fetch(apiUrl('/agents/start'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      showToast(await getErrorDetail(res, 'Failed to start agent'), 'error');
    } else {
      var result = await res.json();
      if (result.error) { showToast(result.error, 'error'); return; }
      if (result.run_id) viewLogs(result.run_id);
      var agentLabel = issue ? '#' + issue : (role || 'agent');
      showToast('Agent started: ' + agentLabel, 'success');
    }
  } catch (e) {
    showToast('Failed to start agent: ' + e.message, 'error');
  }
  loadAgents();
  loadTaskCards();
}

async function startPlanner() {
  var btn = document.getElementById('run-planner-btn');
  if (btn) btn.disabled = true;
  try {
    await _doStartAgent('', 'planner', false);
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function createPlannerIssues(tasks, issue) {
  try {
    var res = await fetch(apiUrl('/agents/planner/create-issues'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tasks: tasks }),
    });
    if (!res.ok) {
      showToast(await getErrorDetail(res, 'Failed to create issues'), 'error');
      return;
    }
    var data = await res.json();
    var createdCount = data.created ? data.created.length : 0;
    var errorCount = data.errors ? data.errors.length : 0;

    if (createdCount > 0) {
      var nums = data.created.map(function(c) { return '#' + c.number; }).join(', ');
      showToast('Created ' + createdCount + ' issues: ' + nums, 'success');
    }
    if (errorCount > 0) {
      var errTitles = data.errors.map(function(e) { return e.title; }).join(', ');
      showToast(errorCount + ' issues failed: ' + errTitles, 'error');
    }

    // Only clear cached handoff if all tasks succeeded
    if (errorCount === 0) {
      _plannerHandoffCache = null;
      if (issue) dismissHandoff(issue);
    }
    loadAgents();
    loadTaskCards();
  } catch (e) {
    showToast('Failed to create issues: ' + e.message, 'error');
  }
}

var _prStatusAbort = null;

async function fetchPrStatus(issueNumber) {
  if (_prStatusAbort) _prStatusAbort.abort();
  var controller = new AbortController();
  _prStatusAbort = controller;

  var panel = document.getElementById('pr-actions-panel');

  try {
    var res = await fetch(apiUrl('/agents/issue/' + issueNumber + '/pr-status'), { signal: controller.signal });
    if (!res.ok) { panel.classList.add('hidden'); return; }
    var data = await res.json();

    if (!data.has_pr) { panel.classList.add('hidden'); return; }
    if (data.error) { panel.classList.add('hidden'); return; }

    renderPrActionsPanel(data, issueNumber);
  } catch (e) {
    if (e.name !== 'AbortError') panel.classList.add('hidden');
  }
}

function renderPrActionsPanel(pr, issueNumber) {
  var panel = document.getElementById('pr-actions-panel');
  var card = document.getElementById('pr-actions-card');
  var dot = document.getElementById('pr-status-dot');
  var label = document.getElementById('pr-status-label');
  var link = document.getElementById('pr-link');
  var badges = document.getElementById('pr-status-badges');
  var title = document.getElementById('pr-title');
  var buttons = document.getElementById('pr-action-buttons');

  // Status dot and label
  var ciGreen = pr.ci_status === 'passed' || pr.ci_status === 'none';
  var sovaBlocking = pr.sova_review && pr.sova_review.has_sova_review && pr.sova_review.verdict !== 'approve';
  var readyToIntegrate = pr.state === 'OPEN' && ciGreen && pr.is_mergeable && pr.review_decision !== 'CHANGES_REQUESTED' && !sovaBlocking;
  if (readyToIntegrate) {
    dot.className = 'w-2.5 h-2.5 rounded-full bg-accent-green';
    label.className = 'text-sm font-medium text-accent-green';
    label.textContent = 'PR #' + pr.pr_number + ' -- Ready to Integrate';
    card.className = 'rounded-lg border border-accent-green/30 bg-accent-green/5 p-4';
  } else if (pr.state === 'OPEN' && sovaBlocking) {
    dot.className = 'w-2.5 h-2.5 rounded-full bg-accent-red';
    label.className = 'text-sm font-medium text-accent-red';
    label.textContent = 'PR #' + pr.pr_number + ' -- Review: ' + pr.sova_review.verdict;
    card.className = 'rounded-lg border border-accent-red/30 bg-accent-red/5 p-4';
  } else if (pr.state === 'OPEN' && pr.review_decision !== 'CHANGES_REQUESTED') {
    dot.className = 'w-2.5 h-2.5 rounded-full bg-accent-yellow';
    label.className = 'text-sm font-medium text-accent-yellow';
    var reason = !ciGreen ? 'CI ' + pr.ci_status : 'not mergeable';
    label.textContent = 'PR #' + pr.pr_number + ' -- ' + reason;
    card.className = 'rounded-lg border border-accent-yellow/30 bg-accent-yellow/5 p-4';
  } else if (pr.state === 'MERGED') {
    dot.className = 'w-2.5 h-2.5 rounded-full bg-accent-purple';
    label.className = 'text-sm font-medium text-accent-purple';
    label.textContent = 'PR #' + pr.pr_number + ' -- Merged';
    card.className = 'rounded-lg border border-accent-purple/30 bg-accent-purple/5 p-4';
  } else {
    dot.className = 'w-2.5 h-2.5 rounded-full bg-gray-500';
    label.className = 'text-sm font-medium text-gray-400';
    label.textContent = 'PR #' + pr.pr_number;
    card.className = 'rounded-lg border border-gray-700/50 bg-surface-card p-4';
  }

  if (pr.url) { link.href = pr.url; link.classList.remove('hidden'); }
  else { link.classList.add('hidden'); }

  // Badges
  var badgeHtml = '';
  var reviewColors = {
    APPROVED: 'bg-accent-green/20 text-accent-green',
    CHANGES_REQUESTED: 'bg-accent-red/20 text-accent-red',
    REVIEW_REQUIRED: 'bg-accent-yellow/20 text-accent-yellow',
  };
  var reviewLabel = pr.review_decision || 'no review';
  var reviewClass = reviewColors[pr.review_decision] || 'bg-gray-600/30 text-gray-400';
  if (!pr.review_decision && pr.sova_review && pr.sova_review.has_sova_review) {
    reviewLabel = 'sova: ' + pr.sova_review.verdict;
    reviewClass = pr.sova_review.verdict === 'approve'
      ? 'bg-accent-green/20 text-accent-green'
      : 'bg-accent-red/20 text-accent-red';
  }
  badgeHtml += '<span class="px-1.5 py-0.5 rounded text-xs ' + reviewClass + '">' + escapeHtml(reviewLabel.toLowerCase().replace(/_/g, ' ')) + '</span>';

  var ciColors = { passed: 'bg-accent-green/20 text-accent-green', failed: 'bg-accent-red/20 text-accent-red', pending: 'bg-accent-yellow/20 text-accent-yellow', none: 'bg-gray-600/30 text-gray-400' };
  var ciClass = ciColors[pr.ci_status] || 'bg-gray-600/30 text-gray-400';
  badgeHtml += '<span class="px-1.5 py-0.5 rounded text-xs ' + ciClass + '">CI: ' + escapeHtml(pr.ci_status) + '</span>';

  if (pr.is_mergeable) {
    badgeHtml += '<span class="px-1.5 py-0.5 rounded text-xs bg-accent-green/20 text-accent-green">mergeable</span>';
  } else if (pr.mergeable === 'CONFLICTING') {
    badgeHtml += '<span class="px-1.5 py-0.5 rounded text-xs bg-accent-red/20 text-accent-red">conflicts</span>';
  }
  badges.innerHTML = badgeHtml;

  title.textContent = pr.title || '';

  // Action buttons based on PR state (ordered chronologically: review -> integrate -> merge)
  var actionsHtml = '';
  if (pr.state === 'OPEN') {
    var needsReview = !pr.review_decision || pr.review_decision === 'REVIEW_REQUIRED';
    var changesRequested = pr.review_decision === 'CHANGES_REQUESTED';

    // SOVA review overrides empty GitHub review_decision
    if (needsReview && pr.sova_review && pr.sova_review.has_sova_review) {
      if (pr.sova_review.verdict === 'approve') {
        needsReview = false;
      } else {
        needsReview = false;
        changesRequested = true;
      }
    }

    if (needsReview) {
      actionsHtml += '<button onclick="runCommand(\'review-pr\', {issue: \'' + issueNumber + '\', pr: ' + pr.pr_number + '})" ' +
        'class="px-3 py-2 rounded text-sm bg-accent/20 text-accent hover:bg-accent/30 border border-accent/30 transition-colors" ' +
        'data-tooltip="Spawn reviewer agent to analyze this PR">' +
        'Start Review</button>';
    } else if (changesRequested) {
      actionsHtml += '<button onclick="runCommand(\'address-pr\', {issue: \'' + issueNumber + '\', pr: ' + pr.pr_number + '})" ' +
        'class="px-3 py-2 rounded text-sm bg-accent-yellow/20 text-accent-yellow hover:bg-accent-yellow/30 border border-accent-yellow/30 transition-colors" ' +
        'data-tooltip="Send agent to address review feedback">' +
        'Address Review</button>';
    }

    actionsHtml += '<button onclick="runCommand(\'integrate-pr\', {issue: \'' + issueNumber + '\', pr: ' + pr.pr_number + '})" ' +
      'class="px-3 py-2 rounded text-sm ' + (readyToIntegrate
        ? 'font-medium bg-accent-green/20 text-accent-green hover:bg-accent-green/30 border border-accent-green/30'
        : 'bg-accent/20 text-accent hover:bg-accent/30 border border-accent/30') + ' transition-colors" ' +
      'data-tooltip="Rebase, push, merge, and clean up">' +
      'Integrate PR</button>';

  } else if (pr.state === 'MERGED') {
    actionsHtml += '<button onclick="runCommand(\'after-merge\', {issue: \'' + issueNumber + '\', pr: ' + pr.pr_number + '})" ' +
      'class="px-3 py-2 rounded text-sm bg-accent-purple/20 text-accent-purple hover:bg-accent-purple/30 border border-accent-purple/30 transition-colors" ' +
      'data-tooltip="Run post-merge cleanup tasks">' +
      'Post-Merge Cleanup</button>';
  }
  buttons.innerHTML = actionsHtml;

  panel.classList.remove('hidden');
}

function hidePrActionsPanel() {
  document.getElementById('pr-actions-panel').classList.add('hidden');

async function runCommand(command, args) {
  try {
    var res = await fetch(apiUrl('/agents/command'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: command, args: args }),
    });
    if (!res.ok) {
      showToast(await getErrorDetail(res, 'Failed to run command'), 'error');
    } else {
      var result = await res.json();
      if (result.error) {
        showToast(result.error, 'error');
      } else {
        hidePrActionsPanel();
        document.getElementById('agent-issue').value = '';
        document.getElementById('agent-issue-number').value = '';
        if (result.run_id) viewLogs(result.run_id);
      }
    }
  } catch (e) {
    showToast('Failed to run command: ' + e.message, 'error');
  }
  loadAgents();
  loadTaskCards();
}

var logCursor = 0;
var agentPollInterval = null;
var logPollInterval = null;
var _logEventSource = null;
var _logBackoffMs = 1000;
var _LOG_BACKOFF_BASE = 1000;
var _LOG_BACKOFF_MAX = 5000;
var _TERMINAL = ['done', 'failed', 'rejected', 'interrupted'];
var lastAgentFingerprint = null;

function agentFingerprint(data) {
  var running = data.agents.map(function(a) {
    return a.run_id + ':' + a.status + ':' + a.current_step + ':' + (a.cost_usd || 0) + ':' + (a.pr_number || '') + ':' + (a.source || '');
  });
  var completed = data.completed.map(function(a) {
    return a.run_id + ':' + a.status + ':' + (a.cost_usd || 0) + ':' + (a.pr_number || '');
  });
  return data.slots_available + '|' + running.join(',') + '|' + completed.join(',');
}

async function loadAgents() {
  try {
    var data = await fetchAPI(apiUrl('/agents/active'));

    var fp = agentFingerprint(data);
    var changed = fp !== lastAgentFingerprint;
    if (changed) lastAgentFingerprint = fp;

    if (changed) {
      updateLogTabs(data.agents);
    }

    // Skip DOM-heavy list rendering when kanban view is active
    if (_agentView === 'kanban') return;
    if (!changed) return;

    var grid = document.getElementById('agents-grid');
    if (data.agents.length === 0 && data.completed.length === 0) {
      grid.innerHTML = '<div class="col-span-2 text-gray-500 text-sm py-8 text-center">No agents running</div>';
      return;
    }
    var cards = [];

    // Running agents
    data.agents.forEach(function(agent) {
      cards.push(renderAgentCard(agent));
    });

    // Recently completed
    data.completed.forEach(function(agent) {
      cards.push(renderCompletedCard(agent));
    });

    grid.innerHTML = cards.join('');
    enhancePlannerCards(data.completed);

    // Schedule a refresh after server-side TTL expires to clear completed cards
    if (data.completed.length > 0) {
      var maxAge = 0;
      data.completed.forEach(function(agent) {
        var remaining = 30 - (agent.completed_seconds_ago || 0);
        if (remaining > maxAge) maxAge = remaining;
      });
      var delay = maxAge > 0 ? (maxAge + 1) * 1000 : 2000;
      if (_completedCleanupTimer) clearTimeout(_completedCleanupTimer);
      _completedCleanupTimer = setTimeout(function() {
        _completedCleanupTimer = null;
        loadAgents();
      }, delay);
    }
  } catch (e) {
    console.error('Failed to load agents:', e);
  }
}

// -- Planner card enhancement --

var _plannerHandoffCache = null;

async function enhancePlannerCards(completed) {
  var plannerAgents = (completed || []).filter(function(a) { return a.role === 'planner'; });
  if (plannerAgents.length === 0) return;

  // Fetch handoff only once; reuse cache for subsequent polls
  if (!_plannerHandoffCache) {
    try {
      var res = await fetch(apiUrl('/handoff?issue=planner'));
      if (!res.ok) return;
      var data = await res.json();
      if (!data.handoff || !data.handoff.details || !data.handoff.details.planned_tasks) return;
      _plannerHandoffCache = data.handoff;
    } catch (e) {
      return;
    }
  }

  try {
    var tasks = _plannerHandoffCache.details.planned_tasks;
    var handoffIssue = _plannerHandoffCache.issue || 'planner';

    // Only apply the handoff to the most recent planner run to avoid
    // showing stale proposals on older cards.
    var latestPlanner = plannerAgents[0];
    plannerAgents.forEach(function(agent) {
        var card = document.getElementById('planner-extra-' + agent.run_id);
        if (!card) return;
        if (agent.run_id !== latestPlanner.run_id) return;

        if (tasks.length === 0) {
          card.innerHTML = '<p class="text-xs text-gray-500 mt-2">No tasks proposed</p>';
          return;
        }

        var taskListHtml = tasks.map(function(t, i) {
          var priorityColors = {
            critical: 'text-accent-red', high: 'text-accent-yellow',
            medium: 'text-accent', low: 'text-gray-400'
          };
          var pColor = priorityColors[t.priority] || 'text-gray-400';
          return '<label class="flex items-start gap-2 py-1 text-xs cursor-pointer" onclick="event.stopPropagation()">' +
            '<input type="checkbox" checked class="mt-0.5 planner-task-check" data-idx="' + i + '">' +
            '<span class="flex-1"><span class="' + pColor + ' font-medium">[' + escapeHtml(t.priority) + ']</span> ' + escapeHtml(t.title) + '</span>' +
          '</label>';
        }).join('');

        var createBtnDisabled = _plannerHandoffCache.status !== 'awaiting_action' ? ' disabled' : '';
        var createBtnClass = _plannerHandoffCache.status === 'awaiting_action'
          ? 'bg-accent-green/20 text-accent-green hover:bg-accent-green/30 border-accent-green/30'
          : 'bg-gray-600/20 text-gray-500 border-gray-600/30 cursor-not-allowed';

        card.innerHTML =
          '<div class="mt-3 border-t border-gray-700/30 pt-3">' +
            '<p class="text-xs text-gray-400 mb-2">Proposed ' + tasks.length + ' tasks:</p>' +
            '<div class="max-h-40 overflow-y-auto space-y-0.5 mb-2" id="planner-task-list-' + agent.run_id + '">' +
              taskListHtml +
            '</div>' +
            '<button onclick="event.stopPropagation(); _submitPlannerIssues(' + agent.run_id + ', \'' + escapeJsStr(handoffIssue) + '\')"' + createBtnDisabled +
              ' class="px-3 py-1.5 rounded text-xs border transition-colors ' + createBtnClass + '"' +
              ' data-tooltip="Create selected issues on the tracker">' +
              'Create Issues' +
            '</button>' +
          '</div>';
      });
  } catch (e) {
    // Handoff file may be cleared; silently ignore
  }
}

function _submitPlannerIssues(runId, handoffIssue) {
  var container = document.getElementById('planner-task-list-' + runId);
  if (!container) return;

  // Use cached tasks from enhancePlannerCards -- no re-fetch needed
  if (!_plannerHandoffCache || !_plannerHandoffCache.details || !_plannerHandoffCache.details.planned_tasks) {
    showToast('Task data not available -- try refreshing', 'error');
    return;
  }
  var allTasks = _plannerHandoffCache.details.planned_tasks;

  var checks = container.querySelectorAll('.planner-task-check');
  var selected = [];
  checks.forEach(function(cb) {
    if (cb.checked) {
      var idx = parseInt(cb.getAttribute('data-idx'), 10);
      if (allTasks[idx]) {
        selected.push({
          title: allTasks[idx].title,
          description: allTasks[idx].description,
          labels: allTasks[idx].component ? ['area:' + allTasks[idx].component] : null,
        });
      }
    }
  });

  if (selected.length === 0) {
    showToast('No tasks selected', 'warning');
    return;
  }

  createPlannerIssues(selected, handoffIssue);
}

// -- Log Viewer --

function updateLogTabs(agents) {
  var tabs = document.getElementById('log-tabs');
  if (!tabs) return;

  if (agents.length === 0) {
    if (activeLogRunId !== null) closeLogViewer();
    return;
  }

  tabs.innerHTML = agents.map(function(a) {
    var colors = roleColor(a.role);
    var isActive = activeLogRunId === a.run_id;
    var activeClass = isActive ? 'bg-surface text-white border-b-2 border-accent' : 'text-gray-500 hover:text-gray-300';
    var tabLabel = a.issue ? '#' + a.issue : (a.pr_number ? 'PR #' + a.pr_number : formatRole(a.role, a.pipeline_variant));
    return '<button onclick="viewLogs(' + a.run_id + ', \'' + escapeHtml(a.status) + '\')" class="px-4 py-2 text-xs transition-colors whitespace-nowrap ' + activeClass + '">' +
      escapeHtml(tabLabel) + ' <span class="' + colors.text + '">' + escapeHtml(formatRole(a.role, a.pipeline_variant)) + '</span>' +
    '</button>';
  }).join('');
}

function viewLogs(runId, runStatus) {
  var viewer = document.getElementById('log-viewer');
  var content = document.getElementById('log-content');

  if (activeLogRunId === runId) {
    closeLogViewer();
    return;
  }

  closeLogViewer();
  activeLogRunId = runId;
  logCursor = 0;
  _logBackoffMs = _LOG_BACKOFF_BASE;
  content.textContent = '';
  viewer.classList.remove('hidden');

  if (runStatus && _TERMINAL.includes(runStatus)) {
    _startLogPolling();
  } else {
    _connectLogSSE(runId);
  }
}

function _connectLogSSE(runId) {
  if (_logEventSource) { _logEventSource.close(); _logEventSource = null; }

  var url = apiUrl('/agents/' + runId + '/output/stream');
  var es = new EventSource(url);
  _logEventSource = es;

  es.addEventListener('output', function(e) {
    if (activeLogRunId !== runId) return;
    var content = document.getElementById('log-content');
    if (content) {
      var text = e.data.replace(/\\([nr\\])/g, function(_, c) { return c === 'n' ? '\n' : c === 'r' ? '\r' : '\\'; });
      content.textContent += text + '\n';
      content.scrollTop = content.scrollHeight;
    }
  });

  es.addEventListener('done', function() {
    if (es === _logEventSource) { es.close(); _logEventSource = null; }
  });

  es.onerror = function() {
    // SSE failed: fall back to polling with fresh cursor
    if (es === _logEventSource) { es.close(); _logEventSource = null; }
    if (activeLogRunId === runId) {
      logCursor = 0;
      var el = document.getElementById('log-content');
      if (el) el.textContent = '';
      _startLogPolling();
    }
  };
}

function _startLogPolling() {
  if (logPollInterval) { clearTimeout(logPollInterval); logPollInterval = null; }
  _logBackoffMs = _LOG_BACKOFF_BASE;
  pollLogs();
}

function closeLogViewer() {
  activeLogRunId = null;
  logCursor = 0;
  if (logPollInterval) { clearTimeout(logPollInterval); logPollInterval = null; }
  if (_logEventSource) { _logEventSource.close(); _logEventSource = null; }
  var viewer = document.getElementById('log-viewer');
  if (viewer) viewer.classList.add('hidden');
}

async function pollLogs() {
  if (activeLogRunId === null) return;
  try {
    var data = await fetchAPI(apiUrl('/agents/' + activeLogRunId + '/output?since=' + logCursor));
    if (data.lines && data.lines.length > 0) {
      var content = document.getElementById('log-content');
      data.lines.forEach(function(line) {
        content.textContent += line + '\n';
      });
      logCursor = data.total;
      content.scrollTop = content.scrollHeight;
      _logBackoffMs = _LOG_BACKOFF_BASE;
    } else {
      _logBackoffMs = Math.min(_logBackoffMs * 1.5, _LOG_BACKOFF_MAX);
    }
  } catch (e) {
    _logBackoffMs = Math.min(_logBackoffMs * 1.5, _LOG_BACKOFF_MAX);
  }
  if (activeLogRunId !== null) {
    logPollInterval = setTimeout(pollLogs, _logBackoffMs);
  }
}

// -- Handoff inline --

async function checkHandoffForAgents(agents) {
  try {
    var res = await fetch(apiUrl('/handoff'));
    if (!res.ok) return;
    var data = await res.json();

    if (!data.has_handoff || !data.handoff || data.handoff.status !== 'awaiting_action') {
      agents.forEach(function(agent) {
        var container = document.getElementById('handoff-inline-' + agent.run_id);
        if (container) container.innerHTML = '';
      });
      return;
    }
    var handoff = data.handoff;

    var targetIssue = handoff.issue || '';

    agents.forEach(function(agent) {
      var container = document.getElementById('handoff-inline-' + agent.run_id);
      if (container) container.innerHTML = '';
    });
  } catch (e) { /* ignore */ }
}

async function executeHandoffAction(actionId, issue) {
  document.querySelectorAll('[id^="handoff-inline-"]').forEach(function(el) {
    el.innerHTML = '';
  });
  lastAgentFingerprint = null;

  try {
    var payload = { action_id: actionId };
    if (issue) payload.issue = issue;
    var res = await fetch(apiUrl('/handoff/execute'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      showToast(await getErrorDetail(res, 'Failed to execute action'), 'error');
      loadAgents();
      return;
    }
    var result = await res.json();
    if (result.run_id) viewLogs(result.run_id);
    loadAgents();
    loadTaskCards();
  } catch (e) {
    showToast('Failed to execute action: ' + e.message, 'error');
    loadAgents();
  }
}

async function resumeFromApproval(runId) {
  try {
    var res = await fetch(apiUrl('/agents/' + runId + '/resume-from-approval'), { method: 'POST' });
    if (!res.ok) {
      showToast(await getErrorDetail(res, 'Failed to resume'), 'error');
      return;
    }
    var result = await res.json();
    if (result.error) {
      showToast(result.detail || 'Failed to resume', 'error');
      return;
    }
    if (result.run_id) viewLogs(result.run_id);
    loadAgents();
    loadTaskCards();
  } catch (e) {
    showToast('Failed to resume: ' + e.message, 'error');
  }
}

// Handoff actions are now rendered inline in task cards via loadWorkItems()

async function dismissHandoff(issue) {
  try {
    var payload = issue ? { issue: issue } : {};
    await fetch(apiUrl('/handoff/clear'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },

var _PAGE_SIZE = 15;
var historyPage = 0;
var historyTotal = 0;
var failedPage = 0;
var failedTotal = 0;

async function loadHistory() {
  try {
    var role = document.getElementById('filter-role').value;
    var offset = historyPage * _PAGE_SIZE;
    var url = '/work/history?limit=' + _PAGE_SIZE + '&offset=' + offset;
    if (role) url += '&role=' + role;

    var data = await fetchAPI(apiUrl(url));
    historyTotal = data.total || 0;
    renderHistoryTable(data.tasks, 'history-table');
    _updatePager('history', historyPage, historyTotal, _PAGE_SIZE);
  } catch (e) {
    console.error('Failed to load history:', e);
  }
}

function historyPrev() { if (historyPage > 0) { historyPage--; loadHistory(); } }
function historyNext() { if ((historyPage + 1) * _PAGE_SIZE < historyTotal) { historyPage++; loadHistory(); } }

async function loadFailed() {
  try {
    var offset = failedPage * _PAGE_SIZE;
    var data = await fetchAPI(apiUrl('/work/history?status=failed&limit=' + _PAGE_SIZE + '&offset=' + offset));
    failedTotal = data.total || 0;
    var countEl = document.getElementById('tab-failed-count');
    countEl.textContent = failedTotal > 0 ? '(' + failedTotal + ')' : '';
    renderHistoryTable(data.tasks, 'failed-table', true);
    _updatePager('failed', failedPage, failedTotal, _PAGE_SIZE);
  } catch (e) {
    console.error('Failed to load failed:', e);
  }
}

function failedPrev() { if (failedPage > 0) { failedPage--; loadFailed(); } }
function failedNext() { if ((failedPage + 1) * _PAGE_SIZE < failedTotal) { failedPage++; loadFailed(); } }

function _updatePager(prefix, page, total, pageSize) {
  var pager = document.getElementById(prefix + '-pager');
  if (total <= pageSize) { pager.classList.add('hidden'); return; }
  pager.classList.remove('hidden');
  var totalPages = Math.ceil(total / pageSize);
  document.getElementById(prefix + '-page-info').textContent = 'Page ' + (page + 1) + ' of ' + totalPages;
  document.getElementById(prefix + '-prev').disabled = page === 0;
  document.getElementById(prefix + '-next').disabled = page + 1 >= totalPages;
}

var _STALE_THRESHOLD_SECONDS = 7 * 86400;
var _lastPrSummaryKey = null;

function renderPrSummary() {
  var strip = document.getElementById('pr-summary-strip');
  var prs = window._prTrackerData;
  if (!prs.length) {
    strip.classList.add('hidden');
    _lastPrSummaryKey = null;
    return;
  }

  var total = prs.length;
  var awaitingReview = 0;
  var changesRequested = 0;
  var ciFailing = 0;
  var approved = 0;
  var stale = 0;
  var totalAge = 0;

  for (var i = 0; i < prs.length; i++) {
    var pr = prs[i];
    var age = pr.age_seconds || 0;
    var st = pr.computed_state;
    if (st === 'awaiting_review') awaitingReview++;
    else if (st === 'changes_requested') changesRequested++;
    else if (st === 'approved' || st === 'approved_ci_green') approved++;
    if (pr.ci_status === 'failed') ciFailing++;
    totalAge += age;
    if (age >= _STALE_THRESHOLD_SECONDS) stale++;
  }

  var ageHours = Math.floor(totalAge / 3600);
  var key = [total, awaitingReview, changesRequested, ciFailing, approved, stale, ageHours].join(',');
  if (key === _lastPrSummaryKey) {
    strip.classList.toggle('hidden', _prTrackerCollapsed);
    return;
  }
  _lastPrSummaryKey = key;

  var avgAge = total > 0 ? formatAge(Math.floor(totalAge / total)) : '0d';

  var metrics = [
    { label: 'Open', value: total, color: 'text-gray-300' },
    { label: 'Review', value: awaitingReview, color: 'text-accent' },
    { label: 'Changes', value: changesRequested, color: 'text-accent-peach' },
    { label: 'CI Fail', value: ciFailing, color: 'text-accent-red' },
    { label: 'Approved', value: approved, color: 'text-accent-green' },
    { label: 'Stale', value: stale, color: stale > 0 ? 'text-accent-yellow' : 'text-gray-500' },
  ];

  var html = '<div class="grid grid-cols-6 gap-2 px-4 py-2 border-b border-gray-700/30">';
  for (var j = 0; j < metrics.length; j++) {
    var m = metrics[j];
    var val = m.label === 'Stale' && m.value === 0 ? avgAge : String(m.value);
    var sub = m.label === 'Stale' && m.value === 0 ? 'Avg Age' : m.label;
    html += '<div class="text-center">' +
      '<div class="text-sm font-semibold ' + m.color + '">' + escapeHtml(val) + '</div>' +
      '<div class="text-[10px] text-gray-500">' + escapeHtml(sub) + '</div>' +
    '</div>';
  }
  html += '</div>';

  strip.innerHTML = html;
  strip.classList.toggle('hidden', _prTrackerCollapsed);
}

var _prStateColors = {
  draft: 'bg-gray-600/30 text-gray-400',
  ci_running: 'bg-accent-yellow/20 text-accent-yellow',
  ci_failed: 'bg-accent-red/20 text-accent-red',
  changes_requested: 'bg-accent-peach/20 text-accent-peach',
  approved_ci_green: 'bg-accent-green/30 text-accent-green',
  approved: 'bg-accent-green/20 text-accent-green',
  review_addressed: 'bg-accent-lavender/20 text-accent-lavender',
  awaiting_review: 'bg-accent/20 text-accent',
};

function formatAge(seconds) {
  if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
  if (seconds < 86400) return Math.floor(seconds / 3600) + 'h';
  return Math.floor(seconds / 86400) + 'd';
}

function ageBadgeClasses(days) {
  if (days > 14) return 'bg-accent-red/20 text-accent-red';
  if (days > 7) return 'bg-accent-peach/20 text-accent-peach';
  if (days > 3) return 'bg-accent-yellow/20 text-accent-yellow';
  if (days >= 1) return 'bg-gray-600/20 text-gray-400';
  return 'bg-accent-green/20 text-accent-green';
}

var _ageDateFmt = { year: 'numeric', month: 'short', day: 'numeric' };

function formatAgeBadge(seconds, createdAt) {
  if (!seconds || seconds <= 0) return '';
  var days = seconds / 86400;
  var cls = ageBadgeClasses(days);
  var tooltip = '';
  if (createdAt) {
    var d = new Date(createdAt);
    if (!isNaN(d.getTime())) {
      tooltip = 'Created ' + d.toLocaleDateString(undefined, _ageDateFmt);
    } else {
      tooltip = 'Created ' + String(createdAt).split('T')[0];
    }
  }
  if (!tooltip) {
    var approx = new Date(Date.now() - seconds * 1000);
    tooltip = 'Created ' + approx.toLocaleDateString(undefined, _ageDateFmt);
  }
  var tooltipAttr = tooltip ? ' data-tooltip="' + escapeHtml(tooltip) + '"' : '';
  return '<span class="text-[10px] px-1.5 py-0.5 rounded-full shrink-0 ' + cls + '"' + tooltipAttr + '>' + formatAge(seconds) + '</span>';
}

function diffSizeLabel(additions, deletions) {
  var total = (additions || 0) + (deletions || 0);
  if (total === 0) return '';
  if (total <= 50) return 'S';
  if (total <= 200) return 'M';
  if (total <= 500) return 'L';
  return 'XL';
}

function diffSizeColor(additions, deletions) {
  var total = (additions || 0) + (deletions || 0);
  if (total <= 50) return 'text-accent-green';
  if (total <= 200) return 'text-accent';
  if (total <= 500) return 'text-accent-yellow';
  return 'text-accent-red';
}

// -- WebSocket for real-time agent status with polling fallback --
var _agentWs = null;
var _wsReconnectDelay = 1000;
var _wsMaxReconnectDelay = 16000;
var _wsReconnectAttempts = 0;
var _wsMaxReconnectAttempts = 10;
var _wsLastRunIds = null;

function _connectAgentWs() {
  if (_wsReconnectAttempts > _wsMaxReconnectAttempts) {
    console.warn('WebSocket max reconnect attempts reached, falling back to polling');
    _startPollingFallback();
    return;
  }
  var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  var wsUrl = proto + '//' + location.host + apiUrl('/ws/agents/status');
  _agentWs = new WebSocket(wsUrl);

  _agentWs.onopen = function() {
    _wsReconnectDelay = 1000;
    _wsReconnectAttempts = 0;
    // Stop polling if it was running as fallback
    if (agentPollInterval) { clearInterval(agentPollInterval); agentPollInterval = null; }
  };

  _agentWs.onmessage = function(event) {
    try {
      var msg = JSON.parse(event.data);
      if (msg.type === 'status_update' && Array.isArray(msg.runs)) {
        // Build a snapshot of display-relevant fields to detect any change
        var snapshot = msg.runs.map(function(r) {
          return r.run_id + ':' + r.status + ':' + (r.current_step || '') + ':' + r.step_index + ':' + (r.is_stuck ? '1' : '0');
        }).sort().join(',');
        if (_wsLastRunIds !== null && snapshot !== _wsLastRunIds) {
          _wsLastRunIds = snapshot;
          loadAgents();
          return;
        }
        _wsLastRunIds = snapshot;
        // Apply all display-relevant field deltas inline
        msg.runs.forEach(function(run) {
          var card = document.getElementById('agent-card-' + run.run_id);
          if (!card) return;

          // Re-render status badge with current values
          var badgeEl = card.querySelector('.sova-status-badge');
          if (badgeEl) {
            var elapsedSec = run.time_in_step_ms != null ? run.time_in_step_ms / 1000 : null;
            var newBadge = renderStatusBadge(run.status, run.current_step, run.step_index, run.total_steps, elapsedSec);
            badgeEl.outerHTML = newBadge;
          }

          // Update step pipeline
          var pipelineEl = card.querySelector('[data-pipeline-container]');
          if (pipelineEl) {
            pipelineEl.innerHTML = renderStepPipeline(run.current_step, run.role, false, run.pipeline_variant);
          }

          // Update elapsed time display with live ticker
          var elapsedEl = card.querySelector('[data-field="elapsed"]');
          if (elapsedEl) {
            var elSec = run.time_in_step_ms != null ? Math.floor(run.time_in_step_ms / 1000) : null;
            elapsedEl.innerHTML = elSec != null ? liveElapsed(elSec) : '';
          }
        });
      }
    } catch (e) {
      console.warn('WebSocket message parse error:', e);
    }
  };

  _agentWs.onclose = function() {
    _agentWs = null;
    _startPollingFallback();
    _wsReconnectAttempts++;
    if (_wsReconnectAttempts <= _wsMaxReconnectAttempts) {
      setTimeout(_connectAgentWs, _wsReconnectDelay);
      _wsReconnectDelay = Math.min(_wsReconnectDelay * 2, _wsMaxReconnectDelay);
    }
  };

  _agentWs.onerror = function() {
    if (_agentWs) _agentWs.close();
  };
}

function _startPollingFallback() {
  if (!agentPollInterval) {
    agentPollInterval = setInterval(loadAgents, 2000);
  }
}

function _formatStepName(name) {

  return name.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });

function _pipelineLabel(pipeline) {
  var labels = { developer: 'Dev', address_review: 'Addr', researcher: 'Res', pending: '', unknown: '' };
  return labels[pipeline] || pipeline;
}

// -- Kanban drag-and-drop state --
var _kanbanDragging = false;
var _kanbanDragRunId = null;
var _kanbanOrderKey = 'sova-kanban-card-order';

function _getKanbanOrder() {
  try {
    return JSON.parse(localStorage.getItem(_kanbanOrderKey)) || {};
  } catch (e) { return {}; }
}

function _saveKanbanOrder(order) {
  try {
    localStorage.setItem(_kanbanOrderKey, JSON.stringify(order));
  } catch (e) {
    console.warn('Failed to save kanban order:', e);
  }
}

function _columnKey(col) {
  return col.name + '--' + (col.pipeline || '');
}

function _applyCardOrder(runs, columnKey, savedOrder) {
  var order = savedOrder[columnKey];
  if (!order || !order.length) return runs;
  var byId = {};
  runs.forEach(function(r) { byId[r.id] = r; });
  var ordered = [];
  order.forEach(function(id) {
    if (byId[id]) { ordered.push(byId[id]); delete byId[id]; }
  });
  Object.keys(byId).forEach(function(id) { ordered.push(byId[id]); });
  return ordered;
}

var _kanbanPlaceholder = null;

function _removePlaceholder() {
  if (_kanbanPlaceholder) { _kanbanPlaceholder.remove(); _kanbanPlaceholder = null; }
}

function _insertPlaceholder(targetCard, clientY) {
  _removePlaceholder();
  var rect = targetCard.getBoundingClientRect();
  var midY = rect.top + rect.height / 2;
  _kanbanPlaceholder = document.createElement('div');
  _kanbanPlaceholder.className = 'kanban-drop-placeholder';
  if (clientY < midY) {
    targetCard.parentNode.insertBefore(_kanbanPlaceholder, targetCard);
  } else {
    targetCard.parentNode.insertBefore(_kanbanPlaceholder, targetCard.nextSibling);
  }
}

// -- Kanban drag-and-drop handlers (event delegation) --
// Minimum px movement before a touch gesture becomes a drag (prevents accidental drags while scrolling)
var _TOUCH_DRAG_THRESHOLD = 10;

function _saveColumnOrder(cardList) {
  var colKey = cardList.getAttribute('data-column');
  if (!colKey) return;
  var cards = cardList.querySelectorAll('.kanban-card[data-run-id]');
  var ids = [];
  cards.forEach(function(c) { ids.push(Number(c.getAttribute('data-run-id'))); });
  var order = _getKanbanOrder();
  order[colKey] = ids;
  _saveKanbanOrder(order);
}

// Stop polling during drag to prevent the DOM from being replaced mid-interaction
function _pauseKanbanPolling() {
  _kanbanDragging = true;
  if (_kanbanPollInterval) { clearInterval(_kanbanPollInterval); _kanbanPollInterval = null; }
}

// Re-fetch kanban data and restart the 5s poll cycle after a drag completes
function _resumeKanbanPolling() {
  _kanbanDragging = false;
  loadKanban();
  if (_agentView === 'kanban' && !_kanbanPollInterval) {
    _kanbanPollInterval = setInterval(loadKanban, 5000);
  }
}

(function() {
  var container = document.getElementById('kanban-columns');
  if (!container) return;

  container.addEventListener('dragstart', function(e) {
    var card = e.target.closest('.kanban-card[data-run-id]');
    if (!card) return;
    _pauseKanbanPolling();
    _kanbanDragRunId = card.getAttribute('data-run-id');
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', _kanbanDragRunId);
  });

  // Dragover fires at ~60Hz; throttle DOM updates via requestAnimationFrame
  var _dragRafPending = false;
  container.addEventListener('dragover', function(e) {
    var cardList = e.target.closest('.kanban-card-list');
    if (!cardList) return;
    var card = e.target.closest('.kanban-card[data-run-id]');
    if (card && card.getAttribute('data-run-id') === _kanbanDragRunId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';

    if (_dragRafPending) return;
    var clientY = e.clientY;
    var targetCard = card;
    _dragRafPending = true;
    requestAnimationFrame(function() {
      _dragRafPending = false;
      if (targetCard) {
        _insertPlaceholder(targetCard, clientY);
      } else {
        _removePlaceholder();
      }
    });
  });

  // Remove placeholder when cursor leaves all card lists; use relatedTarget
  // to avoid flicker when moving between child elements within the same list.
  container.addEventListener('dragleave', function(e) {
    if (!e.target.closest('.kanban-card-list')) return;
    if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.kanban-card-list')) return;
    _removePlaceholder();
  });

  container.addEventListener('drop', function(e) {
    e.preventDefault();
    var draggedId = e.dataTransfer.getData('text/plain');
    if (!/^\d+$/.test(draggedId)) { _removePlaceholder(); return; }
    var draggedCard = container.querySelector('.kanban-card[data-run-id="' + draggedId + '"]');
    var targetList = e.target.closest('.kanban-card-list');

    if (!draggedCard || !targetList) {
      _removePlaceholder();
      return;
    }

    // Only allow within-column reorder
    var sourceList = draggedCard.closest('.kanban-card-list');
    if (!sourceList || sourceList !== targetList) {
      _removePlaceholder();
      return;
    }

    if (_kanbanPlaceholder) {
      targetList.insertBefore(draggedCard, _kanbanPlaceholder);
      _removePlaceholder();
      _saveColumnOrder(targetList);
    }
  });

  container.addEventListener('dragend', function(e) {
    _removePlaceholder();
    var card = e.target.closest('.kanban-card[data-run-id]');
    if (card) card.classList.remove('dragging');
    _kanbanDragRunId = null;
    _resumeKanbanPolling();
  });

  // -- Touch drag-and-drop --
  var _touchDragCard = null;
  var _touchClone = null;
  var _touchStartX = 0;
  var _touchStartY = 0;
  var _touchDragging = false;

  container.addEventListener('touchstart', function(e) {
    var card = e.target.closest('.kanban-card[data-run-id]');
    if (!card) return;
    _touchDragCard = card;
    _touchDragging = false;
    var touch = e.touches[0];
    _touchStartX = touch.clientX;
    _touchStartY = touch.clientY;
  }, { passive: true });

  var _touchRafPending = false;
  container.addEventListener('touchmove', function(e) {
    if (!_touchDragCard) return;
    var touch = e.touches[0];
    var dx = touch.clientX - _touchStartX;
    var dy = touch.clientY - _touchStartY;

    if (!_touchDragging) {
      if (Math.sqrt(dx * dx + dy * dy) < _TOUCH_DRAG_THRESHOLD) return;
      _touchDragging = true;
      _pauseKanbanPolling();
      _touchDragCard.classList.add('dragging');
      _touchClone = _touchDragCard.cloneNode(true);
      _touchClone.classList.add('kanban-touch-clone');
      _touchClone.style.width = _touchDragCard.offsetWidth + 'px';
      document.body.appendChild(_touchClone);
    }

    e.preventDefault();
    _touchClone.style.left = touch.clientX + 'px';
    _touchClone.style.top = touch.clientY + 'px';

    if (_touchRafPending) return;
    var clientY = touch.clientY;
    var clientX = touch.clientX;
    var dragCard = _touchDragCard;
    _touchRafPending = true;
    requestAnimationFrame(function() {
      _touchRafPending = false;
      var elem = document.elementFromPoint(clientX, clientY);
      if (elem) {
        var targetCard = elem.closest('.kanban-card[data-run-id]');
        if (targetCard && targetCard !== dragCard) {
          var targetList = targetCard.closest('.kanban-card-list');
          var sourceList = dragCard.closest('.kanban-card-list');
          if (targetList === sourceList) {
            _insertPlaceholder(targetCard, clientY);
          }
        }
      }
    });
  }, { passive: false });

  container.addEventListener('touchend', function(e) {
    if (!_touchDragCard) return;
    if (!_touchDragging) {
      _touchDragCard = null;
      return;
    }

    if (_touchClone) { _touchClone.remove(); _touchClone = null; }
    _touchDragCard.classList.remove('dragging');

    // Use existing placeholder position for drop target
    if (_kanbanPlaceholder) {
      var targetList = _kanbanPlaceholder.closest('.kanban-card-list');
      var sourceList = _touchDragCard.closest('.kanban-card-list');
      if (targetList && targetList === sourceList) {
        targetList.insertBefore(_touchDragCard, _kanbanPlaceholder);
        _saveColumnOrder(targetList);
      }
    }
    _removePlaceholder();

    _touchDragCard = null;
    _touchDragging = false;
    _resumeKanbanPolling();
  });
})();

async function _loadCrQuota() {
  try {
    var resp = await fetch(apiUrl('/quota/coderabbit'));
    if (!resp.ok) return;
    var data = await resp.json();
    var widget = document.getElementById('cr-quota-widget');
    if (!data.enabled) { widget.classList.add('hidden'); return; }
    widget.classList.remove('hidden');

    var used = data.reviews_in_window || 0;
    var limit = data.reviews_per_hour || 0;
    var pct = limit > 0 ? Math.min(100, Math.round((used / limit) * 100)) : 0;

    document.getElementById('cr-quota-usage').textContent = used + ' / ' + limit + ' reviews';

    var bar = document.getElementById('cr-quota-bar');
    bar.style.width = pct + '%';

    var dot = document.getElementById('cr-quota-dot');
    var statusEl = document.getElementById('cr-quota-status');
    var waitEl = document.getElementById('cr-quota-wait');

    if (data.can_create_pr) {
      dot.className = 'w-2 h-2 rounded-full bg-accent-green';
      bar.className = 'h-1.5 rounded-full transition-all duration-300 bg-accent-green';
      statusEl.textContent = 'Available';
      statusEl.className = 'text-xs text-accent-green';
      waitEl.classList.add('hidden');
    } else {
      dot.className = 'w-2 h-2 rounded-full bg-accent-peach';
      bar.className = 'h-1.5 rounded-full transition-all duration-300 bg-accent-peach';
      statusEl.textContent = 'Rate limited';
      statusEl.className = 'text-xs text-accent-peach';
      if (data.next_available_minutes != null) {
        var mins = Math.ceil(data.next_available_minutes);
        waitEl.textContent = 'Next slot in ~' + mins + ' min';
        waitEl.classList.remove('hidden');
      }
    }
  } catch (e) { /* non-fatal */ }
}

async function _syncCrQuota() {
  try {
    await fetch(apiUrl('/quota/coderabbit/sync'), {method: 'POST'});
    await _loadCrQuota();
  } catch (e) { /* non-fatal */ }
}

// -- Memory Pressure Banner --

async function checkMemoryPressure() {
  var banner = document.getElementById('memory-pressure-banner');
  try {
    var data = await fetchAPI(apiUrl('/resources/system/metrics'));
    if (!data.available || !data.system) { banner.classList.add('hidden'); return; }
    var pressure = data.system.memory_pressure;
    var availGb = data.system.memory_available_gb;
    if (!pressure || pressure === 'ok') {
      banner.classList.add('hidden');
      sessionStorage.removeItem('sova-memory-pressure-dismissed');
      return;
    }

    var isCritical = pressure === 'critical';

    // Only allow dismissing warnings, never critical banners
    if (!isCritical && sessionStorage.getItem('sova-memory-pressure-dismissed')) {
      banner.classList.add('hidden');
      return;
    }

    var colorClass = isCritical ? 'accent-red' : 'accent-yellow';
    var label = isCritical ? 'Critical: agent spawning blocked' : 'Warning: memory is low';
    var detail = availGb != null ? availGb.toFixed(1) + ' GB available' : '';

    var dismissBtn = isCritical ? '' :
      '<button onclick="dismissMemoryPressure()" class="px-2 py-1 rounded text-xs text-gray-500 hover:text-gray-300 hover:bg-surface-hover transition-colors">Dismiss</button>';

    banner.classList.remove('hidden');
    banner.innerHTML = '<div class="bg-' + colorClass + '/10 border border-' + colorClass + '/30 rounded-lg p-4">' +
      '<div class="flex items-center justify-between">' +
        '<div class="flex items-center gap-2">' +
          '<span class="text-sm font-medium text-' + colorClass + '">' + escapeHtml(label) + '</span>' +
          '<span class="text-xs text-gray-500">' + escapeHtml(detail) + '</span>' +
        '</div>' +
        dismissBtn +
      '</div>' +
    '</div>';
  } catch (e) { /* best-effort */ }
}

function dismissMemoryPressure() {
  sessionStorage.setItem('sova-memory-pressure-dismissed', '1');
  document.getElementById('memory-pressure-banner').classList.add('hidden');
}

var _memPressureInterval = setInterval(checkMemoryPressure, 3000);

</script>
{% endblock %}
