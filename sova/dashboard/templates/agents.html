{% extends "base.html" %}
{% block title %}Agents - SOVA{% endblock %}
{% block content %}
<h2 class="text-2xl font-semibold mb-4">Agents</h2>

<!-- Task Browser -->
<div class="bg-surface-card rounded-lg border border-gray-700/50 mb-6">
  <!-- Header bar -->
  <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-700/50">
    <h3 class="text-sm font-medium text-gray-300">Tasks</h3>
    <div class="relative flex-1 max-w-xs ml-2">
      <label for="task-search" class="sr-only">Search issues</label>
      <input type="text" id="task-search" placeholder="Search all issues..." autocomplete="off"
        class="w-full bg-surface border border-gray-700 rounded px-3 py-1.5 text-xs text-gray-200 pl-8 focus:border-accent focus:outline-none"
        oninput="filterTaskCards()">
      <svg class="absolute left-2.5 top-[7px] w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </div>
    <span id="slots-info" class="text-xs text-gray-600 ml-auto"></span>
  </div>
  <!-- Task list -->
  <div id="task-grid" class="divide-y divide-gray-700/30">
    <p class="text-gray-500 text-sm py-6 text-center">Loading tasks...</p>
  </div>
</div>

<!-- PR Tracker -->
<div class="bg-surface-card rounded-lg border border-gray-700/50 mb-6">
  <button id="pr-tracker-toggle" type="button" class="w-full flex items-center gap-3 px-4 py-3 border-b border-gray-700/50 cursor-pointer select-none text-left" onclick="togglePrTracker()" aria-controls="pr-tracker-list" aria-expanded="true">
    <h3 class="text-sm font-medium text-gray-300">Pull Requests</h3>
    <span id="pr-tracker-count" class="text-xs text-gray-500"></span>
    <svg id="pr-tracker-chevron" class="ml-auto w-4 h-4 text-gray-500 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
  </button>
  <div id="pr-tracker-list" class="divide-y divide-gray-700/30">
    <p class="text-gray-500 text-sm py-4 text-center">Loading PRs...</p>
  </div>
</div>

<!-- Hidden inputs for runCommand/startAgent backward compat -->
<input type="hidden" id="agent-issue" value="">
<input type="hidden" id="agent-issue-number" value="">

<!-- PR Actions Panel (shown when selected issue has a linked PR) -->
<div id="pr-actions-panel" class="hidden mb-6">
  <div id="pr-actions-card" class="rounded-lg border p-4">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <span id="pr-status-dot" class="w-2.5 h-2.5 rounded-full"></span>
        <span id="pr-status-label" class="text-sm font-medium"></span>
        <a id="pr-link" href="#" target="_blank" class="text-xs text-gray-500 hover:text-accent transition-colors">view on GitHub</a>
      </div>
      <div id="pr-status-badges" class="flex items-center gap-2"></div>
    </div>
    <p id="pr-title" class="text-sm text-gray-300 mb-3"></p>
    <div id="pr-action-buttons" class="flex flex-wrap gap-2"></div>
  </div>
</div>

<!-- Handoff Action Panel (shown when no agents running but handoff awaits action) -->
<div id="handoff-panel" class="hidden mb-6">
  <div class="bg-accent-yellow/5 border border-accent-yellow/20 rounded-lg p-4">
    <div class="flex items-center gap-2 mb-3">
      <span class="w-2.5 h-2.5 rounded-full bg-accent-yellow animate-pulse"></span>
      <span class="text-sm text-accent-yellow font-medium">Review Complete -- Action Required</span>
    </div>
    <div id="handoff-panel-details" class="mb-3">
      <p id="handoff-panel-summary" class="text-sm text-gray-300"></p>
      <p id="handoff-panel-meta" class="text-xs text-gray-500 mt-1"></p>
    </div>
    <div id="handoff-panel-actions" class="flex flex-wrap gap-2"></div>
    <div class="mt-3 border-t border-gray-700/30 pt-3">
      <button onclick="dismissHandoff()" class="text-xs text-gray-500 hover:text-gray-300 transition-colors" data-tooltip="Dismiss this handoff">
        Dismiss
      </button>
    </div>
  </div>
</div>

<!-- Running Agents Grid -->
<div id="agents-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
  <div class="text-gray-500 text-sm">No agents running</div>
</div>

<!-- Interrupted Runs Banner -->
<div id="interrupted-banner" class="hidden mb-6"></div>

<!-- Log Viewer -->
<div id="log-viewer" class="hidden bg-surface-card rounded-lg border border-gray-700/50 overflow-hidden mb-6">
  <div class="flex items-center border-b border-gray-700/50">
    <div id="log-tabs" class="flex flex-1 overflow-x-auto"></div>
    <button onclick="closeLogViewer()" class="px-3 py-2 text-gray-500 hover:text-gray-300 text-xs transition-colors" data-tooltip="Close log viewer">Close</button>
  </div>
  <div id="log-content" class="p-4 font-mono text-xs text-gray-300 max-h-[500px] overflow-y-auto whitespace-pre-wrap"></div>
</div>

<!-- History Section -->
<div class="border-t border-gray-700/30 pt-6">
  <div class="flex items-center gap-1 mb-4 border-b border-gray-700/50">
    <button onclick="switchTab('history')" id="tab-history"
      class="px-4 py-2.5 text-sm transition-colors border-b-2 border-accent text-white"
      data-tooltip="Completed run history" data-tooltip-pos="bottom">
      History
    </button>
    <button onclick="switchTab('failed')" id="tab-failed"
      class="px-4 py-2.5 text-sm transition-colors border-b-2 border-transparent text-gray-500 hover:text-gray-300"
      data-tooltip="Failed runs only" data-tooltip-pos="bottom">
      Failed <span id="tab-failed-count" class="text-xs text-gray-500 ml-1"></span>
    </button>
  </div>

  <div id="panel-history">
    <div class="flex items-center gap-3 mb-4">
      <select id="filter-role" onchange="historyPage=0; loadHistory()" class="bg-surface border border-gray-700 rounded px-3 py-1.5 text-xs text-gray-300 focus:border-accent focus:outline-none">
        <option value="">All roles</option>
        <option value="developer">Developer</option>
        <option value="triage">Triage</option>
        <option value="researcher">Researcher</option>
        <option value="reviewer">Reviewer</option>
        <option value="auto">Auto</option>
      </select>
      <div id="history-pager" class="hidden flex items-center gap-2 ml-auto text-xs text-gray-500">
        <button onclick="historyPrev()" id="history-prev" class="px-2 py-1 rounded hover:bg-surface-hover disabled:opacity-30 transition-colors" disabled>&lt; Prev</button>
        <span id="history-page-info"></span>
        <button onclick="historyNext()" id="history-next" class="px-2 py-1 rounded hover:bg-surface-hover disabled:opacity-30 transition-colors" disabled>Next &gt;</button>
      </div>
    </div>
    <div id="history-table"></div>
  </div>

  <div id="panel-failed" class="hidden">
    <div class="flex items-center gap-3 mb-4">
      <div id="failed-pager" class="hidden flex items-center gap-2 ml-auto text-xs text-gray-500">
        <button onclick="failedPrev()" id="failed-prev" class="px-2 py-1 rounded hover:bg-surface-hover disabled:opacity-30 transition-colors" disabled>&lt; Prev</button>
        <span id="failed-page-info"></span>
        <button onclick="failedNext()" id="failed-next" class="px-2 py-1 rounded hover:bg-surface-hover disabled:opacity-30 transition-colors" disabled>Next &gt;</button>
      </div>
    </div>
    <div id="failed-table"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var activeLogRunId = null;

// -- Task browser --

var _allQueue = [];
var _queueData = [];
var _agentHistory = [];
var _suggested = [];
var _runningIssues = new Set();

function stateTag(state) {
  var colors = {
    backlog: 'bg-gray-600/30 text-gray-400',
    triaged: 'bg-accent-yellow/20 text-accent-yellow',
    researched: 'bg-accent-purple/20 text-accent-purple',
    in_progress: 'bg-accent/20 text-accent',
    in_review: 'bg-accent-green/20 text-accent-green',
    needs_spec: 'bg-accent-yellow/20 text-accent-yellow',
    human_only: 'bg-gray-600/30 text-gray-500',
    done: 'bg-accent-green/30 text-accent-green',
  };
  var cls = colors[state] || 'bg-gray-600/30 text-gray-400';
  return '<span class="px-1.5 py-0.5 rounded text-xs ' + cls + '">' + escapeHtml(state) + '</span>';
}

var _actionLabels = {
  triage: { text: 'Triage', cls: 'bg-accent-yellow/20 text-accent-yellow hover:bg-accent-yellow/30' },
  research: { text: 'Research', cls: 'bg-accent-purple/20 text-accent-purple hover:bg-accent-purple/30' },
  develop: { text: 'Develop', cls: 'bg-accent/20 text-accent hover:bg-accent/30' },
  review: { text: 'Review', cls: 'bg-accent-green/20 text-accent-green hover:bg-accent-green/30' },
  resume: { text: 'Resume', cls: 'bg-accent/20 text-accent hover:bg-accent/30' },
  harden: { text: 'Harden', cls: 'bg-accent-purple/20 text-accent-purple hover:bg-accent-purple/30' },
  spec: { text: 'Spec', cls: 'bg-accent-yellow/20 text-accent-yellow hover:bg-accent-yellow/30' },
};

var _TIER2_PAGE_SIZE = 15;
var _expansionTier = 0; // 0=top priority only, 1=+15 more, 2=show all
var _cardMenuOpen = false;

async function loadTaskCards() {
  try {
    var res = await fetch(apiUrl('/queue'));
    if (!res.ok) return;
    var data = await res.json();
    _allQueue = data.queue || [];
    _agentHistory = _allQueue.filter(function(t) { return t.last_run; });
    _suggested = _allQueue.filter(function(t) {
      return !t.last_run && (t.state === 'researched' || t.state === 'triaged');
    });
    _queueData = _agentHistory.concat(_suggested);
    renderTaskCards();
  } catch (e) {
    document.getElementById('task-grid').innerHTML =
      '<p class="text-accent-red text-sm py-6 text-center">Failed to load tasks</p>';
  }
}

function filterTaskCards() {
  renderTaskCards();
}

function expandTasks() {
  _expansionTier++;
  renderTaskCards();
}

function collapseTasks() {
  _expansionTier = 0;
  renderTaskCards();
}

function _extractPriority(labels) {
  for (var i = 0; i < (labels || []).length; i++) {
    var l = labels[i];
    if (l.indexOf('priority:') === 0) return l.replace('priority: ', '').replace('priority:', '').trim();
  }
  return '';
}

var _priorityOrder = { critical: 0, high: 1, medium: 2, low: 3 };

function renderTaskCard(t) {
  var isRunning = _runningIssues.has(String(t.issue));
  var action = _actionLabels[t.action] || _actionLabels.develop;
  var lastFailed = t.last_run && t.last_run.status === 'failed';
  var p = _extractPriority(t.labels);
  var pDots = { critical: 'bg-accent-red', high: 'bg-accent-yellow', medium: 'bg-gray-500', low: 'bg-gray-600' };
  var pDot = p ? '<span class="w-1.5 h-1.5 rounded-full shrink-0 ' + (pDots[p] || 'bg-gray-600') + '"></span>' : '';

  var actionBtn;
  if (isRunning) {
    actionBtn = '<span class="flex items-center gap-1.5 text-[10px] text-accent-yellow whitespace-nowrap">' +
      '<span class="w-1.5 h-1.5 rounded-full bg-accent-yellow animate-pulse"></span>Running</span>';
  } else {
    actionBtn = '<button onclick="quickStart(\'' + escapeHtml(t.issue) + '\', false, \'' + escapeHtml(t.action) + '\')" ' +
      'class="text-xs px-2.5 py-1 rounded transition-colors whitespace-nowrap ' + action.cls + '">' +
      escapeHtml(action.text) + '</button>';
  }

  var failedDot = lastFailed
    ? '<span class="w-1.5 h-1.5 rounded-full bg-accent-red shrink-0" data-tooltip="Last run failed"></span>'
    : '';

  var prBadge = '';
  var linkedPr = getPrForIssue(t.issue);
  if (linkedPr) {
    var prStateClass = _prStateColors[linkedPr.computed_state] || 'bg-gray-600/30 text-gray-400';
    prBadge = '<span class="text-xs px-1.5 py-0.5 rounded ' + prStateClass + ' whitespace-nowrap shrink-0">' +
      'PR #' + escapeHtml(String(linkedPr.number)) + ' ' + escapeHtml(linkedPr.state_label) + '</span>';
  }

  return '<div class="group flex items-center gap-3 px-4 py-2.5 hover:bg-surface-hover transition-colors relative">' +
    pDot +
    '<span class="text-xs font-medium shrink-0">' + (t.jira_key ? escapeHtml(t.jira_key) : issueLink(t.issue)) + '</span>' +
    '<span class="text-sm text-gray-300 truncate flex-1">' + escapeHtml(t.title) + '</span>' +
    failedDot +
    prBadge +
    stateTag(t.state) +
    '<div class="w-20 flex justify-end">' + actionBtn + '</div>' +
    '<button onclick="toggleCardMenu(event, \'' + escapeHtml(t.issue) + '\')" ' +
      'class="opacity-0 group-hover:opacity-100 text-gray-600 hover:text-gray-400 transition-all p-0.5 shrink-0" ' +
      'data-tooltip="More options">' +
      '<svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><circle cx="10" cy="4" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="10" cy="16" r="1.5"/></svg>' +
    '</button>' +
    '<div id="card-menu-' + t.issue + '" class="hidden absolute right-4 top-8 z-50 bg-surface border border-gray-700 rounded-lg shadow-xl py-1 min-w-[160px]">' +
      '<button onclick="quickStart(\'' + escapeHtml(t.issue) + '\', true)" class="w-full text-left px-3 py-1.5 text-xs text-gray-300 hover:bg-surface-hover transition-colors">Start with --force</button>' +
      '<button onclick="quickStartRole(\'' + escapeHtml(t.issue) + '\', \'reviewer\')" class="w-full text-left px-3 py-1.5 text-xs text-gray-300 hover:bg-surface-hover transition-colors">Start as Reviewer</button>' +
      '<button onclick="quickStartRole(\'' + escapeHtml(t.issue) + '\', \'triage\')" class="w-full text-left px-3 py-1.5 text-xs text-gray-300 hover:bg-surface-hover transition-colors">Start as Triage</button>' +
      (t.state === 'in_review' && t.last_run && t.last_run.pr_number
        ? '<hr class="border-gray-700/50 my-1">' +
          '<button onclick="quickStartRole(\'' + escapeHtml(t.issue) + '\', \'developer\', ' + t.last_run.pr_number + ')" class="w-full text-left px-3 py-1.5 text-xs text-accent-yellow hover:bg-surface-hover transition-colors">Address Review (PR #' + t.last_run.pr_number + ')</button>' +
          '<button onclick="runCommand(\'integrate-pr\', {issue: \'' + escapeHtml(t.issue) + '\', pr: ' + t.last_run.pr_number + '})" class="w-full text-left px-3 py-1.5 text-xs text-accent-green hover:bg-surface-hover transition-colors">Integrate PR #' + t.last_run.pr_number + '</button>'
        : '') +
    '</div>' +
  '</div>';
}

function renderTaskCards() {
  _cardMenuOpen = false;
  var grid = document.getElementById('task-grid');
  var q = (document.getElementById('task-search').value || '').trim().toLowerCase().replace(/^#/, '');
  var prefix = window.SOVA_PROJECT_SLUG ? '/p/' + window.SOVA_PROJECT_SLUG : '';

  if (q) {
    var items = _allQueue.filter(function(t) {
      return t.issue.toString().includes(q) || t.title.toLowerCase().includes(q) ||
        (t.jira_key && t.jira_key.toLowerCase().includes(q));
    });
    if (!items.length) {
      grid.innerHTML = '<p class="text-gray-500 text-sm py-6 text-center">No matching issues</p>';
      return;
    }
    grid.innerHTML = items.map(renderTaskCard).join('');
    return;
  }

  var html = '';
  var hasHistory = _agentHistory.length > 0;
  var hasSuggested = _suggested.length > 0;

  if (!hasHistory && !hasSuggested) {
    grid.innerHTML = '<p class="text-gray-500 text-sm py-6 text-center">' +
      'No tasks available. <a href="' + prefix + '/queue" class="text-accent hover:underline">Visit the Priority Queue</a> to triage new issues.</p>';
    return;
  }

  if (hasHistory) {
    var _highPriStates = { in_progress: 1, in_review: 1 };
    var _highPriLabels = { critical: 1, high: 1 };
    var sorted = _agentHistory.slice().sort(function(a, b) {
      if (a.priority !== b.priority) return a.priority - b.priority;
      var pa = _priorityOrder[_extractPriority(a.labels)];
      var pb = _priorityOrder[_extractPriority(b.labels)];
      return (pa === undefined ? 99 : pa) - (pb === undefined ? 99 : pb);
    });

    var tier1 = sorted.filter(function(t) {
      return _highPriStates[t.state] || _highPriLabels[_extractPriority(t.labels)];
    });
    if (tier1.length === 0 && sorted.length > 0) tier1 = sorted.slice(0, 3);

    var visible;
    var hiddenCount;
    if (_expansionTier === 0) {
      visible = tier1;
      hiddenCount = sorted.length - tier1.length;
    } else if (_expansionTier === 1) {
      visible = sorted.slice(0, tier1.length + _TIER2_PAGE_SIZE);
      hiddenCount = Math.max(0, sorted.length - visible.length);
    } else {
      visible = sorted;
      hiddenCount = 0;
    }

    html += visible.map(renderTaskCard).join('');

    if (hiddenCount > 0) {
      var label = hiddenCount <= _TIER2_PAGE_SIZE
        ? 'Show ' + hiddenCount + ' more'
        : 'Show ' + Math.min(hiddenCount, _TIER2_PAGE_SIZE) + ' more (' + hiddenCount + ' remaining)';
      html += '<div class="px-4 py-2 border-t border-gray-700/30">' +
        '<button onclick="expandTasks()" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">' +
        label + '</button></div>';
    } else if (_expansionTier > 0) {
      html += '<div class="px-4 py-2 border-t border-gray-700/30">' +
        '<button onclick="collapseTasks()" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">' +
        'Show less</button></div>';
    }
  }

  if (hasSuggested) {
    var suggestedVisible = _suggested.slice(0, 5);
    html += '<div class="flex items-center gap-2 px-4 py-2 border-t border-gray-700/30">' +
      '<span class="text-xs text-gray-500">Suggested</span>' +
      '<div class="flex-1 border-t border-gray-700/20"></div>' +
    '</div>';
    html += '<div class="opacity-80">' + suggestedVisible.map(renderTaskCard).join('') + '</div>';
    if (_suggested.length > 5) {
      html += '<div class="px-4 py-2 border-t border-gray-700/30">' +
        '<a href="' + prefix + '/queue" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">' +
        (_suggested.length - 5) + ' more in Priority Queue</a></div>';
    }
  }

  grid.innerHTML = html;
}

function toggleCardMenu(event, issue) {
  event.stopPropagation();
  var menu = document.getElementById('card-menu-' + issue);
  var wasHidden = menu.classList.contains('hidden');
  document.querySelectorAll('[id^="card-menu-"]').forEach(function(m) { m.classList.add('hidden'); });
  if (wasHidden) menu.classList.remove('hidden');
  _cardMenuOpen = wasHidden;
}

document.addEventListener('click', function() {
  document.querySelectorAll('[id^="card-menu-"]').forEach(function(m) { m.classList.add('hidden'); });
  _cardMenuOpen = false;
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && _cardMenuOpen) {
    document.querySelectorAll('[id^="card-menu-"]').forEach(function(m) { m.classList.add('hidden'); });
    _cardMenuOpen = false;
  }
});

var _actionToRole = {
  triage: 'triage',
  research: 'researcher',
  develop: 'developer',
  review: 'reviewer',
  resume: 'developer',
};

var _actionToCommand = {
  spec: 'spec',
};

async function quickStart(issue, force, action) {
  var cmd = action ? _actionToCommand[action] : null;
  if (cmd) {
    await runCommand(cmd, { issue: String(issue) });
    return;
  }
  var roleEl = document.getElementById('agent-role');
  var role = (roleEl && roleEl.value) || null;
  if (!role && action) {
    role = _actionToRole[action] || null;
  }
  await _doStartAgent(issue, role, force || false);
}

async function quickStartRole(issue, role, prNumber) {
  await _doStartAgent(issue, role, false, prNumber);
}

async function _doStartAgent(issue, role, force, prNumber) {
  try {
    var payload = { issue: String(issue), role: role, force: force };
    if (prNumber) payload.pr_number = prNumber;
    var res = await fetch(apiUrl('/agents/start'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      showToast(await getErrorDetail(res, 'Failed to start agent'), 'error');
    } else {
      var result = await res.json();
      if (result.error) { showToast(result.error, 'error'); return; }
      if (result.run_id) viewLogs(result.run_id);
      showToast('Agent started for #' + issue, 'success');
    }
  } catch (e) {
    showToast('Failed to start agent: ' + e.message, 'error');
  }
  loadAgents();
  loadTaskCards();
}

// -- PR status panel --

var _prStatusAbort = null;

async function fetchPrStatus(issueNumber) {
  if (_prStatusAbort) _prStatusAbort.abort();
  var controller = new AbortController();
  _prStatusAbort = controller;

  var panel = document.getElementById('pr-actions-panel');

  try {
    var res = await fetch(apiUrl('/agents/issue/' + issueNumber + '/pr-status'), { signal: controller.signal });
    if (!res.ok) { panel.classList.add('hidden'); return; }
    var data = await res.json();

    if (!data.has_pr) { panel.classList.add('hidden'); return; }
    if (data.error) { panel.classList.add('hidden'); return; }

    renderPrActionsPanel(data, issueNumber);
  } catch (e) {
    if (e.name !== 'AbortError') panel.classList.add('hidden');
  }
}

function renderPrActionsPanel(pr, issueNumber) {
  var panel = document.getElementById('pr-actions-panel');
  var card = document.getElementById('pr-actions-card');
  var dot = document.getElementById('pr-status-dot');
  var label = document.getElementById('pr-status-label');
  var link = document.getElementById('pr-link');
  var badges = document.getElementById('pr-status-badges');
  var title = document.getElementById('pr-title');
  var buttons = document.getElementById('pr-action-buttons');

  // Status dot and label
  var ciGreen = pr.ci_status === 'passed' || pr.ci_status === 'none';
  var sovaBlocking = pr.sova_review && pr.sova_review.has_sova_review && pr.sova_review.verdict !== 'approve';
  var readyToIntegrate = pr.state === 'OPEN' && ciGreen && pr.is_mergeable && pr.review_decision !== 'CHANGES_REQUESTED' && !sovaBlocking;
  if (readyToIntegrate) {
    dot.className = 'w-2.5 h-2.5 rounded-full bg-accent-green';
    label.className = 'text-sm font-medium text-accent-green';
    label.textContent = 'PR #' + pr.pr_number + ' -- Ready to Integrate';
    card.className = 'rounded-lg border border-accent-green/30 bg-accent-green/5 p-4';
  } else if (pr.state === 'OPEN' && sovaBlocking) {
    dot.className = 'w-2.5 h-2.5 rounded-full bg-accent-red';
    label.className = 'text-sm font-medium text-accent-red';
    label.textContent = 'PR #' + pr.pr_number + ' -- Review: ' + pr.sova_review.verdict;
    card.className = 'rounded-lg border border-accent-red/30 bg-accent-red/5 p-4';
  } else if (pr.state === 'OPEN' && pr.review_decision !== 'CHANGES_REQUESTED') {
    dot.className = 'w-2.5 h-2.5 rounded-full bg-accent-yellow';
    label.className = 'text-sm font-medium text-accent-yellow';
    var reason = !ciGreen ? 'CI ' + pr.ci_status : 'not mergeable';
    label.textContent = 'PR #' + pr.pr_number + ' -- ' + reason;
    card.className = 'rounded-lg border border-accent-yellow/30 bg-accent-yellow/5 p-4';
  } else if (pr.state === 'MERGED') {
    dot.className = 'w-2.5 h-2.5 rounded-full bg-accent-purple';
    label.className = 'text-sm font-medium text-accent-purple';
    label.textContent = 'PR #' + pr.pr_number + ' -- Merged';
    card.className = 'rounded-lg border border-accent-purple/30 bg-accent-purple/5 p-4';
  } else {
    dot.className = 'w-2.5 h-2.5 rounded-full bg-gray-500';
    label.className = 'text-sm font-medium text-gray-400';
    label.textContent = 'PR #' + pr.pr_number;
    card.className = 'rounded-lg border border-gray-700/50 bg-surface-card p-4';
  }

  if (pr.url) { link.href = pr.url; link.classList.remove('hidden'); }
  else { link.classList.add('hidden'); }

  // Badges
  var badgeHtml = '';
  var reviewColors = {
    APPROVED: 'bg-accent-green/20 text-accent-green',
    CHANGES_REQUESTED: 'bg-accent-red/20 text-accent-red',
    REVIEW_REQUIRED: 'bg-accent-yellow/20 text-accent-yellow',
  };
  var reviewLabel = pr.review_decision || 'no review';
  var reviewClass = reviewColors[pr.review_decision] || 'bg-gray-600/30 text-gray-400';
  if (!pr.review_decision && pr.sova_review && pr.sova_review.has_sova_review) {
    reviewLabel = 'sova: ' + pr.sova_review.verdict;
    reviewClass = pr.sova_review.verdict === 'approve'
      ? 'bg-accent-green/20 text-accent-green'
      : 'bg-accent-red/20 text-accent-red';
  }
  badgeHtml += '<span class="px-1.5 py-0.5 rounded text-xs ' + reviewClass + '">' + escapeHtml(reviewLabel.toLowerCase().replace(/_/g, ' ')) + '</span>';

  var ciColors = { passed: 'bg-accent-green/20 text-accent-green', failed: 'bg-accent-red/20 text-accent-red', pending: 'bg-accent-yellow/20 text-accent-yellow', none: 'bg-gray-600/30 text-gray-400' };
  var ciClass = ciColors[pr.ci_status] || 'bg-gray-600/30 text-gray-400';
  badgeHtml += '<span class="px-1.5 py-0.5 rounded text-xs ' + ciClass + '">CI: ' + escapeHtml(pr.ci_status) + '</span>';

  if (pr.is_mergeable) {
    badgeHtml += '<span class="px-1.5 py-0.5 rounded text-xs bg-accent-green/20 text-accent-green">mergeable</span>';
  } else if (pr.mergeable === 'CONFLICTING') {
    badgeHtml += '<span class="px-1.5 py-0.5 rounded text-xs bg-accent-red/20 text-accent-red">conflicts</span>';
  }
  badges.innerHTML = badgeHtml;

  title.textContent = pr.title || '';

  // Action buttons based on PR state (ordered chronologically: review -> integrate -> merge)
  var actionsHtml = '';
  if (pr.state === 'OPEN') {
    var needsReview = !pr.review_decision || pr.review_decision === 'REVIEW_REQUIRED';
    var changesRequested = pr.review_decision === 'CHANGES_REQUESTED';

    // SOVA review overrides empty GitHub review_decision
    if (needsReview && pr.sova_review && pr.sova_review.has_sova_review) {
      if (pr.sova_review.verdict === 'approve') {
        needsReview = false;
      } else {
        needsReview = false;
        changesRequested = true;
      }
    }

    if (needsReview) {
      actionsHtml += '<button onclick="runCommand(\'review-pr\', {issue: \'' + issueNumber + '\', pr: ' + pr.pr_number + '})" ' +
        'class="px-3 py-2 rounded text-sm bg-accent/20 text-accent hover:bg-accent/30 border border-accent/30 transition-colors" ' +
        'data-tooltip="Spawn reviewer agent to analyze this PR">' +
        'Start Review</button>';
    } else if (changesRequested) {
      actionsHtml += '<button onclick="runCommand(\'address-pr\', {issue: \'' + issueNumber + '\', pr: ' + pr.pr_number + '})" ' +
        'class="px-3 py-2 rounded text-sm bg-accent-yellow/20 text-accent-yellow hover:bg-accent-yellow/30 border border-accent-yellow/30 transition-colors" ' +
        'data-tooltip="Send agent to address review feedback">' +
        'Address Review</button>';
    }

    actionsHtml += '<button onclick="runCommand(\'integrate-pr\', {issue: \'' + issueNumber + '\', pr: ' + pr.pr_number + '})" ' +
      'class="px-3 py-2 rounded text-sm ' + (readyToIntegrate
        ? 'font-medium bg-accent-green/20 text-accent-green hover:bg-accent-green/30 border border-accent-green/30'
        : 'bg-accent/20 text-accent hover:bg-accent/30 border border-accent/30') + ' transition-colors" ' +
      'data-tooltip="Rebase, push, merge, and clean up">' +
      'Integrate PR</button>';

    if (readyToIntegrate) {
      actionsHtml += '<button onclick="runCommand(\'approve-merge\', {issue: \'' + issueNumber + '\', pr: ' + pr.pr_number + '})" ' +
        'class="px-3 py-2 rounded text-sm bg-accent/20 text-accent hover:bg-accent/30 border border-accent/30 transition-colors" ' +
        'data-tooltip="Merge without full integration">' +
        'Merge Only</button>';
    }
  } else if (pr.state === 'MERGED') {
    actionsHtml += '<button onclick="runCommand(\'after-merge\', {issue: \'' + issueNumber + '\', pr: ' + pr.pr_number + '})" ' +
      'class="px-3 py-2 rounded text-sm bg-accent-purple/20 text-accent-purple hover:bg-accent-purple/30 border border-accent-purple/30 transition-colors" ' +
      'data-tooltip="Run post-merge cleanup tasks">' +
      'Post-Merge Cleanup</button>';
  }
  buttons.innerHTML = actionsHtml;

  panel.classList.remove('hidden');
}

function hidePrActionsPanel() {
  document.getElementById('pr-actions-panel').classList.add('hidden');
}

async function runCommand(command, args) {
  try {
    var res = await fetch(apiUrl('/agents/command'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: command, args: args }),
    });
    if (!res.ok) {
      showToast(await getErrorDetail(res, 'Failed to run command'), 'error');
    } else {
      var result = await res.json();
      hidePrActionsPanel();
      document.getElementById('agent-issue').value = '';
      document.getElementById('agent-issue-number').value = '';
      if (result.run_id) viewLogs(result.run_id);
    }
  } catch (e) {
    showToast('Failed to run command: ' + e.message, 'error');
  }
  loadAgents();
  loadTaskCards();
}

var logCursor = 0;
var agentPollInterval = null;
var logPollInterval = null;
var lastAgentFingerprint = null;

function agentFingerprint(data) {
  var running = data.agents.map(function(a) {
    return a.run_id + ':' + a.status + ':' + a.current_step + ':' + (a.cost_usd || 0) + ':' + (a.pr_number || '') + ':' + (a.source || '');
  });
  var completed = data.completed.map(function(a) {
    return a.run_id + ':' + a.status + ':' + (a.cost_usd || 0) + ':' + (a.pr_number || '');
  });
  return data.slots_available + '|' + running.join(',') + '|' + completed.join(',');
}

async function loadAgents() {
  try {
    var data = await fetchAPI(apiUrl('/agents/active'));
    var grid = document.getElementById('agents-grid');
    var slotsInfo = document.getElementById('slots-info');
    slotsInfo.textContent = data.slots_available + '/' + data.max_concurrent + ' slots';

    _runningIssues = new Set(data.agents.map(function(a) { return String(a.issue_number); }));
    if (!_cardMenuOpen) renderTaskCards();

    var fp = agentFingerprint(data);
    if (fp === lastAgentFingerprint) {
      data.agents.forEach(function(agent) {
        var el = document.getElementById('agent-card-' + agent.run_id);
        if (el) {
          var elapsedEl = el.querySelector('[data-field="elapsed"]');
          if (elapsedEl) elapsedEl.textContent = formatElapsed(agent.elapsed_seconds);
        }
      });
      return;
    }
    lastAgentFingerprint = fp;

    if (data.agents.length === 0 && data.completed.length === 0) {
      grid.innerHTML = '<div class="col-span-2 text-gray-500 text-sm py-8 text-center">No agents running</div>';
      updateLogTabs([]);
      checkStandaloneHandoff();
      return;
    }
    hideHandoffPanel();

    var cards = [];

    // Running agents
    data.agents.forEach(function(agent) {
      cards.push(renderAgentCard(agent));
    });

    // Recently completed
    data.completed.forEach(function(agent) {
      cards.push(renderCompletedCard(agent));
    });

    grid.innerHTML = cards.join('');
    updateLogTabs(data.agents);
    checkHandoffForAgents(data.agents);
  } catch (e) {
    console.error('Failed to load agents:', e);
  }
}

function renderAgentCard(agent) {
  var colors = roleColor(agent.role);
  var pipeline = renderStepPipeline(agent.current_step, agent.role, false);
  var cost = agent.cost_usd ? '$' + agent.cost_usd.toFixed(4) : '$0.00';
  var elapsed = formatElapsed(agent.elapsed_seconds);
  var prefix = window.SOVA_PROJECT_SLUG ? '/p/' + window.SOVA_PROJECT_SLUG : '';
  var detailUrl = prefix + '/work/' + agent.run_id;

  var prBadge = agent.pr_number ? '<span class="text-xs">' + prLink(agent.pr_number) + '</span>' : '';

  return '<div id="agent-card-' + agent.run_id + '" class="bg-surface-card rounded-lg border ' + colors.border + ' p-4 transition-all">' +
    '<div class="flex items-center justify-between mb-3 cursor-pointer hover:opacity-80" onclick="window.location=\'' + detailUrl + '\'">' +
      '<div class="flex items-center gap-2">' +
        '<span class="w-2 h-2 rounded-full ' + colors.dot + ' animate-pulse"></span>' +
        '<span class="text-sm font-medium">' + issueLink(agent.issue) + '</span>' +
        '<span class="px-1.5 py-0.5 rounded text-xs font-medium ' + colors.bg + ' ' + colors.text + '">' + escapeHtml(formatRole(agent.role, agent.pipeline_variant)) + '</span>' +
        (agent.source === 'external' ? '<span class="px-1.5 py-0.5 rounded text-xs font-medium bg-gray-700 text-gray-300">CLI</span>' : '') +
        prBadge +
      '</div>' +
      '<div class="flex items-center gap-3 text-xs">' +
        '<span class="text-accent-green">' + cost + '</span>' +
        '<span class="text-gray-500" data-field="elapsed">' + elapsed + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="mb-3">' + pipeline + '</div>' +
    '<div id="handoff-inline-' + agent.run_id + '"></div>' +
    '<div class="flex items-center gap-2 mt-3">' +
      '<button onclick="event.stopPropagation(); viewLogs(' + agent.run_id + ')" class="px-3 py-1.5 rounded text-xs bg-surface-hover text-gray-300 hover:text-white transition-colors" data-tooltip="View agent output">' +
        (activeLogRunId === agent.run_id ? 'Viewing Logs' : 'View Logs') +
      '</button>' +
      (agent.source !== 'external'
        ? '<button onclick="event.stopPropagation(); stopAgent(' + agent.run_id + ')" class="px-3 py-1.5 rounded text-xs bg-accent-red/10 text-accent-red hover:bg-accent-red/20 transition-colors" data-tooltip="Stop this agent">Stop</button>'
        : '') +
    '</div>' +
  '</div>';
}

function renderCompletedCard(agent) {
  var colors = roleColor(agent.role);
  var borderColor = agent.status === 'done' ? 'border-accent-green/40' : 'border-accent-red/40';
  var statusDotClass = agent.status === 'done' ? 'bg-accent-green' : 'bg-accent-red';
  var cost = agent.cost_usd ? '$' + agent.cost_usd.toFixed(4) : '$0.00';
  var agoText = agent.completed_seconds_ago + 's ago';
  var prefix = window.SOVA_PROJECT_SLUG ? '/p/' + window.SOVA_PROJECT_SLUG : '';
  var detailUrl = prefix + '/work/' + agent.run_id;

  var prBadge = agent.pr_number ? '<span class="text-xs">' + prLink(agent.pr_number) + '</span>' : '';

  var rerunBtn = '<button onclick="event.stopPropagation(); rerunAgent(\'' + escapeHtml(agent.issue) + '\', \'' + escapeHtml(agent.role) + '\', ' + (agent.pr_number || 'null') + ')" ' +
    'class="px-3 py-1.5 rounded text-xs bg-accent-yellow/10 text-accent-yellow hover:bg-accent-yellow/20 transition-colors" data-tooltip="Re-run this task">Re-run</button>';

  return '<div class="bg-surface-card rounded-lg border ' + borderColor + ' p-4 opacity-75 transition-all cursor-pointer hover:opacity-90" onclick="window.location=\'' + detailUrl + '\'">' +
    '<div class="flex items-center justify-between">' +
      '<div class="flex items-center gap-2">' +
        '<span class="w-2 h-2 rounded-full ' + statusDotClass + '"></span>' +
        '<span class="text-sm font-medium">' + issueLink(agent.issue) + '</span>' +
        '<span class="px-1.5 py-0.5 rounded text-xs font-medium ' + colors.bg + ' ' + colors.text + '">' + escapeHtml(formatRole(agent.role)) + '</span>' +
        '<span class="text-xs ' + (agent.status === 'done' ? 'text-accent-green' : 'text-accent-red') + '">' + escapeHtml(agent.status) + '</span>' +
        prBadge +
      '</div>' +
      '<div class="flex items-center gap-3 text-xs">' +
        rerunBtn +
        '<span class="text-accent-green">' + cost + '</span>' +
        '<span class="text-gray-500">' + agoText + '</span>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// -- Log Viewer --

function updateLogTabs(agents) {
  var tabs = document.getElementById('log-tabs');
  if (!tabs) return;

  if (agents.length === 0) {
    if (activeLogRunId !== null) closeLogViewer();
    return;
  }

  tabs.innerHTML = agents.map(function(a) {
    var colors = roleColor(a.role);
    var isActive = activeLogRunId === a.run_id;
    var activeClass = isActive ? 'bg-surface text-white border-b-2 border-accent' : 'text-gray-500 hover:text-gray-300';
    return '<button onclick="viewLogs(' + a.run_id + ')" class="px-4 py-2 text-xs transition-colors whitespace-nowrap ' + activeClass + '">' +
      escapeHtml('#' + a.issue) + ' <span class="' + colors.text + '">' + escapeHtml(formatRole(a.role, a.pipeline_variant)) + '</span>' +
    '</button>';
  }).join('');
}

function viewLogs(runId) {
  var viewer = document.getElementById('log-viewer');
  var content = document.getElementById('log-content');

  if (activeLogRunId === runId) {
    closeLogViewer();
    return;
  }

  activeLogRunId = runId;
  logCursor = 0;
  content.textContent = '';
  viewer.classList.remove('hidden');

  pollLogs();

  if (logPollInterval) clearInterval(logPollInterval);
  logPollInterval = setInterval(pollLogs, 1000);
}

function closeLogViewer() {
  activeLogRunId = null;
  logCursor = 0;
  if (logPollInterval) { clearInterval(logPollInterval); logPollInterval = null; }
  var viewer = document.getElementById('log-viewer');
  if (viewer) viewer.classList.add('hidden');
}

async function pollLogs() {
  if (activeLogRunId === null) return;
  try {
    var data = await fetchAPI(apiUrl('/agents/' + activeLogRunId + '/output?since=' + logCursor));
    if (data.lines && data.lines.length > 0) {
      var content = document.getElementById('log-content');
      data.lines.forEach(function(line) {
        content.textContent += line + '\n';
      });
      logCursor = data.total;
      content.scrollTop = content.scrollHeight;
    }
  } catch (e) {
    // Agent may have completed
  }
}

// -- Agent actions --

function togglePrInput() { /* no-op: PR input removed in card redesign */ }

async function startAgent() {
  var issue = document.getElementById('agent-issue-number').value ||
    document.getElementById('agent-issue').value.replace(/^#/, '').split(/\s/)[0].trim();
  if (!issue) return;
  await _doStartAgent(issue, null, false);
}

async function stopAgent(runId) {
  try {
    await fetch(apiUrl('/agents/' + runId + '/stop'), { method: 'POST' });
    loadAgents();
  } catch (e) {
    alert('Failed to stop agent: ' + e.message);
  }
}

// -- Handoff inline --

async function checkHandoffForAgents(agents) {
  try {
    var res = await fetch(apiUrl('/handoff'));
    if (!res.ok) return;
    var data = await res.json();

    if (!data.has_handoff || !data.handoff || data.handoff.status !== 'awaiting_action') {
      agents.forEach(function(agent) {
        var container = document.getElementById('handoff-inline-' + agent.run_id);
        if (container) container.innerHTML = '';
      });
      return;
    }
    var handoff = data.handoff;

    var targetIssue = handoff.issue || '';

    agents.forEach(function(agent) {
      var container = document.getElementById('handoff-inline-' + agent.run_id);
      if (!container) return;

      if (targetIssue && targetIssue !== agent.issue) {
        container.innerHTML = '';
        return;
      }

      var actions = (handoff.next_actions || []).map(function(action) {
        var btnStyle = action.style === 'approve' ? 'bg-accent-green/20 text-accent-green hover:bg-accent-green/30' :
                       action.style === 'danger' ? 'bg-accent-red/20 text-accent-red hover:bg-accent-red/30' :
                       'bg-accent/20 text-accent hover:bg-accent/30';
        return '<button onclick="executeHandoffAction(\'' + escapeHtml(action.id) + '\')" ' +
          'class="px-3 py-1.5 rounded text-xs transition-colors ' + btnStyle + '" data-tooltip="' + escapeHtml(action.description || '') + '">' +
          escapeHtml(action.label) + '</button>';
      }).join(' ');

      container.innerHTML = '<div class="bg-accent-yellow/5 border border-accent-yellow/20 rounded p-3 mt-2">' +
        '<div class="flex items-center gap-2 mb-2">' +
          '<span class="w-2 h-2 rounded-full bg-accent-yellow animate-pulse"></span>' +
          '<span class="text-xs text-accent-yellow font-medium">Action Required</span>' +
        '</div>' +
        '<p class="text-xs text-gray-300 mb-2">' + escapeHtml(handoff.summary || '') + '</p>' +
        '<div class="flex gap-2">' + actions + '</div>' +
      '</div>';
    });
  } catch (e) { /* ignore */ }
}

async function executeHandoffAction(actionId) {
  hideHandoffPanel();
  document.querySelectorAll('[id^="handoff-inline-"]').forEach(function(el) {
    el.innerHTML = '';
  });
  lastAgentFingerprint = null;

  try {
    var res = await fetch(apiUrl('/handoff/execute'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action_id: actionId }),
    });
    if (!res.ok) {
      showToast(await getErrorDetail(res, 'Failed to execute action'), 'error');
      loadAgents();
      return;
    }
    var result = await res.json();
    if (result.run_id) viewLogs(result.run_id);
    loadAgents();
    loadTaskCards();
  } catch (e) {
    showToast('Failed to execute action: ' + e.message, 'error');
    loadAgents();
  }
}

// -- Standalone handoff panel (shown when no agents running) --

async function checkStandaloneHandoff() {
  try {
    var res = await fetch(apiUrl('/handoff'));
    if (!res.ok) { hideHandoffPanel(); return; }
    var data = await res.json();

    if (!data.has_handoff || !data.handoff || data.handoff.status !== 'awaiting_action') {
      hideHandoffPanel();
      return;
    }

    var handoff = data.handoff;
    var panel = document.getElementById('handoff-panel');
    var summary = document.getElementById('handoff-panel-summary');
    var meta = document.getElementById('handoff-panel-meta');
    var actionsDiv = document.getElementById('handoff-panel-actions');

    summary.textContent = handoff.summary || 'Review completed';
    var metaParts = [];
    if (handoff.issue) metaParts.push('Issue ' + issueLink(handoff.issue));
    if (handoff.pr_number) metaParts.push('PR ' + prLink(handoff.pr_number));
    if (handoff.details && handoff.details.cost_usd) metaParts.push('Cost: $' + parseFloat(handoff.details.cost_usd).toFixed(4));
    meta.innerHTML = metaParts.join('&nbsp; | &nbsp;');

    var actions = (handoff.next_actions || []).map(function(action) {
      var btnStyle = action.style === 'approve'
        ? 'bg-accent-green/20 text-accent-green hover:bg-accent-green/30 border border-accent-green/30'
        : action.style === 'danger'
        ? 'bg-accent-red/20 text-accent-red hover:bg-accent-red/30 border border-accent-red/30'
        : 'bg-accent/20 text-accent hover:bg-accent/30 border border-accent/30';
      return '<button onclick="executeHandoffAction(\'' + escapeHtml(action.id) + '\')" ' +
        'class="px-4 py-2 rounded text-sm font-medium transition-colors ' + btnStyle + '" ' +
        'title="' + escapeHtml(action.description || '') + '">' +
        escapeHtml(action.label) + '</button>';
    }).join(' ');

    var specLink = '';
    if (handoff.issue) {
      var prefix = window.SOVA_PROJECT_SLUG ? '/p/' + window.SOVA_PROJECT_SLUG : '';
      specLink = '<a href="' + prefix + '/spec/' + escapeHtml(handoff.issue) + '" ' +
        'class="px-4 py-2 rounded text-sm font-medium transition-colors bg-gray-700 text-gray-300 hover:bg-gray-600 border border-gray-600">' +
        'View Spec</a>';
    }

    actionsDiv.innerHTML = actions + specLink;
    panel.classList.remove('hidden');
  } catch (e) {
    hideHandoffPanel();
  }
}

function hideHandoffPanel() {
  document.getElementById('handoff-panel').classList.add('hidden');
}

async function dismissHandoff() {
  try {
    await fetch(apiUrl('/handoff/clear'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
    });
  } catch (e) { /* ignore */ }
  hideHandoffPanel();
}

// -- Interrupted runs --

async function checkInterrupted() {
  try {
    var data = await fetchAPI(apiUrl('/agents/interrupted'));
    var banner = document.getElementById('interrupted-banner');
    if (!data.interrupted || data.interrupted.length === 0) {
      banner.classList.add('hidden');
      return;
    }

    banner.classList.remove('hidden');
    banner.innerHTML = '<div class="bg-accent-yellow/10 border border-accent-yellow/30 rounded-lg p-4">' +
      '<div class="flex items-center justify-between mb-2">' +
        '<div class="flex items-center gap-2">' +
          '<span class="text-sm font-medium text-accent-yellow">Interrupted Runs</span>' +
          '<span class="text-xs text-gray-500">Dashboard was restarted while these were running</span>' +
        '</div>' +
        '<button onclick="dismissInterrupted()" class="px-2 py-1 rounded text-xs text-gray-500 hover:text-gray-300 hover:bg-surface-hover transition-colors" data-tooltip="Clear interrupted run alerts">Dismiss all</button>' +
      '</div>' +
      '<div class="flex flex-wrap gap-2">' +
      data.interrupted.map(function(r) {
        return '<button onclick="restartInterrupted(\'' + escapeHtml(r.issue_number) + '\', \'' + escapeHtml(formatRole(r.role)) + '\')" ' +
          'class="px-3 py-1.5 rounded text-xs bg-accent-yellow/20 text-accent-yellow hover:bg-accent-yellow/30 transition-colors">' +
          '#' + escapeHtml(r.issue_number) + ' ' + escapeHtml(formatRole(r.role)) +
        '</button>';
      }).join('') +
      '</div>' +
    '</div>';
  } catch (e) { /* ignore */ }
}

async function dismissInterrupted() {
  try {
    await fetch(apiUrl('/agents/interrupted/dismiss'), { method: 'POST' });
    document.getElementById('interrupted-banner').classList.add('hidden');
  } catch (e) { /* ignore */ }
}

function restartInterrupted(issue, role) {
  _doStartAgent(issue, role === 'auto' ? null : role, false);
}

function rerunAgent(issue, role, prNumber) {
  _doStartAgent(issue, role === 'auto' ? null : role, false);
}

// -- History / Failed tabs --

function switchTab(tab) {
  ['history', 'failed'].forEach(function(t) {
    var panel = document.getElementById('panel-' + t);
    var tabBtn = document.getElementById('tab-' + t);
    if (t === tab) {
      panel.classList.remove('hidden');
      tabBtn.className = 'px-4 py-2.5 text-sm transition-colors border-b-2 border-accent text-white';
    } else {
      panel.classList.add('hidden');
      tabBtn.className = 'px-4 py-2.5 text-sm transition-colors border-b-2 border-transparent text-gray-500 hover:text-gray-300';
    }
  });

  if (tab === 'history') loadHistory();
  if (tab === 'failed') loadFailed();
}

var _PAGE_SIZE = 15;
var historyPage = 0;
var historyTotal = 0;
var failedPage = 0;
var failedTotal = 0;

async function loadHistory() {
  try {
    var role = document.getElementById('filter-role').value;
    var offset = historyPage * _PAGE_SIZE;
    var url = '/work/history?limit=' + _PAGE_SIZE + '&offset=' + offset;
    if (role) url += '&role=' + role;

    var data = await fetchAPI(apiUrl(url));
    historyTotal = data.total || 0;
    renderHistoryTable(data.tasks, 'history-table');
    _updatePager('history', historyPage, historyTotal, _PAGE_SIZE);
  } catch (e) {
    console.error('Failed to load history:', e);
  }
}

function historyPrev() { if (historyPage > 0) { historyPage--; loadHistory(); } }
function historyNext() { if ((historyPage + 1) * _PAGE_SIZE < historyTotal) { historyPage++; loadHistory(); } }

async function loadFailed() {
  try {
    var offset = failedPage * _PAGE_SIZE;
    var data = await fetchAPI(apiUrl('/work/history?status=failed&limit=' + _PAGE_SIZE + '&offset=' + offset));
    failedTotal = data.total || 0;
    var countEl = document.getElementById('tab-failed-count');
    countEl.textContent = failedTotal > 0 ? '(' + failedTotal + ')' : '';
    renderHistoryTable(data.tasks, 'failed-table', true);
    _updatePager('failed', failedPage, failedTotal, _PAGE_SIZE);
  } catch (e) {
    console.error('Failed to load failed:', e);
  }
}

function failedPrev() { if (failedPage > 0) { failedPage--; loadFailed(); } }
function failedNext() { if ((failedPage + 1) * _PAGE_SIZE < failedTotal) { failedPage++; loadFailed(); } }

function _updatePager(prefix, page, total, pageSize) {
  var pager = document.getElementById(prefix + '-pager');
  if (total <= pageSize) { pager.classList.add('hidden'); return; }
  pager.classList.remove('hidden');
  var totalPages = Math.ceil(total / pageSize);
  document.getElementById(prefix + '-page-info').textContent = 'Page ' + (page + 1) + ' of ' + totalPages;
  document.getElementById(prefix + '-prev').disabled = page === 0;
  document.getElementById(prefix + '-next').disabled = page + 1 >= totalPages;
}

function renderHistoryTable(tasks, targetId, showError) {
  var el = document.getElementById(targetId);
  if (tasks.length === 0) {
    el.innerHTML = '<div class="bg-surface-card rounded-lg border border-gray-700/50 p-8 text-center">' +
      '<p class="text-gray-500">No runs found</p></div>';
    return;
  }

  var prefix = window.SOVA_PROJECT_SLUG ? '/p/' + window.SOVA_PROJECT_SLUG : '';

  el.innerHTML = '<div class="bg-surface-card rounded-lg border border-gray-700/50 overflow-hidden">' +
    '<table class="w-full text-sm">' +
    '<thead><tr class="text-gray-500 text-xs uppercase border-b border-gray-700/50">' +
      '<th class="text-left p-3">Issue</th>' +
      '<th class="text-left p-3">Role</th>' +
      '<th class="text-left p-3">Status</th>' +
      '<th class="text-left p-3">Steps</th>' +
      '<th class="text-right p-3">Cost</th>' +
      '<th class="text-left p-3">Duration</th>' +
      '<th class="text-left p-3">PR</th>' +
      '<th class="text-left p-3">Date</th>' +
    '</tr></thead><tbody>' +
    tasks.map(function(t) {
      var colors = roleColor(t.role);
      var stepsText = t.total_steps_possible ? (t.steps_completed + '/' + t.total_steps_possible) : '--';

      return '<tr class="border-t border-gray-700/30 hover:bg-surface-hover cursor-pointer" onclick="window.location=\'' + prefix + '/work/' + t.id + '\'">' +
        '<td class="p-3">' + issueLink(t.issue_number) + '</td>' +
        '<td class="p-3"><span class="px-1.5 py-0.5 rounded text-xs ' + colors.bg + ' ' + colors.text + '">' + escapeHtml(formatRole(t.role, t.pipeline_variant)) + '</span></td>' +
        '<td class="p-3"><span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full ' + statusDot(t.status) + '"></span><span class="' + statusColor(t.status) + '">' + escapeHtml(t.status) + '</span></span></td>' +
        '<td class="p-3 text-gray-400">' + stepsText + '</td>' +
        '<td class="p-3 text-right text-accent-green">$' + t.total_cost_usd.toFixed(4) + '</td>' +
        '<td class="p-3 text-gray-400">' + (t.duration_formatted || '--') + '</td>' +
        '<td class="p-3 text-gray-400">' + prLink(t.pr_number) + '</td>' +
        '<td class="p-3 text-gray-500 text-xs">' + (t.ended_at ? new Date(t.ended_at).toLocaleDateString() : '--') + '</td>' +
      '</tr>' +
      (showError && t.error_message ? '<tr class="border-t border-gray-700/10"><td colspan="8" class="px-3 pb-3 pt-1 text-xs text-accent-red">' + escapeHtml(t.error_message) + '</td></tr>' : '');
    }).join('') +
    '</tbody></table></div>';
}

// -- PR Tracker --

window._prTrackerData = [];
var _prTrackerCollapsed = localStorage.getItem('sova-pr-tracker-collapsed') === 'true';

function togglePrTracker() {
  _prTrackerCollapsed = !_prTrackerCollapsed;
  localStorage.setItem('sova-pr-tracker-collapsed', _prTrackerCollapsed);
  var list = document.getElementById('pr-tracker-list');
  var chevron = document.getElementById('pr-tracker-chevron');
  var toggle = document.getElementById('pr-tracker-toggle');
  list.classList.toggle('hidden', _prTrackerCollapsed);
  chevron.style.transform = _prTrackerCollapsed ? 'rotate(-90deg)' : '';
  if (toggle) toggle.setAttribute('aria-expanded', (!_prTrackerCollapsed).toString());
}

var _prStateColors = {
  draft: 'bg-gray-600/30 text-gray-400',
  ci_running: 'bg-accent-yellow/20 text-accent-yellow',
  ci_failed: 'bg-accent-red/20 text-accent-red',
  changes_requested: 'bg-accent-peach/20 text-accent-peach',
  approved_ci_green: 'bg-accent-green/30 text-accent-green',
  approved: 'bg-accent-green/20 text-accent-green',
  awaiting_review: 'bg-accent-blue/20 text-accent-blue',
};

var _prActions = {
  awaiting_review: { text: 'Review', command: 'review-pr', cls: 'bg-accent-green/20 text-accent-green hover:bg-accent-green/30' },
  changes_requested: { text: 'Address PR', command: 'address-pr', cls: 'bg-accent-peach/20 text-accent-peach hover:bg-accent-peach/30' },
  approved: { text: 'Integrate', command: 'integrate-pr', cls: 'bg-accent/20 text-accent hover:bg-accent/30' },
  approved_ci_green: { text: 'Ship PR', command: 'ship-pr', cls: 'bg-accent-green/20 text-accent-green hover:bg-accent-green/30' },
  ci_failed: { text: 'Address PR', command: 'address-pr', cls: 'bg-accent-red/20 text-accent-red hover:bg-accent-red/30' },
};

function formatAge(seconds) {
  if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
  if (seconds < 86400) return Math.floor(seconds / 3600) + 'h';
  return Math.floor(seconds / 86400) + 'd';
}

function renderPrRow(pr) {
  var stateClass = _prStateColors[pr.computed_state] || 'bg-gray-600/30 text-gray-400';
  var action = _prActions[pr.computed_state];
  var actionBtn = '';
  var prNumber = Number(pr.number);
  var hasValidPrNumber = Number.isFinite(prNumber);
  if (action && hasValidPrNumber) {
    actionBtn = '<button onclick="runCommand(\'' + action.command + '\', {pr: ' + prNumber + '})" ' +
      'class="text-xs px-2.5 py-1 rounded transition-colors whitespace-nowrap ' + action.cls + '">' +
      action.text + '</button>';
  }

  var issueRef = pr.linked_issue
    ? '<span class="text-xs text-gray-500">#' + escapeHtml(String(pr.linked_issue)) + '</span>'
    : '';

  var ciDot = '';
  if (pr.ci_status === 'passed') ciDot = '<span class="w-1.5 h-1.5 rounded-full bg-accent-green shrink-0" data-tooltip="CI passed"></span>';
  else if (pr.ci_status === 'failed') ciDot = '<span class="w-1.5 h-1.5 rounded-full bg-accent-red shrink-0" data-tooltip="CI failed"></span>';
  else if (pr.ci_status === 'pending') ciDot = '<span class="w-1.5 h-1.5 rounded-full bg-accent-yellow animate-pulse shrink-0" data-tooltip="CI running"></span>';

  return '<div class="flex items-center gap-3 px-4 py-2.5 hover:bg-surface-hover transition-colors">' +
    '<a href="' + (pr.url && pr.url.startsWith('https://') ? escapeHtml(pr.url) : '#') + '" target="_blank" rel="noopener" class="text-xs font-medium text-accent hover:underline shrink-0">#' + escapeHtml(String(pr.number)) + '</a>' +
    '<span class="text-sm text-gray-300 truncate flex-1">' + escapeHtml(pr.title) + '</span>' +
    issueRef +
    ciDot +
    '<span class="px-1.5 py-0.5 rounded text-xs ' + stateClass + '">' + escapeHtml(pr.state_label) + '</span>' +
    '<span class="text-xs text-gray-600 w-8 text-right shrink-0">' + formatAge(pr.age_seconds) + '</span>' +
    '<div class="w-24 flex justify-end shrink-0">' + actionBtn + '</div>' +
  '</div>';
}

async function loadPrTracker() {
  try {
    var res = await fetch(apiUrl('/prs/open'));
    if (!res.ok) return;
    var data = await res.json();
    window._prTrackerData = data.prs || [];
    var list = document.getElementById('pr-tracker-list');
    var count = document.getElementById('pr-tracker-count');
    count.textContent = window._prTrackerData.length ? '(' + window._prTrackerData.length + ')' : '';
    if (!window._prTrackerData.length) {
      list.innerHTML = '<p class="text-gray-500 text-sm py-4 text-center">No open PRs</p>';
    } else {
      list.innerHTML = window._prTrackerData.map(renderPrRow).join('');
    }
  } catch (e) {
    // silent
  }
}

function getPrForIssue(issueNumber) {
  if (!issueNumber || !window._prTrackerData) return null;
  var num = parseInt(issueNumber, 10);
  for (var i = 0; i < window._prTrackerData.length; i++) {
    if (window._prTrackerData[i].linked_issue === num) return window._prTrackerData[i];
  }
  return null;
}

// -- Init --
if (_prTrackerCollapsed) {
  document.getElementById('pr-tracker-list').classList.add('hidden');
  document.getElementById('pr-tracker-chevron').style.transform = 'rotate(-90deg)';
}
loadTaskCards();
loadAgents();
loadPrTracker();
checkInterrupted();
loadHistory();
agentPollInterval = setInterval(loadAgents, 2000);
setInterval(loadPrTracker, 30000);
</script>
{% endblock %}
