{% extends "base.html" %}
{% block title %}Agents - SOVA{% endblock %}
{% block content %}
<h2 class="text-2xl font-semibold mb-6">Agents</h2>

<!-- Start Panel -->
<div class="bg-surface-card rounded-lg border border-gray-700/50 p-4 mb-6">
  <div class="flex items-center gap-3">
    <input type="text" id="agent-issue" placeholder="Issue number (e.g. 42)"
      class="bg-surface border border-gray-700 rounded px-3 py-2 text-sm text-gray-200 w-48 focus:border-accent focus:outline-none">
    <select id="agent-role" class="bg-surface border border-gray-700 rounded px-3 py-2 text-sm text-gray-200 focus:border-accent focus:outline-none">
      <option value="">Auto (dispatcher)</option>
      <option value="developer">Developer</option>
      <option value="triage">Triage</option>
      <option value="researcher">Researcher</option>
      <option value="reviewer">Reviewer</option>
    </select>
    <label class="flex items-center gap-1.5 text-sm text-gray-400 cursor-pointer select-none">
      <input type="checkbox" id="agent-force" class="rounded border-gray-600 bg-surface text-accent focus:ring-accent/50">
      <span>--force</span>
    </label>
    <button onclick="startAgent()" id="start-btn"
      class="px-4 py-2 rounded text-sm bg-accent/20 text-accent hover:bg-accent/30 transition-colors disabled:opacity-30 disabled:cursor-not-allowed">
      Start
    </button>
    <div class="flex-1"></div>
    <span id="slots-info" class="text-xs text-gray-500"></span>
  </div>
</div>

<!-- Running Agents Grid -->
<div id="agents-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
  <div class="text-gray-500 text-sm">No agents running</div>
</div>

<!-- Interrupted Runs Banner -->
<div id="interrupted-banner" class="hidden mb-6"></div>

<!-- Log Viewer -->
<div id="log-viewer" class="hidden bg-surface-card rounded-lg border border-gray-700/50 overflow-hidden">
  <div class="flex items-center border-b border-gray-700/50">
    <div id="log-tabs" class="flex flex-1 overflow-x-auto"></div>
    <button onclick="closeLogViewer()" class="px-3 py-2 text-gray-500 hover:text-gray-300 text-xs transition-colors">Close</button>
  </div>
  <div id="log-content" class="p-4 font-mono text-xs text-gray-300 max-h-[500px] overflow-y-auto whitespace-pre-wrap"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
var activeLogRunId = null;
var logCursor = 0;
var agentPollInterval = null;
var logPollInterval = null;

async function loadAgents() {
  try {
    var data = await fetchAPI(apiUrl('/agents/active'));
    var grid = document.getElementById('agents-grid');
    var slotsInfo = document.getElementById('slots-info');
    var startBtn = document.getElementById('start-btn');

    slotsInfo.textContent = data.slots_available + '/' + data.max_concurrent + ' slots available';
    startBtn.disabled = data.slots_available <= 0;

    if (data.agents.length === 0 && data.completed.length === 0) {
      grid.innerHTML = '<div class="col-span-2 text-gray-500 text-sm py-8 text-center">No agents running</div>';
      updateLogTabs([]);
      return;
    }

    var cards = [];

    // Running agents
    data.agents.forEach(function(agent) {
      cards.push(renderAgentCard(agent, false));
    });

    // Recently completed
    data.completed.forEach(function(agent) {
      cards.push(renderCompletedCard(agent));
    });

    grid.innerHTML = cards.join('');
    updateLogTabs(data.agents);
    checkHandoffForAgents(data.agents);
  } catch (e) {
    console.error('Failed to load agents:', e);
  }
}

function renderAgentCard(agent, completed) {
  var colors = roleColor(agent.role);
  var pipeline = renderStepPipeline(agent.current_step, agent.role, false);
  var cost = agent.cost_usd ? '$' + agent.cost_usd.toFixed(4) : '$0.00';
  var elapsed = formatElapsed(agent.elapsed_seconds);

  return '<div id="agent-card-' + agent.run_id + '" class="bg-surface-card rounded-lg border ' + colors.border + ' p-4 transition-all">' +
    '<div class="flex items-center justify-between mb-3">' +
      '<div class="flex items-center gap-2">' +
        '<span class="w-2 h-2 rounded-full ' + colors.dot + ' animate-pulse"></span>' +
        '<span class="text-sm font-medium text-gray-200">#' + escapeHtml(agent.issue) + '</span>' +
        '<span class="px-1.5 py-0.5 rounded text-xs font-medium ' + colors.bg + ' ' + colors.text + '">' + escapeHtml(agent.role) + '</span>' +
      '</div>' +
      '<div class="flex items-center gap-3 text-xs">' +
        '<span class="text-accent-green">' + cost + '</span>' +
        '<span class="text-gray-500">' + elapsed + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="mb-3">' + pipeline + '</div>' +
    '<div id="handoff-inline-' + agent.run_id + '"></div>' +
    '<div class="flex items-center gap-2 mt-3">' +
      '<button onclick="viewLogs(' + agent.run_id + ')" class="px-3 py-1.5 rounded text-xs bg-surface-hover text-gray-300 hover:text-white transition-colors">' +
        (activeLogRunId === agent.run_id ? 'Viewing Logs' : 'View Logs') +
      '</button>' +
      '<button onclick="stopAgent(' + agent.run_id + ')" class="px-3 py-1.5 rounded text-xs bg-accent-red/10 text-accent-red hover:bg-accent-red/20 transition-colors">Stop</button>' +
    '</div>' +
  '</div>';
}

function renderCompletedCard(agent) {
  var colors = roleColor(agent.role);
  var borderColor = agent.status === 'done' ? 'border-accent-green/40' : 'border-accent-red/40';
  var statusDotClass = agent.status === 'done' ? 'bg-accent-green' : 'bg-accent-red';
  var cost = agent.cost_usd ? '$' + agent.cost_usd.toFixed(4) : '$0.00';
  var agoText = agent.completed_seconds_ago + 's ago';

  return '<div class="bg-surface-card rounded-lg border ' + borderColor + ' p-4 opacity-75 transition-all">' +
    '<div class="flex items-center justify-between">' +
      '<div class="flex items-center gap-2">' +
        '<span class="w-2 h-2 rounded-full ' + statusDotClass + '"></span>' +
        '<span class="text-sm font-medium text-gray-300">#' + escapeHtml(agent.issue) + '</span>' +
        '<span class="px-1.5 py-0.5 rounded text-xs font-medium ' + colors.bg + ' ' + colors.text + '">' + escapeHtml(agent.role) + '</span>' +
        '<span class="text-xs ' + (agent.status === 'done' ? 'text-accent-green' : 'text-accent-red') + '">' + agent.status + '</span>' +
      '</div>' +
      '<div class="flex items-center gap-3 text-xs">' +
        '<span class="text-accent-green">' + cost + '</span>' +
        '<span class="text-gray-500">' + agoText + '</span>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// -- Log Viewer --

function updateLogTabs(agents) {
  var tabs = document.getElementById('log-tabs');
  if (!tabs) return;

  if (agents.length === 0) {
    if (activeLogRunId !== null) closeLogViewer();
    return;
  }

  tabs.innerHTML = agents.map(function(a) {
    var colors = roleColor(a.role);
    var isActive = activeLogRunId === a.run_id;
    var activeClass = isActive ? 'bg-surface text-white border-b-2 border-accent' : 'text-gray-500 hover:text-gray-300';
    return '<button onclick="viewLogs(' + a.run_id + ')" class="px-4 py-2 text-xs transition-colors whitespace-nowrap ' + activeClass + '">' +
      '#' + escapeHtml(a.issue) + ' <span class="' + colors.text + '">' + escapeHtml(a.role) + '</span>' +
    '</button>';
  }).join('');
}

function viewLogs(runId) {
  var viewer = document.getElementById('log-viewer');
  var content = document.getElementById('log-content');

  if (activeLogRunId === runId) {
    closeLogViewer();
    return;
  }

  activeLogRunId = runId;
  logCursor = 0;
  content.textContent = '';
  viewer.classList.remove('hidden');

  pollLogs();

  if (logPollInterval) clearInterval(logPollInterval);
  logPollInterval = setInterval(pollLogs, 1000);
}

function closeLogViewer() {
  activeLogRunId = null;
  logCursor = 0;
  if (logPollInterval) { clearInterval(logPollInterval); logPollInterval = null; }
  var viewer = document.getElementById('log-viewer');
  if (viewer) viewer.classList.add('hidden');
}

async function pollLogs() {
  if (activeLogRunId === null) return;
  try {
    var data = await fetchAPI(apiUrl('/agents/' + activeLogRunId + '/output?since=' + logCursor));
    if (data.lines && data.lines.length > 0) {
      var content = document.getElementById('log-content');
      data.lines.forEach(function(line) {
        content.textContent += line + '\n';
      });
      logCursor = data.total;
      content.scrollTop = content.scrollHeight;
    }
  } catch (e) {
    // Agent may have completed
  }
}

// -- Agent actions --

async function startAgent() {
  var issueEl = document.getElementById('agent-issue');
  var roleEl = document.getElementById('agent-role');
  var forceEl = document.getElementById('agent-force');
  var issue = issueEl.value.trim();
  if (!issue) { issueEl.focus(); return; }

  var btn = document.getElementById('start-btn');
  btn.disabled = true;
  btn.textContent = 'Starting...';

  try {
    var result = await fetch(apiUrl('/agents/start'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        issue: issue,
        role: roleEl.value || null,
        force: forceEl.checked,
      }),
    }).then(function(r) { return r.json(); });

    if (result.error) {
      alert(result.error);
    } else {
      issueEl.value = '';
      forceEl.checked = false;
      if (result.run_id) viewLogs(result.run_id);
    }
  } catch (e) {
    alert('Failed to start agent: ' + e.message);
  }

  btn.disabled = false;
  btn.textContent = 'Start';
  loadAgents();
}

async function stopAgent(runId) {
  try {
    await fetch(apiUrl('/agents/' + runId + '/stop'), { method: 'POST' });
    loadAgents();
  } catch (e) {
    alert('Failed to stop agent: ' + e.message);
  }
}

// -- Handoff inline --

async function checkHandoffForAgents(agents) {
  try {
    var res = await fetch(apiUrl('/handoff'));
    if (!res.ok) return;
    var data = await res.json();

    if (!data.has_handoff || !data.handoff) return;
    var handoff = data.handoff;
    if (handoff.status !== 'awaiting_action') return;

    var targetIssue = handoff.issue || '';

    agents.forEach(function(agent) {
      var container = document.getElementById('handoff-inline-' + agent.run_id);
      if (!container) return;

      if (targetIssue && targetIssue !== agent.issue) {
        container.innerHTML = '';
        return;
      }

      var actions = (handoff.next_actions || []).map(function(action) {
        var btnStyle = action.style === 'approve' ? 'bg-accent-green/20 text-accent-green hover:bg-accent-green/30' :
                       action.style === 'danger' ? 'bg-accent-red/20 text-accent-red hover:bg-accent-red/30' :
                       'bg-accent/20 text-accent hover:bg-accent/30';
        return '<button onclick="executeHandoffAction(\'' + escapeHtml(action.id) + '\')" ' +
          'class="px-3 py-1.5 rounded text-xs transition-colors ' + btnStyle + '" title="' + escapeHtml(action.description || '') + '">' +
          escapeHtml(action.label) + '</button>';
      }).join(' ');

      container.innerHTML = '<div class="bg-accent-yellow/5 border border-accent-yellow/20 rounded p-3 mt-2">' +
        '<div class="flex items-center gap-2 mb-2">' +
          '<span class="w-2 h-2 rounded-full bg-accent-yellow animate-pulse"></span>' +
          '<span class="text-xs text-accent-yellow font-medium">Action Required</span>' +
        '</div>' +
        '<p class="text-xs text-gray-300 mb-2">' + escapeHtml(handoff.summary || '') + '</p>' +
        '<div class="flex gap-2">' + actions + '</div>' +
      '</div>';
    });
  } catch (e) { /* ignore */ }
}

async function executeHandoffAction(actionId) {
  try {
    await fetch(apiUrl('/handoff/execute'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action_id: actionId }),
    });
    loadAgents();
  } catch (e) {
    alert('Failed to execute action: ' + e.message);
  }
}

// -- Interrupted runs --

async function checkInterrupted() {
  try {
    var data = await fetchAPI(apiUrl('/agents/interrupted'));
    var banner = document.getElementById('interrupted-banner');
    if (!data.interrupted || data.interrupted.length === 0) {
      banner.classList.add('hidden');
      return;
    }

    banner.classList.remove('hidden');
    banner.innerHTML = '<div class="bg-accent-yellow/10 border border-accent-yellow/30 rounded-lg p-4">' +
      '<div class="flex items-center gap-2 mb-2">' +
        '<span class="text-sm font-medium text-accent-yellow">Interrupted Runs</span>' +
        '<span class="text-xs text-gray-500">Dashboard was restarted while these were running</span>' +
      '</div>' +
      '<div class="flex flex-wrap gap-2">' +
      data.interrupted.map(function(r) {
        return '<button onclick="restartInterrupted(\'' + escapeHtml(r.issue_number) + '\', \'' + escapeHtml(r.role) + '\')" ' +
          'class="px-3 py-1.5 rounded text-xs bg-accent-yellow/20 text-accent-yellow hover:bg-accent-yellow/30 transition-colors">' +
          '#' + escapeHtml(r.issue_number) + ' ' + escapeHtml(r.role) +
        '</button>';
      }).join('') +
      '</div>' +
    '</div>';
  } catch (e) { /* ignore */ }
}

function restartInterrupted(issue, role) {
  document.getElementById('agent-issue').value = issue;
  document.getElementById('agent-role').value = role === 'auto' ? '' : role;
  startAgent();
}

// -- Init --
loadAgents();
checkInterrupted();
agentPollInterval = setInterval(loadAgents, 2000);
</script>
{% endblock %}
