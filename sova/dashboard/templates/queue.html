{% extends "base.html" %}
{% block title %}Queue - SOVA{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
  <h2 class="text-2xl font-semibold">Priority Queue</h2>
  <label class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer select-none" id="select-all-wrapper" style="display:none">
    <input type="checkbox" id="select-all" onchange="toggleSelectAll()" class="rounded border-gray-600 bg-surface text-accent focus:ring-accent/50">
    <span>Select all</span>
  </label>
</div>

<!-- Filter bar -->
<div id="filter-bar" class="hidden sticky top-0 z-30 bg-surface/95 backdrop-blur-sm border border-gray-700/50 rounded-lg px-4 py-3 mb-4">
  <div class="flex items-center gap-3 flex-wrap">
    <input type="text" id="filter-search" placeholder="Search issues..."
      oninput="applyFilters()"
      class="bg-surface border border-gray-700/50 rounded px-3 py-1.5 text-sm text-gray-300 placeholder-gray-600 focus:outline-none focus:border-accent/50 w-56">

    <div id="filter-state-wrapper" class="relative">
      <button onclick="toggleDropdown('filter-state-dropdown')"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-medium bg-surface border border-gray-700/50 text-gray-400 hover:text-gray-300 hover:border-gray-600 transition-colors">
        State <span id="filter-state-count" class="text-accent"></span>
        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div id="filter-state-dropdown" class="hidden absolute top-full left-0 mt-1 bg-surface-card border border-gray-700/50 rounded-lg shadow-xl py-1 min-w-[160px] z-40 max-h-64 overflow-y-auto"></div>
    </div>

    <div id="filter-milestone-wrapper" class="relative">
      <button onclick="toggleDropdown('filter-milestone-dropdown')"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-medium bg-surface border border-gray-700/50 text-gray-400 hover:text-gray-300 hover:border-gray-600 transition-colors">
        Milestone <span id="filter-milestone-count" class="text-accent"></span>
        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div id="filter-milestone-dropdown" class="hidden absolute top-full left-0 mt-1 bg-surface-card border border-gray-700/50 rounded-lg shadow-xl py-1 min-w-[160px] z-40 max-h-64 overflow-y-auto"></div>
    </div>

    <div id="filter-label-wrapper" class="relative">
      <button onclick="toggleDropdown('filter-label-dropdown')"
        class="flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-medium bg-surface border border-gray-700/50 text-gray-400 hover:text-gray-300 hover:border-gray-600 transition-colors">
        Label <span id="filter-label-count" class="text-accent"></span>
        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div id="filter-label-dropdown" class="hidden absolute top-full left-0 mt-1 bg-surface-card border border-gray-700/50 rounded-lg shadow-xl py-1 min-w-[200px] z-40">
        <div class="px-2 py-1 border-b border-gray-700/30">
          <input type="text" id="label-dropdown-search" placeholder="Filter labels..."
            oninput="filterLabelDropdown()"
            class="w-full bg-surface border border-gray-700/50 rounded px-2 py-1 text-xs text-gray-300 placeholder-gray-600 focus:outline-none focus:border-accent/50">
        </div>
        <div id="label-dropdown-items" class="max-h-48 overflow-y-auto"></div>
      </div>
    </div>

    <button id="filter-clear-btn" onclick="clearAllFilters()" style="display:none"
      class="px-3 py-1.5 rounded text-xs text-gray-500 hover:text-gray-300 hover:bg-gray-700/30 transition-colors">
      Clear filters
    </button>
  </div>
</div>

<div id="queue-content">
  <p class="text-gray-500 text-sm">Loading...</p>
</div>

<!-- Bulk action bar (selection + action buttons only; progress is in the global bar) -->
<div id="bulk-bar" class="hidden fixed sidebar-batch-bar right-0 bg-surface-card border-t border-gray-700/50 px-6 py-3 z-40 transition-all" style="bottom: 0">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span id="bulk-count" class="text-sm text-gray-300 font-medium"></span>
      <div class="w-px h-5 bg-gray-700"></div>
      <button id="bulk-triage-btn" onclick="executeBulkAction('triage')"
        class="px-3 py-1.5 rounded text-xs font-medium bg-accent/20 text-accent hover:bg-accent/30 transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
        disabled data-tooltip="Run triage on selected issues">Triage</button>
      <button id="bulk-harden-btn" onclick="executeBulkAction('harden')"
        class="px-3 py-1.5 rounded text-xs font-medium bg-accent-purple/20 text-accent-purple hover:bg-accent-purple/30 transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
        disabled data-tooltip="Run spec hardening on selected issues">Harden</button>
      <button id="bulk-run-btn" onclick="executeBulkAction('run')"
        class="px-3 py-1.5 rounded text-xs font-medium bg-accent-green/20 text-accent-green hover:bg-accent-green/30 transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
        disabled data-tooltip="Start agents for selected issues">Run</button>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="deselectAll()" class="px-2 py-1 rounded text-xs text-gray-500 hover:text-gray-300 hover:bg-gray-700/30 transition-colors" data-tooltip="Clear selection">
        Deselect
      </button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var milestoneStyles = {
  'Phase 1': { badge: 'bg-accent-red/20 text-accent-red', border: 'border-accent-red/30' },
  'Phase 2': { badge: 'bg-accent-yellow/20 text-accent-yellow', border: 'border-accent-yellow/30' },
  'Phase 3': { badge: 'bg-accent/20 text-accent', border: 'border-accent/30' },
  'Phase 4': { badge: 'bg-accent-purple/20 text-accent-purple', border: 'border-accent-purple/30' },
  'Phase 5': { badge: 'bg-accent-green/20 text-accent-green', border: 'border-accent-green/30' },
  'Phase 6': { badge: 'bg-blue-500/20 text-blue-400', border: 'border-blue-500/30' },
  'Phase 7': { badge: 'bg-gray-500/20 text-gray-400', border: 'border-gray-600/30' },
  P1: { badge: 'bg-accent-red/20 text-accent-red', border: 'border-accent-red/30' },
  P2: { badge: 'bg-accent-yellow/20 text-accent-yellow', border: 'border-accent-yellow/30' },
  P3: { badge: 'bg-accent/20 text-accent', border: 'border-accent/30' },
  P4: { badge: 'bg-accent-purple/20 text-accent-purple', border: 'border-accent-purple/30' },
  P5: { badge: 'bg-accent-green/20 text-accent-green', border: 'border-accent-green/30' },
  P6: { badge: 'bg-blue-500/20 text-blue-400', border: 'border-blue-500/30' },
  P7: { badge: 'bg-gray-500/20 text-gray-400', border: 'border-gray-600/30' },
  '--': { badge: 'bg-gray-700/20 text-gray-500', border: 'border-gray-700/30' },
};

var stateLabels = {
  researched: 'Researched',
  in_progress: 'In Progress',
  triaged: 'Triaged',
  backlog: 'Backlog',
  needs_spec: 'Needs Spec',
  in_review: 'In Review',
  human_only: 'Human Only',
};

var stateColors = {
  backlog: 'bg-gray-600/30 text-gray-400',
  triaged: 'bg-accent-yellow/20 text-accent-yellow',
  researched: 'bg-accent-purple/20 text-accent-purple',
  in_progress: 'bg-accent/20 text-accent',
  in_review: 'bg-accent-green/20 text-accent-green',
  needs_spec: 'bg-accent-yellow/20 text-accent-yellow',
  human_only: 'bg-gray-600/30 text-gray-500',
};

var issueTypeStyles = {
  Bug: 'bg-accent-red/20 text-accent-red',
  Story: 'bg-accent/20 text-accent',
  Task: 'bg-accent-yellow/20 text-accent-yellow',
  Spike: 'bg-accent-purple/20 text-accent-purple',
  Epic: 'bg-accent-purple/20 text-accent-purple',
};

var actionStyles = {
  triage: 'bg-accent-yellow/20 text-accent-yellow',
  research: 'bg-accent-purple/20 text-accent-purple',
  review_spec: 'bg-accent-purple/20 text-accent-purple',
  develop: 'bg-accent/20 text-accent',
  review: 'bg-accent-green/20 text-accent-green',
  resume: 'bg-accent/20 text-accent',
  harden: 'bg-accent-purple/20 text-accent-purple',
};

var actionLabels = {
  review_spec: 'review spec',
};

var stateGroupOrder = ['in_progress', 'in_review', 'researched', 'triaged', 'backlog', 'needs_spec', 'human_only'];
var stateGroupLabels = {
  in_progress: 'In Progress',
  in_review: 'In Review',
  researched: 'Researched (Spec Review)',
  triaged: 'Triaged',
  backlog: 'Backlog / Triage',
  needs_spec: 'Needs Refinement',
  human_only: 'Human Only',
};

var validStates = {
  triage: ['backlog'],
  harden: ['backlog', 'triaged', 'needs_spec'],
  run: ['researched', 'in_progress'],
};

var selectedItems = {};
var queueData = [];
var activeFilters = { search: '', states: [], milestones: [], labels: [] };

function _onGlobalBatchCleared() {
  deselectAll();
  loadQueue();
}

function renderRunStatusBadge(item) {
  if (!item.last_run) return '';
  var run = item.last_run;
  if (run.status === 'running' || run.status === 'developing' || run.status === 'pending') {
    var prefix = window.SOVA_PROJECT_SLUG ? '/p/' + window.SOVA_PROJECT_SLUG : '';
    return '<a href="' + prefix + '/agents" class="flex items-center gap-1 px-2 py-1 rounded text-xs bg-accent-green/15 text-accent-green">' +
      '<span class="w-1.5 h-1.5 rounded-full bg-accent-green animate-pulse"></span>Running</a>';
  }
  if (run.status === 'done') {
    var ago = run.ended_at ? timeAgo(run.ended_at) : '';
    return '<span class="px-2 py-1 rounded text-xs bg-accent-green/10 text-accent-green/70">Done ' + ago + '</span>';
  }
  if (run.status === 'failed') {
    var ago = run.ended_at ? timeAgo(run.ended_at) : '';
    return '<span class="px-2 py-1 rounded text-xs bg-accent-red/10 text-accent-red/70">Failed ' + ago + '</span>';
  }
  if (run.status === 'interrupted') {
    return '<span class="px-2 py-1 rounded text-xs bg-accent-yellow/10 text-accent-yellow/70">Interrupted</span>';
  }
  return '';
}

var _STATE_ROLE_MAP = {
  backlog: 'triage',
  triaged: 'researcher',
  in_progress: 'developer',
  in_review: 'reviewer',
  needs_spec: 'triage',
};

function renderStartButton(item) {
  var isRunning = item.last_run && (item.last_run.status === 'running' || item.last_run.status === 'developing' || item.last_run.status === 'pending');
  if (isRunning) {
    return '<button disabled class="px-3 py-1.5 rounded text-xs bg-gray-700/30 text-gray-600 cursor-not-allowed">Running</button>';
  }

  if (item.state === 'human_only') {
    return '';
  }

  // RESEARCHED: show View Spec for draft specs, Start for approved/missing
  if (item.state === 'researched' && item.spec_status && item.spec_status !== 'approved' && item.spec_status !== 'missing') {
    var prefix = window.SOVA_PROJECT_SLUG ? '/p/' + window.SOVA_PROJECT_SLUG : '';
    return '<a href="' + prefix + '/spec/' + escapeHtml(String(item.issue)) + '" ' +
      'class="px-3 py-1.5 rounded text-xs bg-accent-purple/20 text-accent-purple hover:bg-accent-purple/30 transition-colors inline-flex items-center gap-1" ' +
      'data-tooltip="Review spec before development">' +
      '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>' +
      'View Spec</a>';
  }

  var role = _STATE_ROLE_MAP[item.state] || 'developer';
  var label = item.last_run && item.last_run.status === 'failed' ? 'Retry' : 'Start';
  var tooltip = label === 'Retry' ? 'Retry this failed task' : 'Start ' + role + ' for this issue';
  return '<button onclick="startFromQueue(\'' + escapeJsStr(String(item.issue)) + '\', \'' + role + '\', event)" ' +
    'class="px-3 py-1.5 rounded text-xs bg-accent/20 text-accent hover:bg-accent/30 transition-colors" ' +
    'data-tooltip="' + tooltip + '">' +
    label + '</button>';
}

function timeAgo(isoStr) {
  if (!isoStr) return '';
  var d = new Date(isoStr);
  if (isNaN(d.getTime())) return '';
  var now = new Date();
  var diff = Math.floor((now - d) / 1000);
  if (diff < 0) return '';
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function issueTypeBadge(type) {
  if (!type) return '';
  var cls = issueTypeStyles[type] || 'bg-gray-600/30 text-gray-400';
  return '<span class="px-1.5 py-0.5 rounded text-xs font-medium ' + cls + '">' + escapeHtml(type) + '</span>';
}

function stateBadge(state) {
  var label = stateLabels[state] || state;
  var cls = stateColors[state] || 'bg-gray-600/30 text-gray-400';
  return '<span class="px-1.5 py-0.5 rounded text-xs ' + cls + '">' + escapeHtml(label) + '</span>';
}

function actionBadge(action) {
  var cls = actionStyles[action] || 'bg-gray-600/30 text-gray-400';
  var label = actionLabels[action] || action;
  return '<span class="px-1.5 py-0.5 rounded text-xs font-medium ' + cls + '">' + escapeHtml(label) + '</span>';
}

function specStatusBadge(specStatus) {
  if (!specStatus) return '';
  var styles = {
    draft: 'bg-accent-yellow/15 text-accent-yellow',
    approved: 'bg-accent-green/15 text-accent-green',
    rejected: 'bg-accent-red/15 text-accent-red',
    missing: 'bg-gray-600/30 text-gray-500',
  };
  var labels = {
    draft: 'Spec: Draft',
    approved: 'Spec: Approved',
    rejected: 'Spec: Rejected',
    missing: 'No Spec',
  };
  var cls = styles[specStatus] || 'bg-gray-600/30 text-gray-500';
  var label = labels[specStatus] || specStatus;
  return '<span class="px-1.5 py-0.5 rounded text-xs ' + cls + '">' + escapeHtml(label) + '</span>';
}

function renderQueueCard(item) {
  var style = milestoneStyles[item.priority_label] || milestoneStyles['--'];
  var isSelected = !!selectedItems[item.issue];
  var selectedClasses = isSelected ? ' ring-1 ring-accent/40 bg-accent/5' : '';

  var issueDisplay = item.jira_key ? escapeHtml(item.jira_key) : '#' + escapeHtml(item.issue);

  var typeBadge = issueTypeBadge(item.issue_type);

  var displayLabels = (item.labels || []).filter(function(l) {
    return l.indexOf('agent:') !== 0 && l.indexOf('priority:') !== 0 && l.indexOf('role:') !== 0;
  });
  var labelsHtml = displayLabels.map(function(l) {
    return '<span class="px-1.5 py-0.5 rounded text-xs bg-gray-700/50 text-gray-400">' + escapeHtml(l) + '</span>';
  }).join(' ');

  var metaParts = [];
  metaParts.push(stateBadge(item.state));
  if (item.spec_status) {
    metaParts.push(specStatusBadge(item.spec_status));
  }
  if (item.jira_status) {
    metaParts.push('<span class="text-xs text-gray-500">' + escapeHtml(item.jira_status) + '</span>');
  }
  if (item.assignees && item.assignees.length > 0) {
    metaParts.push('<span class="text-xs text-gray-500">' + escapeHtml(item.assignees[0]) + '</span>');
  }
  if (item.created_at) {
    metaParts.push('<span class="text-xs text-gray-600">opened ' + timeAgo(item.created_at) + '</span>');
  }
  if (labelsHtml) {
    metaParts.push(labelsHtml);
  }
  var metaHtml = metaParts.join('<span class="text-gray-700 mx-1">|</span>');

  return '<div id="card-' + escapeHtml(item.issue) + '" class="bg-surface-card rounded-lg border ' + style.border + ' p-4 flex items-center gap-4 transition-all' + selectedClasses + '">' +
    '<input type="checkbox" id="cb-' + escapeHtml(item.issue) + '" ' + (isSelected ? 'checked ' : '') +
      'onchange="toggleSelection(\'' + escapeHtml(item.issue) + '\', \'' + escapeHtml(item.state) + '\')" ' +
      'class="rounded border-gray-600 bg-surface text-accent focus:ring-accent/50 cursor-pointer shrink-0">' +
    '<span class="px-2 py-1 rounded text-xs font-bold ' + style.badge + '">' + item.priority_label + '</span>' +
    '<div class="flex-1 min-w-0">' +
      '<div class="flex items-center gap-2">' +
        (item.url
          ? '<a href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener" class="text-sm font-medium text-accent hover:underline whitespace-nowrap" onclick="event.stopPropagation()">' + issueDisplay + '</a>'
          : '<span class="text-sm font-medium whitespace-nowrap">' + (item.jira_key ? issueDisplay : issueLink(item.issue)) + '</span>') +
        typeBadge +
        '<span class="text-sm text-gray-300 truncate">' + escapeHtml(item.title) + '</span>' +
      '</div>' +
      '<div class="flex items-center gap-1 mt-1 flex-wrap">' + metaHtml + '</div>' +
    '</div>' +
    '<div class="flex items-center gap-2 shrink-0">' +
      renderRunStatusBadge(item) +
      actionBadge(item.action) +
      renderStartButton(item) +
    '</div>' +
  '</div>';
}

function toggleSelection(issueId, state) {
  if (selectedItems[issueId]) {
    delete selectedItems[issueId];
  } else {
    selectedItems[issueId] = { state: state };
  }
  updateSelectionUI();
}

function toggleSelectAll() {
  var allBox = document.getElementById('select-all');
  if (allBox.checked) {
    getFilteredItems().forEach(function(item) {
      selectedItems[item.issue] = { state: item.state };
    });
  } else {
    selectedItems = {};
  }
  renderFilteredQueue();
}

function deselectAll() {
  selectedItems = {};
  var allBox = document.getElementById('select-all');
  if (allBox) allBox.checked = false;
  renderFilteredQueue();
}

function updateSelectionUI() {
  var count = Object.keys(selectedItems).length;
  var bar = document.getElementById('bulk-bar');
  var countEl = document.getElementById('bulk-count');

  queueData.forEach(function(item) {
    var selected = !!selectedItems[item.issue];
    var cb = document.getElementById('cb-' + item.issue);
    if (cb) cb.checked = selected;
    var card = document.getElementById('card-' + item.issue);
    if (card) {
      if (selected) {
        card.classList.add('ring-1', 'ring-accent/40', 'bg-accent/5');
      } else {
        card.classList.remove('ring-1', 'ring-accent/40', 'bg-accent/5');
      }
    }
  });

  var allBox = document.getElementById('select-all');
  var filtered = getFilteredItems();
  if (allBox) {
    if (filtered.length === 0) {
      allBox.checked = false;
      allBox.indeterminate = false;
    } else {
      allBox.checked = count === filtered.length;
      allBox.indeterminate = count > 0 && count < filtered.length;
    }
  }

  if (count === 0) {
    bar.classList.add('hidden');
    return;
  }

  bar.classList.remove('hidden');
  bar.style.bottom = _globalBatchId ? '48px' : '0';
  countEl.textContent = count + ' selected';

  var states = Object.values(selectedItems).map(function(v) { return v.state; });

  var triageCount = states.filter(function(s) { return validStates.triage.indexOf(s) !== -1; }).length;
  var hardenCount = states.filter(function(s) { return validStates.harden.indexOf(s) !== -1; }).length;
  var runCount = states.filter(function(s) { return validStates.run.indexOf(s) !== -1; }).length;

  var triageBtn = document.getElementById('bulk-triage-btn');
  var hardenBtn = document.getElementById('bulk-harden-btn');
  var runBtn = document.getElementById('bulk-run-btn');

  var batchRunning = !!_globalBatchId;
  triageBtn.disabled = triageCount === 0 || batchRunning;
  triageBtn.textContent = triageCount > 0 ? 'Triage (' + triageCount + ')' : 'Triage';

  hardenBtn.disabled = hardenCount === 0 || batchRunning;
  hardenBtn.textContent = hardenCount > 0 ? 'Harden (' + hardenCount + ')' : 'Harden';

  runBtn.disabled = runCount === 0 || batchRunning;
  runBtn.textContent = runCount > 0 ? 'Run (' + runCount + ')' : 'Run';
}

async function loadQueue() {
  try {
    var data = await fetchAPI(apiUrl('/queue'));
    queueData = data.queue;
    var selectAllWrapper = document.getElementById('select-all-wrapper');
    var filterBar = document.getElementById('filter-bar');

    if (data.queue.length === 0) {
      selectAllWrapper.style.display = 'none';
      filterBar.classList.add('hidden');
      document.getElementById('queue-content').innerHTML = '<div class="bg-surface-card rounded-lg border border-gray-700/50 p-8 text-center">' +
        '<p class="text-gray-500">No actionable issues in queue</p>' +
        '<p class="text-xs text-gray-600 mt-1">Issues appear here when they have agent-managed labels</p>' +
      '</div>';
      return;
    }

    selectAllWrapper.style.display = 'flex';
    filterBar.classList.remove('hidden');
    populateFilterDropdowns();
    renderFilteredQueue();
  } catch (e) {
    console.error('Failed to load queue:', e);
  }
}

async function startFromQueue(issue, role, e) {
  var btn = e.target;
  var originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Starting...';
  btn.style.opacity = '0.5';

  try {
    var resp = await fetch(apiUrl('/queue/start/' + issue), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ role: role || null }),
    });
    if (!resp.ok) {
      showToast(await getErrorDetail(resp, 'Failed to start agent'), 'error');
      btn.disabled = false;
      btn.textContent = originalLabel;
      btn.style.opacity = '1';
      return;
    }
    window.location.href = (window.SOVA_PROJECT_SLUG ? '/p/' + window.SOVA_PROJECT_SLUG : '') + '/agents';
  } catch (e) {
    showToast('Failed to start agent: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = originalLabel;
    btn.style.opacity = '1';
  }
}

async function executeBulkAction(action) {
  var eligible = validStates[action];
  var issues = Object.keys(selectedItems).filter(function(id) {
    return eligible.indexOf(selectedItems[id].state) !== -1;
  });

  if (issues.length === 0) return;

  if (action === 'run') {
    // Filter out RESEARCHED issues with unapproved specs
    var blocked = [];
    var runnable = issues.filter(function(id) {
      var item = queueData.find(function(q) { return String(q.issue) === id; });
      if (item && item.state === 'researched' && item.spec_status && item.spec_status !== 'approved' && item.spec_status !== 'missing') {
        blocked.push('#' + id);
        return false;
      }
      return true;
    });
    if (blocked.length > 0) {
      showToast('Spec review required for: ' + blocked.join(', '), 'error');
    }
    if (runnable.length === 0) return;

    try {
      var resp = await fetch(apiUrl('/queue/batch'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ issues: runnable, action: 'run', options: {} }),
      });
      if (!resp.ok) {
        showToast(await getErrorDetail(resp, 'Failed to start batch run'), 'error');
        return;
      }
      var data = await resp.json();
      if (data.started) {
        window.location.href = (window.SOVA_PROJECT_SLUG ? '/p/' + window.SOVA_PROJECT_SLUG : '') + '/agents';
      }
    } catch (e) {
      showToast('Failed to start agent: ' + e.message, 'error');
    }
    return;
  }

  try {
    var resp = await fetch(apiUrl('/queue/batch'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ issues: issues, action: action, options: {} }),
    });
    if (!resp.ok) {
      showToast(await getErrorDetail(resp, 'Failed to start batch'), 'error');
      return;
    }
    var data = await resp.json();

    startGlobalBatch(data.batch_id, action, issues.length);
    updateSelectionUI();
  } catch (e) {
    showToast('Failed to start batch: ' + e.message, 'error');
  }
}

initFiltersFromUrl();

function initFiltersFromUrl() {
  var params = new URLSearchParams(window.location.search);
  var q = params.get('q');
  if (q) {
    activeFilters.search = q;
    var input = document.getElementById('filter-search');
    if (input) input.value = q;
  }
}

function persistSearchToUrl() {
  var url = new URL(window.location);
  if (activeFilters.search) {
    url.searchParams.set('q', activeFilters.search);
  } else {
    url.searchParams.delete('q');
  }
  history.replaceState(null, '', url);
}

function hasActiveFilters() {
  return activeFilters.search ||
    activeFilters.states.length > 0 ||
    activeFilters.milestones.length > 0 ||
    activeFilters.labels.length > 0;
}

function applyFilters() {
  var input = document.getElementById('filter-search');
  activeFilters.search = (input ? input.value : '').trim().toLowerCase();
  persistSearchToUrl();
  selectedItems = {};
  updateSelectionUI();
  renderFilteredQueue();
  updateFilterCounts();
}

function getFilteredItems() {
  if (!hasActiveFilters()) return queueData;

  var search = activeFilters.search;
  return queueData.filter(function(item) {
    if (search) {
      var haystack = (item.title + ' ' + item.issue + ' ' + (item.jira_key || '')).toLowerCase();
      if (haystack.indexOf(search) === -1) return false;
    }
    if (activeFilters.states.length > 0) {
      if (activeFilters.states.indexOf(item.state) === -1) return false;
    }
    if (activeFilters.milestones.length > 0) {
      if (activeFilters.milestones.indexOf(item.priority_label) === -1) return false;
    }
    if (activeFilters.labels.length > 0) {
      var itemLabels = item.labels || [];
      var hasMatchingLabel = activeFilters.labels.some(function(fl) {
        return itemLabels.indexOf(fl) !== -1;
      });
      if (!hasMatchingLabel) return false;
    }
    return true;
  });
}

function renderFilteredQueue() {
  var container = document.getElementById('queue-content');
  var filtered = getFilteredItems();
  var clearBtn = document.getElementById('filter-clear-btn');
  if (clearBtn) clearBtn.style.display = hasActiveFilters() ? 'block' : 'none';

  if (queueData.length > 0 && filtered.length === 0) {
    container.innerHTML = '<div class="bg-surface-card rounded-lg border border-gray-700/50 p-8 text-center">' +
      '<p class="text-gray-500">No issues match filters</p>' +
      '<p class="text-xs text-gray-600 mt-1">Try adjusting your search or filter criteria</p>' +
    '</div>';
    return;
  }

  var groups = {};
  filtered.forEach(function(item) {
    var g = item.state;
    if (!groups[g]) groups[g] = [];
    groups[g].push(item);
  });

  var html = '';
  stateGroupOrder.forEach(function(state) {
    var items = groups[state];
    if (!items || items.length === 0) return;

    var isDimmed = state === 'needs_spec';
    var groupClasses = isDimmed ? ' opacity-60' : '';

    html += '<div class="mt-6 first:mt-0">' +
      '<div class="flex items-center gap-3 mb-3">' +
        '<h3 class="text-sm font-medium text-gray-400 whitespace-nowrap">' + stateGroupLabels[state] + '</h3>' +
        '<span class="text-xs text-gray-600">(' + items.length + ')</span>' +
        '<div class="flex-1 border-t border-gray-700/30"></div>' +
      '</div>' +
      '<div class="space-y-2' + groupClasses + '">';

    var phaseGroups = {};
    var phaseOrder = [];
    items.forEach(function(item) {
      var po = item.phase_order || 99;
      if (!phaseGroups[po]) {
        phaseGroups[po] = [];
        phaseOrder.push(po);
      }
      phaseGroups[po].push(item);
    });
    phaseOrder.sort(function(a, b) { return a - b; });

    var hasMultiplePhases = phaseOrder.length > 1 || (phaseOrder.length === 1 && phaseOrder[0] !== 99);
    phaseOrder.forEach(function(po) {
      var phaseItems = phaseGroups[po];
      if (hasMultiplePhases) {
        var phaseLabel = po < 99 ? 'Phase ' + po : 'No phase';
        html += '<div class="ml-2 mt-3 first:mt-0 mb-1">' +
          '<span class="text-xs font-medium text-gray-500">' + escapeHtml(phaseLabel) + '</span>' +
          '<span class="text-xs text-gray-600 ml-1">(' + phaseItems.length + ')</span>' +
        '</div>';
      }
      phaseItems.forEach(function(item) {
        html += renderQueueCard(item);
      });
    });

    html += '</div></div>';
  });

  container.innerHTML = html;
  updateSelectionUI();
}

function populateFilterDropdowns() {
  var statesInData = {};
  var milestonesInData = {};
  var labelsInData = {};

  queueData.forEach(function(item) {
    statesInData[item.state] = true;
    if (item.priority_label && item.priority_label !== '--') {
      milestonesInData[item.priority_label] = true;
    }
    (item.labels || []).forEach(function(l) {
      if (l.indexOf('agent:') !== 0 && l.indexOf('priority:') !== 0 && l.indexOf('role:') !== 0) {
        labelsInData[l] = true;
      }
    });
  });

  var stateDropdown = document.getElementById('filter-state-dropdown');
  stateDropdown.innerHTML = stateGroupOrder
    .filter(function(s) { return statesInData[s]; })
    .map(function(s) {
      var checked = activeFilters.states.indexOf(s) !== -1 ? ' checked' : '';
      return '<label class="flex items-center gap-2 px-3 py-1.5 hover:bg-gray-700/30 cursor-pointer text-sm text-gray-300">' +
        '<input type="checkbox" value="' + s + '" onchange="onFilterCheckbox(\x27states\x27, this)"' + checked +
        ' class="rounded border-gray-600 bg-surface text-accent focus:ring-accent/50">' +
        escapeHtml(stateLabels[s] || s) + '</label>';
    }).join('');

  var milestoneDropdown = document.getElementById('filter-milestone-dropdown');
  var milestoneKeys = Object.keys(milestonesInData).sort();
  milestoneDropdown.innerHTML = milestoneKeys.map(function(m) {
    var checked = activeFilters.milestones.indexOf(m) !== -1 ? ' checked' : '';
    return '<label class="flex items-center gap-2 px-3 py-1.5 hover:bg-gray-700/30 cursor-pointer text-sm text-gray-300">' +
      '<input type="checkbox" value="' + escapeHtml(m) + '" onchange="onFilterCheckbox(\x27milestones\x27, this)"' + checked +
      ' class="rounded border-gray-600 bg-surface text-accent focus:ring-accent/50">' +
      escapeHtml(m) + '</label>';
  }).join('');

  var labelKeys = Object.keys(labelsInData).sort();
  var labelItemsContainer = document.getElementById('label-dropdown-items');
  labelItemsContainer.innerHTML = labelKeys.map(function(l) {
    var checked = activeFilters.labels.indexOf(l) !== -1 ? ' checked' : '';
    return '<label class="filter-label-option flex items-center gap-2 px-3 py-1.5 hover:bg-gray-700/30 cursor-pointer text-sm text-gray-300" data-label="' + escapeHtml(l.toLowerCase()) + '">' +
      '<input type="checkbox" value="' + escapeHtml(l) + '" onchange="onFilterCheckbox(\x27labels\x27, this)"' + checked +
      ' class="rounded border-gray-600 bg-surface text-accent focus:ring-accent/50">' +
      escapeHtml(l) + '</label>';
  }).join('');
}

function onFilterCheckbox(filterKey, checkbox) {
  var val = checkbox.value;
  var arr = activeFilters[filterKey];
  if (checkbox.checked) {
    if (arr.indexOf(val) === -1) arr.push(val);
  } else {
    var idx = arr.indexOf(val);
    if (idx !== -1) arr.splice(idx, 1);
  }
  selectedItems = {};
  updateSelectionUI();
  renderFilteredQueue();
  updateFilterCounts();
}

function updateFilterCounts() {
  var stateCount = document.getElementById('filter-state-count');
  var milestoneCount = document.getElementById('filter-milestone-count');
  var labelCount = document.getElementById('filter-label-count');
  stateCount.textContent = activeFilters.states.length > 0 ? '(' + activeFilters.states.length + ')' : '';
  milestoneCount.textContent = activeFilters.milestones.length > 0 ? '(' + activeFilters.milestones.length + ')' : '';
  labelCount.textContent = activeFilters.labels.length > 0 ? '(' + activeFilters.labels.length + ')' : '';
}

function toggleDropdown(id) {
  var dropdown = document.getElementById(id);
  var wasHidden = dropdown.classList.contains('hidden');
  closeAllDropdowns();
  if (wasHidden) dropdown.classList.remove('hidden');
}

function closeAllDropdowns() {
  ['filter-state-dropdown', 'filter-milestone-dropdown', 'filter-label-dropdown'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.classList.add('hidden');
  });
}

function filterLabelDropdown() {
  var search = (document.getElementById('label-dropdown-search').value || '').toLowerCase();
  var items = document.querySelectorAll('.filter-label-option');
  items.forEach(function(el) {
    el.style.display = el.getAttribute('data-label').indexOf(search) !== -1 ? '' : 'none';
  });
}

function clearAllFilters() {
  activeFilters = { search: '', states: [], milestones: [], labels: [] };
  var input = document.getElementById('filter-search');
  if (input) input.value = '';
  persistSearchToUrl();
  selectedItems = {};
  populateFilterDropdowns();
  updateFilterCounts();
  updateSelectionUI();
  renderFilteredQueue();
}

document.addEventListener('click', function(e) {
  var wrappers = ['filter-state-wrapper', 'filter-milestone-wrapper', 'filter-label-wrapper'];
  var insideDropdown = wrappers.some(function(id) {
    var el = document.getElementById(id);
    return el && el.contains(e.target);
  });
  if (!insideDropdown) closeAllDropdowns();
});

visibilityAwarePoll(loadQueue, 15000);
</script>
{% endblock %}
