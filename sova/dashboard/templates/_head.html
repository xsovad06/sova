<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js" integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL" crossorigin="anonymous"></script>
<script>
function escapeHtml(text) {
  return String(text == null ? '' : text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Shared across logs.html and agents.html so both color-code log levels identically.
var LOG_LEVEL_COLORS = {
  DEBUG: 'text-gray-500',
  INFO: 'text-accent-green',
  WARNING: 'text-accent-yellow',
  ERROR: 'text-accent-red',
  CRITICAL: 'text-accent-red font-bold',
};

var _markedConfigured = false;
function _ensureMarked() {
  if (_markedConfigured) return;
  if (!window.marked) return;
  _markedConfigured = true;
  marked.use({
    gfm: true,
    breaks: true,
    renderer: {
      heading: function(token) {
        var text = this.parser.parseInline(token.tokens);
        var tag = 'h' + token.depth;
        var cls = token.depth === 1 ? 'text-xl font-bold mt-6 mb-3 text-gray-100'
                : token.depth === 2 ? 'text-lg font-semibold mt-6 mb-3 text-gray-100 border-b border-gray-700/50 pb-2'
                : 'text-base font-semibold mt-4 mb-2 text-gray-200';
        return '<' + tag + ' class="' + cls + '">' + text + '</' + tag + '>';
      },
    },
  });
}

function renderMarkdown(text) {
  _ensureMarked();
  if (!window.marked) return escapeHtml(text || '');
  var html = marked.parse(text || '');
  return window.DOMPurify ? DOMPurify.sanitize(html) : escapeHtml(text || '');
}
</script>
