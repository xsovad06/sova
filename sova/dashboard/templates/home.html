<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOVA Dashboard</title>
  {% include "_head.html" %}
</head>
<body class="bg-surface text-gray-200 min-h-screen flex items-center justify-center">
  <div class="max-w-2xl w-full px-6">
    <div class="text-center mb-10">
      <a href="/" class="inline-block mb-4">
        <img src="/static/logo.png" alt="SOVA" class="h-20 w-20 rounded-lg object-cover object-top mx-auto">
      </a>
      <h1 class="text-3xl font-bold text-accent mb-2">SOVA</h1>
      <p class="text-gray-400">Select a project to manage, or set up a new one.</p>
    </div>

    <!-- Project list -->
    <div id="project-list" class="space-y-3 mb-8">
      {% for slug, path in projects.items() %}
      <a href="/p/{{ slug }}/"
         class="block bg-surface-card border border-gray-700/50 rounded-lg px-5 py-4 hover:border-accent/50 hover:bg-surface-hover transition-all group">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-lg font-medium text-gray-100 group-hover:text-accent transition-colors">{{ slug }}</h2>
            <p class="text-xs text-gray-500 mt-1 font-mono">{{ path }}</p>
          </div>
          <span class="text-gray-600 group-hover:text-accent transition-colors text-xl">&rarr;</span>
        </div>
      </a>
      {% else %}
      <div class="bg-surface-card border border-gray-700/50 rounded-lg px-5 py-8 text-center">
        <p class="text-gray-400 mb-2">No projects registered yet.</p>
        <p class="text-gray-500 text-sm">Use Setup to add your first project.</p>
      </div>
      {% endfor %}
    </div>

    <!-- Setup link -->
    <div class="text-center">
      <a href="/setup"
         class="inline-flex items-center gap-2 bg-accent/10 text-accent border border-accent/30 rounded-lg px-6 py-3 hover:bg-accent/20 transition-colors text-sm font-medium">
        <span class="text-lg">+</span>
        Setup New Project
      </a>
    </div>
  </div>
</body>
</html>
