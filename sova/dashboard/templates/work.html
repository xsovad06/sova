{% extends "base.html" %}
{% block title %}Work - SOVA{% endblock %}
{% block content %}
<h2 class="text-2xl font-semibold mb-6">Work</h2>

<!-- Tab bar -->
<div class="flex items-center gap-1 mb-6 border-b border-gray-700/50">
  <button onclick="switchTab('active')" id="tab-active"
    class="px-4 py-2.5 text-sm transition-colors border-b-2 border-accent text-white">
    Active <span id="tab-active-count" class="text-xs text-gray-500 ml-1"></span>
  </button>
  <button onclick="switchTab('history')" id="tab-history"
    class="px-4 py-2.5 text-sm transition-colors border-b-2 border-transparent text-gray-500 hover:text-gray-300">
    History
  </button>
  <button onclick="switchTab('failed')" id="tab-failed"
    class="px-4 py-2.5 text-sm transition-colors border-b-2 border-transparent text-gray-500 hover:text-gray-300">
    Failed <span id="tab-failed-count" class="text-xs text-gray-500 ml-1"></span>
  </button>
</div>

<!-- Active tab -->
<div id="panel-active">
  <div id="active-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <p class="text-gray-500 text-sm">Loading...</p>
  </div>
</div>

<!-- History tab -->
<div id="panel-history" class="hidden">
  <div class="flex items-center gap-3 mb-4">
    <select id="filter-role" onchange="loadHistory()" class="bg-surface border border-gray-700 rounded px-3 py-1.5 text-xs text-gray-300 focus:border-accent focus:outline-none">
      <option value="">All roles</option>
      <option value="developer">Developer</option>
      <option value="triage">Triage</option>
      <option value="researcher">Researcher</option>
      <option value="reviewer">Reviewer</option>
      <option value="auto">Auto</option>
    </select>
  </div>
  <div id="history-table"></div>
</div>

<!-- Failed tab -->
<div id="panel-failed" class="hidden">
  <div id="failed-table"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
var currentTab = 'active';
var activePollInterval = null;

function switchTab(tab) {
  currentTab = tab;
  ['active', 'history', 'failed'].forEach(function(t) {
    var panel = document.getElementById('panel-' + t);
    var tabBtn = document.getElementById('tab-' + t);
    if (t === tab) {
      panel.classList.remove('hidden');
      tabBtn.className = 'px-4 py-2.5 text-sm transition-colors border-b-2 border-accent text-white';
    } else {
      panel.classList.add('hidden');
      tabBtn.className = 'px-4 py-2.5 text-sm transition-colors border-b-2 border-transparent text-gray-500 hover:text-gray-300';
    }
  });

  if (tab === 'active') loadActive();
  if (tab === 'history') loadHistory();
  if (tab === 'failed') loadFailed();
}

async function loadActive() {
  try {
    var data = await fetchAPI(apiUrl('/work/active-grouped'));
    var grid = document.getElementById('active-grid');
    var countEl = document.getElementById('tab-active-count');
    countEl.textContent = data.issues.length > 0 ? '(' + data.issues.length + ')' : '';

    if (data.issues.length === 0) {
      grid.innerHTML = '<div class="col-span-2 bg-surface-card rounded-lg border border-gray-700/50 p-8 text-center">' +
        '<p class="text-gray-500">No active tasks</p>' +
      '</div>';
      return;
    }

    grid.innerHTML = data.issues.map(function(group) {
      var task = group.latest_run;
      var colors = roleColor(task.role);
      var pipeline = renderStepPipeline(task.current_step, task.role, false);
      var cost = '$' + task.total_cost_usd.toFixed(4);
      var elapsed = task.elapsed_formatted || formatElapsed(task.elapsed_seconds);
      var prefix = window.SOVA_PROJECT_SLUG ? '/p/' + window.SOVA_PROJECT_SLUG : '';
      var prevCount = group.previous_runs.length;
      var groupId = 'prev-' + task.issue_number;

      var card = '<div class="bg-surface-card rounded-lg border ' + colors.border + ' p-4">' +
        '<div class="flex items-center justify-between mb-3 cursor-pointer hover:opacity-80" onclick="window.location=\'' + prefix + '/work/' + task.id + '\'">' +
          '<div class="flex items-center gap-2">' +
            '<span class="w-2 h-2 rounded-full ' + statusDot(task.status) + '"></span>' +
            '<span class="text-sm font-medium text-gray-200">#' + escapeHtml(task.issue_number) + '</span>' +
            '<span class="px-1.5 py-0.5 rounded text-xs font-medium ' + colors.bg + ' ' + colors.text + '">' + escapeHtml(task.role) + '</span>' +
            '<span class="text-xs ' + statusColor(task.status) + '">' + escapeHtml(task.status) + '</span>' +
          '</div>' +
          '<div class="flex items-center gap-3 text-xs">' +
            '<span class="text-accent-green">' + cost + '</span>' +
            '<span class="text-gray-500">' + elapsed + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="mb-2">' + pipeline + '</div>' +
        (task.branch_name ? '<div class="text-xs text-gray-500 mt-2">Branch: ' + escapeHtml(task.branch_name) + '</div>' : '') +
        (task.pr_number ? '<div class="text-xs text-gray-500">PR: ' + prLink(task.pr_number) + '</div>' : '');

      if (prevCount > 0) {
        card += '<div class="mt-3 border-t border-gray-700/30 pt-2">' +
          '<button onclick="event.stopPropagation(); togglePrev(\'' + groupId + '\')" class="text-xs text-gray-500 hover:text-gray-300">' +
            '+' + prevCount + ' previous run' + (prevCount > 1 ? 's' : '') +
          '</button>' +
          '<div id="' + groupId + '" class="hidden mt-2 space-y-1">' +
          group.previous_runs.map(function(prev) {
            return '<div class="flex items-center justify-between text-xs text-gray-500 py-1 px-2 rounded hover:bg-surface-hover cursor-pointer" onclick="event.stopPropagation(); window.location=\'' + prefix + '/work/' + prev.id + '\'">' +
              '<span class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full ' + statusDot(prev.status) + '"></span>Run #' + prev.id + ' <span class="' + statusColor(prev.status) + '">' + escapeHtml(prev.status) + '</span></span>' +
              '<span>' + (prev.elapsed_formatted || formatElapsed(prev.elapsed_seconds)) + '</span>' +
            '</div>';
          }).join('') +
          '</div></div>';
      }

      card += '</div>';
      return card;
    }).join('');
  } catch (e) {
    console.error('Failed to load active work:', e);
  }
}

function togglePrev(id) {
  var el = document.getElementById(id);
  if (el) el.classList.toggle('hidden');
}

async function loadHistory() {
  try {
    var role = document.getElementById('filter-role').value;
    var url = '/work/history?limit=50';
    if (role) url += '&role=' + role;

    var data = await fetchAPI(apiUrl(url));
    renderHistoryTable(data.tasks, 'history-table');
  } catch (e) {
    console.error('Failed to load history:', e);
  }
}

async function loadFailed() {
  try {
    var data = await fetchAPI(apiUrl('/work/history?status=failed&limit=50'));
    var countEl = document.getElementById('tab-failed-count');
    countEl.textContent = data.tasks.length > 0 ? '(' + data.tasks.length + ')' : '';
    renderHistoryTable(data.tasks, 'failed-table', true);
  } catch (e) {
    console.error('Failed to load failed:', e);
  }
}

function renderHistoryTable(tasks, targetId, showError) {
  var el = document.getElementById(targetId);
  if (tasks.length === 0) {
    el.innerHTML = '<div class="bg-surface-card rounded-lg border border-gray-700/50 p-8 text-center">' +
      '<p class="text-gray-500">No runs found</p></div>';
    return;
  }

  var prefix = window.SOVA_PROJECT_SLUG ? '/p/' + window.SOVA_PROJECT_SLUG : '';

  el.innerHTML = '<div class="bg-surface-card rounded-lg border border-gray-700/50 overflow-hidden">' +
    '<table class="w-full text-sm">' +
    '<thead><tr class="text-gray-500 text-xs uppercase border-b border-gray-700/50">' +
      '<th class="text-left p-3">Issue</th>' +
      '<th class="text-left p-3">Role</th>' +
      '<th class="text-left p-3">Status</th>' +
      '<th class="text-left p-3">Steps</th>' +
      '<th class="text-right p-3">Cost</th>' +
      '<th class="text-left p-3">Duration</th>' +
      '<th class="text-left p-3">PR</th>' +
      '<th class="text-left p-3">Date</th>' +
    '</tr></thead><tbody>' +
    tasks.map(function(t) {
      var colors = roleColor(t.role);
      var stepsText = t.steps_completed + '/' + t.total_steps_possible;

      return '<tr class="border-t border-gray-700/30 hover:bg-surface-hover cursor-pointer" onclick="window.location=\'' + prefix + '/work/' + t.id + '\'">' +
        '<td class="p-3 text-accent">#' + escapeHtml(t.issue_number) + '</td>' +
        '<td class="p-3"><span class="px-1.5 py-0.5 rounded text-xs ' + colors.bg + ' ' + colors.text + '">' + escapeHtml(t.role) + '</span></td>' +
        '<td class="p-3"><span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full ' + statusDot(t.status) + '"></span><span class="' + statusColor(t.status) + '">' + escapeHtml(t.status) + '</span></span></td>' +
        '<td class="p-3 text-gray-400">' + stepsText + '</td>' +
        '<td class="p-3 text-right text-accent-green">$' + t.total_cost_usd.toFixed(4) + '</td>' +
        '<td class="p-3 text-gray-400">' + (t.duration_formatted || '--') + '</td>' +
        '<td class="p-3 text-gray-400">' + prLink(t.pr_number) + '</td>' +
        '<td class="p-3 text-gray-500 text-xs">' + (t.ended_at ? new Date(t.ended_at).toLocaleDateString() : '--') + '</td>' +
      '</tr>' +
      (showError && t.error_message ? '<tr class="border-t border-gray-700/10"><td colspan="8" class="px-3 pb-3 pt-1 text-xs text-accent-red">' + escapeHtml(t.error_message) + '</td></tr>' : '');
    }).join('') +
    '</tbody></table></div>';
}

// Init
loadActive();
activePollInterval = setInterval(function() {
  if (currentTab === 'active') loadActive();
}, 5000);
</script>
{% endblock %}
