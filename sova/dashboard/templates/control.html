{% extends "base.html" %}
{% block title %}Control - SOVA{% endblock %}
{% block content %}
<h2 class="text-2xl font-semibold mb-6">Agent Control</h2>

<!-- Status bar -->
<div class="flex items-center gap-4 mb-6 bg-surface-card rounded-lg p-4 border border-gray-700/50">
  <div class="flex items-center gap-2">
    <span id="status-dot" class="w-3 h-3 rounded-full bg-gray-500"></span>
    <span id="status-text" class="text-sm font-medium">Checking...</span>
  </div>
  <span id="status-pid" class="text-xs text-gray-500"></span>
  <div class="ml-auto flex items-center gap-2">
    <button id="stop-btn" onclick="stopAgent()" class="hidden text-xs px-3 py-1.5 rounded bg-accent-red/20 text-accent-red hover:bg-accent-red/30 transition-colors">
      Stop Agent
    </button>
  </div>
</div>

<!-- Start form -->
<div class="bg-surface-card rounded-lg border border-gray-700/50 mb-6 p-4">
  <h3 class="text-sm font-medium text-gray-400 mb-3">Start Agent Run</h3>
  <div class="flex items-center gap-3">
    <input type="text" id="start-issue" placeholder="Issue number (e.g. 42)"
           class="bg-surface text-sm text-gray-300 border border-gray-700/50 rounded px-3 py-1.5 w-48">
    <select id="start-role" class="bg-surface text-sm text-gray-300 border border-gray-700/50 rounded px-3 py-1.5">
      <option value="">Auto (dispatcher)</option>
      <option value="developer">Developer</option>
      <option value="triage">Triage</option>
      <option value="researcher">Researcher</option>
      <option value="reviewer">Reviewer</option>
    </select>
    <label class="flex items-center gap-1 text-xs text-gray-400">
      <input type="checkbox" id="start-force"> --force
    </label>
    <button onclick="startAgent()" class="text-xs px-4 py-1.5 rounded bg-accent/20 text-accent hover:bg-accent/30 transition-colors">
      Start
    </button>
  </div>
</div>

<!-- Output -->
<div class="bg-surface-card rounded-lg border border-gray-700/50">
  <div class="px-4 py-3 border-b border-gray-700/50 flex items-center justify-between">
    <h3 class="text-sm font-medium text-gray-400">Agent Output</h3>
    <span class="text-xs text-gray-600" id="output-count">0 lines</span>
  </div>
  <div class="p-4 max-h-[500px] overflow-y-auto font-mono text-xs" id="agent-output">
    <p class="text-gray-500">No output yet</p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let outputCursor = 0;

async function pollStatus() {
  try {
    const data = await fetchAPI('/api/control/status');
    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    const pid = document.getElementById('status-pid');
    const stopBtn = document.getElementById('stop-btn');

    if (data.running) {
      dot.className = 'w-3 h-3 rounded-full bg-accent-green animate-pulse';
      text.textContent = 'Running';
      pid.textContent = 'PID: ' + data.pid;
      stopBtn.classList.remove('hidden');
    } else {
      dot.className = 'w-3 h-3 rounded-full bg-gray-500';
      text.textContent = 'Idle';
      pid.textContent = '';
      stopBtn.classList.add('hidden');
    }
  } catch (e) { /* ignore */ }
}

async function pollOutput() {
  try {
    const data = await fetchAPI('/api/control/output?since=' + outputCursor);
    if (data.lines.length > 0) {
      const el = document.getElementById('agent-output');
      if (outputCursor === 0) el.innerHTML = '';
      data.lines.forEach(line => {
        const div = document.createElement('div');
        div.textContent = line;
        div.className = 'text-gray-300 leading-5';
        el.appendChild(div);
      });
      outputCursor = data.total;
      el.scrollTop = el.scrollHeight;
      document.getElementById('output-count').textContent = outputCursor + ' lines';
    }
  } catch (e) { /* ignore */ }
}

async function startAgent() {
  const issue = document.getElementById('start-issue').value.trim();
  if (!issue) return;
  const role = document.getElementById('start-role').value || null;
  const force = document.getElementById('start-force').checked;
  try {
    outputCursor = 0;
    document.getElementById('agent-output').innerHTML = '<p class="text-gray-500">Starting...</p>';
    await fetch('/api/control/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({issue, role, force}),
    });
  } catch (e) {
    console.error('Failed to start agent:', e);
  }
}

async function stopAgent() {
  try {
    await fetch('/api/control/stop', {method: 'POST'});
  } catch (e) {
    console.error('Failed to stop agent:', e);
  }
}

pollStatus();
setInterval(pollStatus, 3000);
setInterval(pollOutput, 1000);
</script>
{% endblock %}
