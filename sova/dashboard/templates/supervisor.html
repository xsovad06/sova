{% extends "base.html" %}
{% block title %}Supervisor - SOVA{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
  <h2 class="text-2xl font-semibold">Supervisor</h2>
  <div class="flex items-center gap-3">
    <label class="flex items-center gap-2 cursor-pointer select-none" title="Enable or disable the supervisor daemon">
      <div class="relative">
        <input type="checkbox" id="supervisor-toggle" class="sr-only peer" onchange="toggleSupervisor(this.checked)">
        <div class="w-9 h-5 bg-gray-600 peer-checked:bg-accent-green peer-focus-visible:ring-2 peer-focus-visible:ring-accent-green/50 rounded-full transition-colors duration-200"></div>
        <div class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full transition-transform duration-200 peer-checked:translate-x-4 pointer-events-none"></div>
      </div>
      <span id="supervisor-toggle-label" class="text-xs text-gray-400">Loading...</span>
    </label>
    <a href="{{ prefix|default('') }}/settings#supervisor"
       class="text-xs text-gray-500 hover:text-gray-300 transition-colors">Settings</a>
    <button id="poll-btn" onclick="triggerPoll()"
            title="Manually trigger one supervision cycle: check task states, sync CodeRabbit quota, and execute any ready progression decisions"
            class="text-sm px-4 py-2 rounded bg-accent/20 text-accent hover:bg-accent/30 transition-colors disabled:opacity-50" disabled>
      Poll Now
    </button>
  </div>
</div>

<!-- Dependency Graph (full width, primary board) -->
<div class="bg-surface-card rounded-lg border border-gray-700/50 p-4 mb-4">
  <div class="flex items-center justify-between mb-3">
    <h3 class="text-sm font-medium text-gray-300">Dependency Graph</h3>
    <div class="flex items-center gap-4 text-xs text-gray-500">
      <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-accent-green inline-block"></span> Done</span>
      <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-accent inline-block"></span> In Progress</span>
      <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full" style="background:#f9e2af" ></span> Awaiting</span>
      <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-gray-500 inline-block"></span> Open</span>
      <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-accent-red inline-block"></span> Blocked</span>
    </div>
  </div>
  <div id="graph-container" class="relative overflow-x-auto" style="min-height: 200px; max-height: 62vh;">
    <div id="graph-loading" class="flex items-center justify-center py-16 text-gray-500 text-sm">Loading graph...</div>
    <div id="graph-error" class="hidden flex items-center justify-center py-16">
      <p class="text-sm text-accent-red bg-accent-red/10 px-4 py-2 rounded"></p>
    </div>
    <svg id="graph-svg"></svg>
  </div>
</div>

<!-- Action drawer: appears when a node is clicked -->
<div id="action-drawer" class="hidden bg-surface-card rounded-lg border border-accent/30 p-4 mb-4">
  <div class="flex items-start gap-4">
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-2 mb-1 flex-wrap">
        <span id="drawer-dot" class="w-2.5 h-2.5 rounded-full bg-gray-500 shrink-0"></span>
        <a id="drawer-gh-link" href="#" target="_blank" class="text-xs font-mono text-accent hover:underline shrink-0"></a>
        <span id="drawer-state" class="text-xs text-gray-400 capitalize"></span>
        <span id="drawer-milestone" class="text-xs text-gray-600 truncate ml-1"></span>
      </div>
      <h4 id="drawer-title" class="text-sm font-medium text-gray-200 mb-1 leading-snug"></h4>
      <p id="drawer-excerpt" class="text-xs text-gray-500 mb-3 leading-relaxed"></p>
      <div id="drawer-actions" class="flex items-center gap-2 flex-wrap"></div>
    </div>
    <button onclick="hideDrawer()" class="text-gray-600 hover:text-gray-400 text-xs shrink-0 mt-0.5">close</button>
  </div>
</div>

<!-- Compact row: Rate Limits + Daemon Status -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
  <div class="bg-surface-card rounded-lg border border-gray-700/50 p-4">
    <h3 class="text-sm font-medium text-gray-300 mb-3">Rate Limits</h3>
    <div id="quota-panel" class="space-y-2">
      <p class="text-xs text-gray-500">Loading...</p>
    </div>
  </div>
  <div class="bg-surface-card rounded-lg border border-gray-700/50 p-4">
    <h3 class="text-sm font-medium text-gray-300 mb-3">Daemon Status</h3>
    <div id="status-panel" class="space-y-2 text-xs text-gray-400">
      <p>Loading...</p>
    </div>
  </div>
</div>

<!-- Activity Stream -->
<div class="bg-surface-card rounded-lg border border-gray-700/50 p-4">
  <div class="flex items-center justify-between mb-3">
    <h3 class="text-sm font-medium text-gray-300">Activity Stream</h3>
    <div class="flex items-center gap-2">
      <select id="filter-component" onchange="loadDecisions()" class="text-xs bg-surface border border-gray-700/50 rounded px-2 py-1 text-gray-400">
        <option value="">All components</option>
        <option value="progression">Progression</option>
        <option value="quota">Quota</option>
        <option value="health">Health</option>
      </select>
      <select id="filter-type" onchange="loadDecisions()" class="text-xs bg-surface border border-gray-700/50 rounded px-2 py-1 text-gray-400">
        <option value="">All types</option>
        <option value="decision">Decisions</option>
        <option value="status">Status</option>
        <option value="health">Health</option>
      </select>
    </div>
  </div>
  <div id="decisions-list" class="space-y-1 max-h-80 overflow-y-auto">
    <p class="text-xs text-gray-500 text-center py-4">Loading...</p>
  </div>
</div>

<script src="/static/d3.min.js"></script>
<script>
const prefix = '{{ prefix|default("") }}';
const apiBase = prefix ? `${prefix}/api` : '/api';
const githubRepo = {{ github_repo | tojson }};

const esc = window.escapeHtml || function(str) {
  const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
};

// -- Graph state --
let _graphKey = null;

function _computeGraphKey(data) {
  const n = (data.nodes || []).map(n => `${n.id}:${n.state}`).sort().join(',');
  const e = (data.edges || []).map(e => `${e.from}:${e.to}`).sort().join(',');
  return n + '|' + e;
}

function stateColor(state) {
  const s = (state || '').toLowerCase();
  if (s === 'done' || s === 'closed') return '#a6e3a1';
  if (s === 'in_progress' || s === 'in_review') return '#89b4fa';
  if (s === 'awaiting_approval') return '#f9e2af';
  if (s === 'blocked') return '#f38ba8';
  return '#6c7086';
}

// -- Toggle / enable / disable --
let _toggleBusy = false;

async function toggleSupervisor(enabled) {
  if (_toggleBusy) { return; }
  _toggleBusy = true;
  const toggle = document.getElementById('supervisor-toggle');
  toggle.disabled = true;
  try {
    if (enabled) {
      await enableSupervisor();
    } else {
      await disableSupervisor();
    }
  } catch (e) {
    console.error('toggleSupervisor failed:', e);
    await loadStatus();
  } finally {
    toggle.disabled = false;
    _toggleBusy = false;
  }
}

let _confirmPoll = null;

async function enableSupervisor() {
  // 1. Save config
  const r = await fetch(`${apiBase}/settings/config`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: 'supervisor.enabled', value: true }),
  });
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    const msg = typeof body.detail === 'string' ? body.detail : `HTTP ${r.status}`;
    alert(`Failed to enable supervisor: ${msg}`);
    await loadStatus();
    return;
  }
  // 2. Start daemon (no server restart needed)
  const s = await fetch(`${apiBase}/supervisor/start`, { method: 'POST' });
  if (!s.ok && s.status !== 409) {
    const body = await s.json().catch(() => ({}));
    console.warn('supervisor/start:', body.detail || s.status);
  }
  // 3. Refresh status, then poll briefly until daemon is confirmed running
  await loadStatus();
  if (_confirmPoll) { clearInterval(_confirmPoll); _confirmPoll = null; }
  let attempts = 0;
  _confirmPoll = setInterval(async () => {
    attempts++;
    const res = await fetch(`${apiBase}/supervisor/status`).catch(() => null);
    if (res && res.ok) {
      const data = await res.json().catch(() => ({}));
      if (data.running || attempts >= 5) {
        clearInterval(_confirmPoll);
        _confirmPoll = null;
        await loadStatus();
      }
    } else if (attempts >= 5) {
      clearInterval(_confirmPoll);
      _confirmPoll = null;
      await loadStatus();
    }
  }, 3000);
}

async function disableSupervisor() {
  if (_confirmPoll) { clearInterval(_confirmPoll); _confirmPoll = null; }
  const r = await fetch(`${apiBase}/settings/config`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: 'supervisor.enabled', value: false }),
  });
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    const msg = typeof body.detail === 'string' ? body.detail : `HTTP ${r.status}`;
    alert(`Failed to disable supervisor: ${msg}`);
    throw new Error(msg);
  }
  // Stop the running daemon so it doesn't keep polling with a stale config.
  await fetch(`${apiBase}/supervisor/stop`, { method: 'POST' }).catch(() => null);
  await loadStatus();
}

// -- Status --
async function loadStatus() {
  try {
    const res = await fetch(`${apiBase}/supervisor/status`);
    const data = await res.json();
    const toggle = document.getElementById('supervisor-toggle');
    const label = document.getElementById('supervisor-toggle-label');
    const pollBtn = document.getElementById('poll-btn');

    toggle.checked = !!data.enabled;

    if (!data.enabled) {
      label.textContent = 'Disabled';
      label.className = 'text-xs text-gray-400';
      pollBtn.disabled = true;
      return;
    }

    if (data.running) {
      label.textContent = 'Running';
      label.className = 'text-xs text-accent-green';
      pollBtn.disabled = false;
    } else {
      label.textContent = 'Enabled (starting...)';
      label.className = 'text-xs text-accent-yellow';
      pollBtn.disabled = true;
    }

    document.getElementById('status-panel').innerHTML = `
      <div class="flex justify-between"><span>Poll interval</span><span class="text-gray-300">${data.poll_interval_seconds}s</span></div>
      <div class="flex justify-between"><span>Log retention</span><span class="text-gray-300">${data.log_retention_days}d</span></div>
    `;
  } catch (e) {
    console.error('Failed to load supervisor status:', e);
  }
}

// -- Quota --
async function loadQuota() {
  try {
    const res = await fetch(`${apiBase}/quota/coderabbit`);
    if (!res.ok) {
      document.getElementById('quota-panel').innerHTML = '<p class="text-xs text-gray-500">CodeRabbit quota tracking not configured</p>';
      return;
    }
    const data = await res.json();
    const panel = document.getElementById('quota-panel');

    if (!data.enabled) {
      panel.innerHTML = '<p class="text-xs text-gray-500">CodeRabbit quota tracking disabled</p>';
      return;
    }

    const statusColor = data.can_create_pr ? 'text-accent-green' : 'text-accent-red';
    panel.innerHTML = `
      <div class="flex justify-between text-xs"><span class="text-gray-400">Status</span><span class="${statusColor} font-medium">${data.can_create_pr ? 'Available' : 'Throttled'}</span></div>
      <div class="flex justify-between text-xs"><span class="text-gray-400">Reviews in window</span><span class="text-gray-300">${data.reviews_in_window}/${data.reviews_per_hour}</span></div>
      ${data.next_available_minutes != null ? `<div class="flex justify-between text-xs"><span class="text-gray-400">Next available</span><span class="text-gray-300">${Math.ceil(data.next_available_minutes)}m</span></div>` : ''}
    `;
  } catch (e) {
    document.getElementById('quota-panel').innerHTML = '<p class="text-xs text-gray-500">Failed to load quota status</p>';
  }
}

// -- Dependency Graph --
async function loadGraph() {
  const loading = document.getElementById('graph-loading');
  const errorEl = document.getElementById('graph-error');

  try {
    const res = await fetch(`${apiBase}/dependencies/graph`);
    if (!res.ok) {
      const detail = res.status === 503 ? 'Project configuration unavailable' : `HTTP ${res.status}`;
      loading.classList.add('hidden');
      errorEl.classList.remove('hidden');
      errorEl.querySelector('p').textContent = `Failed to load graph: ${detail}`;
      return;
    }
    const data = await res.json();
    loading.classList.add('hidden');

    if (!data.nodes || data.nodes.length === 0) {
      errorEl.classList.remove('hidden');
      errorEl.querySelector('p').textContent = 'No issues with dependencies found';
      errorEl.querySelector('p').className = 'text-sm text-gray-500 bg-gray-700/30 px-4 py-2 rounded';
      return;
    }

    const newKey = _computeGraphKey(data);
    if (newKey === _graphKey) return;
    _graphKey = newKey;

    errorEl.classList.add('hidden');
    renderGraph(data);
  } catch (e) {
    loading.classList.add('hidden');
    errorEl.classList.remove('hidden');
    errorEl.querySelector('p').textContent = `Failed to load graph: ${e.message}`;
  }
}

function renderGraph(data) {
  // Layout constants
  const NW = 160, NH = 38;
  const NPY = 10;       // vertical gap between nodes in the same tier
  const TIER_W = NW + 72; // horizontal stride between tier columns
  const GP = 12, GH = 20; // group box padding / header height
  const MARGIN = 16;

  // Build tier map from parallel_groups: {node_id -> tier}
  const tierMap = {};
  (data.parallel_groups || []).forEach(g => g.task_ids.forEach(id => { tierMap[id] = g.tier; }));
  // Nodes absent from any group are placed at tier 0 (leftmost column).
  // Placing them at maxTier+1 would cause edges from grouped dependents
  // (lower tier) to point rightward to the ungrouped dependency (higher tier),
  // violating the left-to-right edge invariant and drawing backwards arrows.
  (data.nodes || []).forEach(n => { if (tierMap[n.id] == null) tierMap[n.id] = 0; });

  // Collect and sort nodes per tier: sort by (milestone, id) for visual grouping
  const tierNodes = {};
  (data.nodes || []).forEach(n => {
    const t = tierMap[n.id];
    if (!tierNodes[t]) tierNodes[t] = [];
    tierNodes[t].push(n);
  });
  const tiers = Object.keys(tierNodes).map(Number).sort((a, b) => a - b);
  tiers.forEach(t => {
    tierNodes[t].sort((a, b) => {
      const ma = a.milestone || '', mb = b.milestone || '';
      return ma !== mb ? ma.localeCompare(mb) : a.id - b.id;
    });
  });

  // Position each node at its tier column; Y = index within tier.
  // Top offset includes space for the group header (GH + GP) so the
  // milestone box header is never clipped off the top of the SVG.
  const nodePos = {}; // id -> {x, y, cx, cy}
  const TOP = MARGIN + GH + GP;
  tiers.forEach((t, ti) => {
    const x = MARGIN + ti * TIER_W;
    tierNodes[t].forEach((n, i) => {
      const y = TOP + i * (NH + NPY);
      nodePos[n.id] = { x, y, cx: x + NW / 2, cy: y + NH / 2 };
    });
  });

  // Milestone bounding boxes: compute from actual node positions
  const milestoneMap = {};
  (data.nodes || []).forEach(n => {
    const m = n.milestone || '(no milestone)';
    if (!milestoneMap[m]) milestoneMap[m] = [];
    milestoneMap[m].push(n);
  });

  // SVG dimensions
  const allX = Object.values(nodePos).map(p => p.x + NW);
  const allY = Object.values(nodePos).map(p => p.y + NH);
  const svgW = Math.max(allX.length ? Math.max(...allX) + MARGIN : 400, 400);
  const svgH = Math.max(allY.length ? Math.max(...allY) + MARGIN * 3 + GH : 200, 200);

  const svg = d3.select('#graph-svg')
    .attr('width', svgW).attr('height', svgH)
    .attr('viewBox', `0 0 ${svgW} ${svgH}`);
  svg.selectAll('*').remove();

  // Arrow marker
  svg.append('defs').append('marker')
    .attr('id', 'dep-arrow').attr('viewBox', '0 -4 8 8')
    .attr('refX', 7).attr('refY', 0)
    .attr('markerWidth', 5).attr('markerHeight', 5).attr('orient', 'auto')
    .append('path').attr('d', 'M0,-4L8,0L0,4').attr('fill', '#45475a');

  // Milestone group boxes drawn behind nodes
  Object.entries(milestoneMap).forEach(([m, nodes]) => {
    const xs = nodes.map(n => nodePos[n.id]?.x).filter(v => v != null);
    const ys = nodes.map(n => nodePos[n.id]?.y).filter(v => v != null);
    if (!xs.length) return;
    const bx = Math.min(...xs) - GP;
    const by = Math.min(...ys) - GH - GP;
    const bw = Math.max(...xs) + NW + GP - bx;
    const bh = Math.max(...ys) + NH + GP - by;
    svg.append('rect')
      .attr('x', bx).attr('y', by).attr('width', bw).attr('height', bh)
      .attr('rx', 6).attr('fill', 'rgba(17,17,27,0.55)')
      .attr('stroke', 'rgba(88,91,112,0.2)').attr('stroke-width', 1);
    svg.append('text')
      .attr('x', bx + GP).attr('y', by + GH - 4)
      .attr('fill', '#45475a').attr('font-size', '10px').attr('font-family', 'sans-serif')
      .text(m.length > 44 ? m.slice(0, 42) + '...' : m);
  });

  // Dependency edges: from right edge of dependency (e.to) to left edge of dependent (e.from)
  // Edges always flow left-to-right because tier[e.to] <= tier[e.from].
  (data.edges || []).forEach(e => {
    const dep = nodePos[e.to];
    const dnt = nodePos[e.from];
    if (!dep || !dnt) return;
    const sx = dep.x + NW, sy = dep.cy;
    const tx = dnt.x, ty = dnt.cy;
    const dx = Math.max((tx - sx) * 0.45, 20);
    svg.append('path')
      .attr('d', `M${sx},${sy} C${sx+dx},${sy} ${tx-dx},${ty} ${tx},${ty}`)
      .attr('fill', 'none').attr('stroke', '#45475a').attr('stroke-width', 1)
      .attr('marker-end', 'url(#dep-arrow)').attr('opacity', 0.65);
  });

  // Nodes
  (data.nodes || []).forEach(n => {
    const pos = nodePos[n.id];
    if (!pos) return;
    const color = stateColor(n.state);
    const isDone = n.state === 'done' || n.state === 'closed';
    const opacity = isDone ? 0.4 : 1;

    const g = svg.append('g').attr('class', 'dep-node').style('cursor', 'pointer')
      .attr('opacity', opacity);

    g.append('rect')
      .attr('x', pos.x).attr('y', pos.y).attr('width', NW).attr('height', NH)
      .attr('rx', 4)
      .attr('fill', color + '15')
      .attr('stroke', color + '55').attr('stroke-width', 1);

    g.append('circle')
      .attr('cx', pos.x + 11).attr('cy', pos.cy)
      .attr('r', 4).attr('fill', color);

    g.append('text')
      .attr('x', pos.x + 22).attr('y', pos.y + 14)
      .attr('fill', '#cdd6f4').attr('font-size', '10px')
      .attr('font-weight', '600').attr('font-family', 'monospace')
      .text(`#${n.id}`);

    const titleTrunc = n.title && n.title.length > 22 ? n.title.slice(0, 21) + '...' : (n.title || '');
    g.append('text')
      .attr('x', pos.x + 22).attr('y', pos.y + 27)
      .attr('fill', '#6c7086').attr('font-size', '9px').attr('font-family', 'sans-serif')
      .text(titleTrunc);

    g.on('mouseenter', function() { d3.select(this).select('rect').attr('stroke', color + 'aa'); })
     .on('mouseleave', function() { d3.select(this).select('rect').attr('stroke', color + '55'); })
     .on('click', () => showDrawer(n));
  });
}

// -- Action drawer --
function showDrawer(node) {
  const drawer = document.getElementById('action-drawer');
  drawer.classList.remove('hidden');

  const color = stateColor(node.state);
  document.getElementById('drawer-dot').style.backgroundColor = color;
  document.getElementById('drawer-title').textContent = node.title || `Issue #${node.id}`;
  document.getElementById('drawer-state').textContent = (node.state || '').replace(/_/g, ' ');
  document.getElementById('drawer-milestone').textContent = node.milestone || '';
  document.getElementById('drawer-excerpt').textContent = node.body_excerpt || '';

  const ghLink = document.getElementById('drawer-gh-link');
  ghLink.textContent = `#${node.id}`;
  ghLink.href = githubRepo ? `https://github.com/${githubRepo}/issues/${node.id}` : '#';

  const actions = document.getElementById('drawer-actions');
  const actionBtns = (node.available_actions || []).map(a =>
    `<button data-issue="${node.id}" data-role="${esc(a.role)}"
      class="dep-action-btn text-xs px-3 py-1.5 rounded bg-accent/20 text-accent hover:bg-accent/30 transition-colors">
      ${esc(a.label)}
    </button>`
  ).join('');

  const lifecycleLink = `<a href="${prefix}/lifecycle/${node.id}"
    class="text-xs px-3 py-1.5 rounded bg-gray-700/40 text-gray-400 hover:bg-gray-700/60">
    View Lifecycle
  </a>`;

  actions.innerHTML = actionBtns + lifecycleLink;
  drawer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function hideDrawer() {
  document.getElementById('action-drawer').classList.add('hidden');
}

async function spawnAgent(issue, role) {
  try {
    const r = await fetch(`${apiBase}/agents/start`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ issue: String(issue), role }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Spawn failed');
    hideDrawer();
    setTimeout(loadGraph, 1500);
  } catch (e) {
    alert(`Failed to start agent: ${e.message}`);
  }
}

// -- Decisions / Activity Stream --
async function loadDecisions() {
  const component = document.getElementById('filter-component').value;
  const eventType = document.getElementById('filter-type').value;
  const params = new URLSearchParams();
  if (component) params.set('component', component);
  if (eventType) params.set('event_type', eventType);

  try {
    const res = await fetch(`${apiBase}/supervisor/decisions?${params}`);
    const data = await res.json();
    const list = document.getElementById('decisions-list');

    if (!data.decisions || data.decisions.length === 0) {
      list.innerHTML = '<p class="text-xs text-gray-500 text-center py-4">No decisions logged yet</p>';
      return;
    }

    list.innerHTML = data.decisions.map(d => {
      const actionColor = d.action === 'error' ? 'text-accent-red' :
                          d.action === 'throttled' ? 'text-accent-yellow' :
                          d.event_type === 'decision' ? 'text-accent' : 'text-gray-400';
      const ts = d.created_at;
      const utcTs = ts && !ts.includes('+') && !ts.endsWith('Z') ? ts + 'Z' : ts;
      const time = utcTs ? new Date(utcTs).toLocaleTimeString() : '';
      const issue = d.issue_number ? `#${d.issue_number}` : '';
      return `<div class="flex items-start gap-3 py-1.5 px-2 rounded hover:bg-gray-700/20 text-xs">
        <span class="text-gray-600 shrink-0 w-16">${time}</span>
        <span class="text-gray-500 shrink-0 w-20">${esc(d.component)}</span>
        <span class="${actionColor} shrink-0 w-28">${esc(d.action)}${issue ? ` ${issue}` : ''}</span>
        <span class="text-gray-400 truncate">${esc(d.detail)}</span>
      </div>`;
    }).join('');
  } catch (e) {
    document.getElementById('decisions-list').innerHTML =
      '<p class="text-xs text-accent-red text-center py-4">Failed to load decisions</p>';
  }
}

// -- Manual poll --
async function triggerPoll() {
  const btn = document.getElementById('poll-btn');
  btn.disabled = true;
  btn.textContent = 'Polling...';
  try {
    await fetch(`${apiBase}/supervisor/poll`, { method: 'POST' });
    setTimeout(() => {
      loadDecisions(); loadQuota();
      _graphKey = null; // force graph refresh after manual poll
      loadGraph();
      btn.disabled = false;
      btn.textContent = 'Poll Now';
    }, 2000);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Poll Now';
  }
}

// -- Action button delegation (avoids inline onclick with data values in attributes) --
document.getElementById('action-drawer').addEventListener('click', e => {
  const btn = e.target.closest('.dep-action-btn');
  if (btn) spawnAgent(btn.dataset.issue, btn.dataset.role);
});

// -- Init --
loadStatus(); loadQuota(); loadGraph(); loadDecisions();

// Poll every 30s; loadGraph re-renders only when data changes
setInterval(() => { loadStatus(); loadQuota(); loadDecisions(); loadGraph(); }, 30000);

window.addEventListener('beforeunload', () => {
  if (_confirmPoll) { clearInterval(_confirmPoll); _confirmPoll = null; }
});
</script>
{% endblock %}
