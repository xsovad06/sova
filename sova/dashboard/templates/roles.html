{% extends "base.html" %}
{% block title %}Roles - SOVA{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
  <h2 class="text-2xl font-semibold">Roles</h2>
  <button onclick="showCreateModal()" class="text-sm px-4 py-2 rounded bg-accent/20 text-accent hover:bg-accent/30 transition-colors">New Role</button>
</div>

<div id="roles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
  <p class="text-gray-500 text-sm col-span-full">Loading roles...</p>
</div>

<!-- Create Role Modal -->
<div id="create-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
  <div class="bg-surface-card rounded-lg border border-gray-700/50 p-6 w-full max-w-md">
    <h3 class="text-lg font-semibold mb-4">Create Custom Role</h3>
    <div class="space-y-3">
      <div>
        <label for="new-role-name" class="text-xs text-gray-400 block mb-1">Name</label>
        <input type="text" id="new-role-name" class="w-full bg-surface text-sm text-gray-300 border border-gray-700/50 rounded px-3 py-2" placeholder="my-custom-role">
      </div>
      <div>
        <label for="new-role-desc" class="text-xs text-gray-400 block mb-1">Description</label>
        <input type="text" id="new-role-desc" class="w-full bg-surface text-sm text-gray-300 border border-gray-700/50 rounded px-3 py-2" placeholder="What this role does">
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-6">
      <button onclick="hideCreateModal()" class="text-sm px-4 py-2 rounded text-gray-400 hover:text-gray-200 transition-colors">Cancel</button>
      <button onclick="createRole()" class="text-sm px-4 py-2 rounded bg-accent text-white hover:bg-accent/80 transition-colors">Create</button>
    </div>
  </div>
</div>

<script>
const prefix = '{{ prefix|default("") }}';
const apiBase = prefix ? `${prefix}/api` : '/api';

const esc = window.escapeHtml || function(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
};

async function loadRoles() {
  try {
    const resp = await fetch(`${apiBase}/roles`);
    if (!resp.ok) throw new Error(`${resp.status}`);
    const data = await resp.json();
    renderRoles(data.roles || []);
  } catch (e) {
    document.getElementById('roles-grid').innerHTML = '<p class="text-accent-red text-sm col-span-full">Failed to load roles</p>';
  }
}

function renderRoles(roles) {
  const grid = document.getElementById('roles-grid');
  if (!roles.length) {
    grid.innerHTML = '<p class="text-gray-500 text-sm col-span-full">No roles found</p>';
    return;
  }

  grid.innerHTML = roles.map(r => {
    const isBuiltin = r.is_builtin;
    const nodeCount = (r.graph_json?.nodes || []).length;
    const edgeCount = (r.graph_json?.edges || []).length;
    const statesBadges = (r.input_states || []).map(s =>
      `<span class="inline-block px-1.5 py-0.5 text-[10px] rounded bg-accent-purple/20 text-accent-purple">${esc(s)}</span>`
    ).join(' ');
    const outputBadge = r.output_state
      ? `<span class="inline-block px-1.5 py-0.5 text-[10px] rounded bg-accent-green/20 text-accent-green">${esc(r.output_state)}</span>`
      : '';
    const typeBadge = isBuiltin
      ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-gray-600/50 text-gray-400">Built-in</span>'
      : '<span class="text-[10px] px-1.5 py-0.5 rounded bg-accent/20 text-accent">Custom</span>';

    const actions = isBuiltin
      ? `<a href="${prefix}/roles/${encodeURIComponent(r.name)}" class="text-xs text-gray-400 hover:text-gray-200 transition-colors">View</a>`
      : `<a href="${prefix}/roles/${encodeURIComponent(r.name)}" class="text-xs text-accent hover:text-blue-300 transition-colors">Edit</a>
         <button data-role="${esc(r.name)}" class="js-delete-role text-xs text-accent-red/60 hover:text-accent-red transition-colors">Delete</button>`;

    return `<div class="bg-surface-card rounded-lg border border-gray-700/50 p-4 flex flex-col">
      <div class="flex items-start justify-between mb-2">
        <div>
          <h3 class="text-sm font-medium text-gray-200">${esc(r.name)}</h3>
          <p class="text-xs text-gray-500 mt-0.5">${esc(r.description || 'No description')}</p>
        </div>
        ${typeBadge}
      </div>
      <div class="flex items-center gap-2 text-xs text-gray-500 mb-3">
        <span>${nodeCount} nodes</span>
        <span class="text-gray-700">|</span>
        <span>${edgeCount} edges</span>
      </div>
      <div class="flex flex-wrap gap-1 mb-3">
        ${statesBadges} ${outputBadge ? '&rarr; ' + outputBadge : ''}
      </div>
      <div class="mt-auto pt-3 border-t border-gray-700/30 flex items-center gap-3">
        ${actions}
      </div>
    </div>`;
  }).join('');
}

let createModalTrigger = null;

function getFocusableElements(container) {
  return Array.from(container.querySelectorAll(
    'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
  )).filter(el => !el.disabled);
}

function trapCreateModalFocus(event) {
  if (event.key !== 'Tab') return;

  const modal = document.getElementById('create-modal');
  const focusableElements = getFocusableElements(modal);
  if (!focusableElements.length) return;

  const first = focusableElements[0];
  const last = focusableElements[focusableElements.length - 1];

  if (!modal.contains(document.activeElement)) {
    event.preventDefault();
    first.focus();
    return;
  }

  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
}

function handleCreateModalKeydown(event) {
  if (event.key === 'Escape') {
    hideCreateModal();
    return;
  }

  trapCreateModalFocus(event);
}

function showCreateModal() {
  createModalTrigger = document.activeElement;
  const modal = document.getElementById('create-modal');
  modal.classList.remove('hidden');
  modal.setAttribute('tabindex', '-1');
  document.addEventListener('keydown', handleCreateModalKeydown);
  setTimeout(() => { document.getElementById('new-role-name').focus(); }, 0);
}

function hideCreateModal() {
  const modal = document.getElementById('create-modal');
  modal.classList.add('hidden');
  document.removeEventListener('keydown', handleCreateModalKeydown);

  if (createModalTrigger) {
    createModalTrigger.focus();
    createModalTrigger = null;
  }
}

async function createRole() {
  const name = document.getElementById('new-role-name').value.trim();
  const desc = document.getElementById('new-role-desc').value.trim();
  if (!name) return;

  const graph = {
    nodes: [{ id: 'n1', command: '', label: 'Start', position: { x: 200, y: 80 }, params: {} }],
    edges: []
  };

  try {
    const resp = await fetch(`${apiBase}/roles`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, description: desc, graph_json: graph, input_states: [], output_state: '' })
    });
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({ detail: 'Create failed' }));
      const detail = data.detail;
      const msg = typeof detail === 'string' ? detail : detail?.error || 'Create failed';
      if (window.showToast) showToast(msg, 'error');
      return;
    }
    hideCreateModal();
    window.location.href = `${prefix}/roles/${encodeURIComponent(name)}`;
  } catch (e) {
    if (window.showToast) showToast('Failed to create role', 'error');
  }
}

async function deleteRole(name) {
  var ok = await sovaConfirm('Delete role "' + name + '"?', { confirmText: 'Delete', confirmClass: 'danger' });
  if (!ok) return;
  try {
    const resp = await fetch(`${apiBase}/roles/${encodeURIComponent(name)}`, { method: 'DELETE' });
    if (!resp.ok) {
      if (window.showToast) showToast('Failed to delete role', 'error');
      return;
    }
    loadRoles();
  } catch (e) {
    if (window.showToast) showToast('Failed to delete role', 'error');
  }
}

document.addEventListener('click', function(e) {
  const btn = e.target.closest('.js-delete-role');
  if (btn) deleteRole(btn.dataset.role);
});

loadRoles();
</script>
{% endblock %}
