name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Decide whether this run needs the expensive suite. Expensive jobs
  # (Python Lint, Python Tests, Integration Test) gate their real work on
  # this so a documentation push does not burn CI minutes.
  #
  # Detection is DELTA-AWARE: it is not enough to ask whether the whole pull
  # request is documentation (on a code-carrying PR it never is, so that
  # question alone made every docs amend re-run the full suite). The detector
  # also compares against the last successful run of this workflow on this
  # branch, so a markdown-only push on top of already-green code is free.
  # See .github/scripts/detect-code-changes.sh for the full contract.
  #
  # These jobs are REQUIRED status checks in the main-protection ruleset,
  # so they must always run and report success. On a docs-only change the
  # job still runs, skips its expensive steps, and exits 0 so the required
  # check is satisfied without doing redundant work. A blanket
  # paths-ignore would instead skip the job entirely, leaving the required
  # check pending forever and blocking the merge.
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      # "true" when this run needs the expensive suite. "false" only on
      # positive evidence that nothing but markdown is at stake, either
      # across the whole pull request or since the last successful run of
      # this workflow on this branch. Every failure path yields "true".
      code: ${{ steps.decide.outputs.code }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      # Fetch the detector script itself from the BASE branch via the
      # contents API, rather than a full checkout at the base SHA: the script
      # only ever calls `gh api` (see its own header comment), so a full
      # working-tree checkout buys nothing. This trigger is `pull_request`,
      # not `pull_request_target`, so the base-branch fetch is only
      # defense-in-depth against a narrow tampering vector (a fork PR quietly
      # editing just the script), not full
      # immunity: under `pull_request`, GitHub already resolves this entire
      # workflow file from the fork's own head ref, so a fork PR can edit any
      # part of this job, including the `if:` gates below. That is the
      # existing security model for every `pull_request`-triggered job in
      # this file (none of them touch secrets or gain write access), not a
      # gap introduced here.
      #
      # A fetch failure (this script's own introducing PR, before it exists
      # on the base branch; a future PR that renames or deletes it) falls
      # back to the full suite rather than failing the job outright.
      - name: Fetch the detector from the base branch
        id: fetch-detector
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/detect-code-changes.sh"
          if gh api               "repos/${{ github.repository }}/contents/.github/scripts/detect-code-changes.sh?ref=${BASE_SHA}"               --jq '.content' | base64 -d > "$dest"; then
            chmod +x "$dest"
            echo "path=$dest" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::detector unavailable, running the full suite"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect code changes
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          WORKFLOW_FILE: ci.yml
          DETECTOR: ${{ steps.fetch-detector.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "$DETECTOR" ] || [ ! -x "$DETECTOR" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "reason=detector-unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          "$DETECTOR" detect >> "$GITHUB_OUTPUT"

  lint-static:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on bash scripts
        run: |
          shellcheck --severity=warning \
            invariants/*.sh \
            .github/scripts/*.sh

      - name: Check executable permissions
        run: |
          errors=0
          for f in invariants/*.sh .github/scripts/*.sh; do
            if [ ! -x "$f" ]; then
              echo "ERROR: $f is not executable"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors permission errors. Fix with: chmod +x <file>"
            exit 1
          fi
          echo "All scripts have correct permissions"

      - name: Check YAML frontmatter in all commands
        run: |
          errors=0
          for f in sova/commands/data/commands/*.md; do
            name=$(basename "$f")
            # Check file starts with ---
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "ERROR: $name missing frontmatter opening ---"
              errors=$((errors + 1))
              continue
            fi
            # Extract frontmatter (between first --- and second ---)
            frontmatter=$(awk 'NR==1{next} /^---$/{exit} {print}' "$f")
            # Check required fields
            for field in name description user-invocable; do
              if ! echo "$frontmatter" | grep -q "^${field}:"; then
                echo "ERROR: $name missing required field: $field"
                errors=$((errors + 1))
              fi
            done
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors frontmatter errors"
            exit 1
          fi
          echo "All $(find sova/commands/data/commands -name '*.md' | wc -l | tr -d ' ') commands have valid frontmatter"

  python-lint:
    name: Python Lint
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Documentation-only change (skipping lint)
        if: needs.changes.outputs.code == 'false'
        run: echo "No Python touched (${{ needs.changes.outputs.reason }}). Reporting success without re-running Ruff."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.code != 'false'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: needs.changes.outputs.code != 'false'
        with:
          python-version: "3.12"

      - name: Install Ruff
        if: needs.changes.outputs.code != 'false'
        run: pip install ruff

      - name: Ruff check
        if: needs.changes.outputs.code != 'false'
        run: ruff check sova/ tests/

      - name: Ruff format check
        if: needs.changes.outputs.code != 'false'
        run: ruff format --check sova/ tests/

  # Real work is skipped ONLY on an explicit docs-only signal
  # (needs.changes.outputs.code == 'false'). If the `changes` gate is skipped
  # or fails, its output is empty (not 'false'), so the suite runs (fail-open).
  # The job-level `if` uses always() so a failed `needs: changes` does not skip
  # the whole job (a skipped required check would strand the PR forever).
  #
  # Runs on push to main too (not just pull_request), uploading its
  # coverage-xml artifact: sonarcloud.yml's workflow_run trigger (#1187)
  # consumes that artifact instead of re-running the suite itself, so a push
  # to main needs this job's artifact just as much as a PR does.
  #
  # Matrixed over Python 3.12 and 3.14, but only on pull_request runs: a push
  # to main keeps the single 3.12 leg, so a routine merge does not pay for a
  # second interpreter whose only purpose is catching a regression before a
  # PR lands. GitHub appends "(<matrix value>)" to a matrixed job's own check
  # name, which would silently rename the "Python Tests" required status
  # check the main-protection ruleset matches by exact string and strand
  # every PR on "Expected: waiting for status". `python-test` below is a
  # separate, unmatrixed aggregator that alone keeps the "Python Tests" name
  # and required-check identity; this job does the real work under its own,
  # deliberately different name.
  python-test-matrix:
    name: Python Tests (py${{ matrix.python-version }})
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12", "3.14"]' || '["3.12"]') }}
    steps:
      - name: Documentation-only change (skipping tests)
        if: needs.changes.outputs.code == 'false'
        run: echo "Documentation-only change (${{ needs.changes.outputs.reason }}). Reporting success without re-running tests."

      # Pinned to the PR HEAD, not the default `pull_request` checkout (the
      # synthetic merge commit), because sonarcloud.yml analyzes
      # workflow_run.head_sha, which is the PR head. Measuring coverage on the
      # merge tree and reporting it against the head tree hands Sonar line
      # numbers from a revision it never analyzed, so coverage lands on the
      # wrong lines (or no lines) whenever main has moved under the PR. The
      # merge-result signal this gives up is not recovered before merge: the
      # `main-protection` ruleset deliberately keeps
      # strict_required_status_checks_policy off (see detect-code-changes.sh's
      # header comment), so a PR that is only behind main merges as it stands.
      # It is recovered after merge instead, by this same job running on the
      # push to main, where a semantic conflict between two individually
      # green PRs shows up as a red main. python-lint and integration still
      # check out the merge commit;
      # only python-test-matrix needs the head tree, since it is the only job
      # whose output (coverage.xml) sonarcloud.yml consumes against that exact
      # SHA. On a push to main there is no pull_request payload and this
      # resolves to github.sha, the default.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.code != 'false'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: needs.changes.outputs.code != 'false'
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Install exactly the versions pinned in uv.lock rather than whatever is
      # newest inside pyproject.toml's ranges today, so a third-party release
      # cannot change what CI tests without a commit. uv only turns the lock
      # into a pip constraints file; pip still does the install. --locked fails
      # this step when uv.lock is stale against pyproject.toml, so a dependency
      # edit cannot land without regenerating the lock (`uv lock`).
      - name: Install package
        if: needs.changes.outputs.code != 'false'
        run: |
          python -m pip install "uv==0.13.5"
          uv export --locked --extra dev --no-emit-project --no-hashes --format requirements.txt \
            -o "$RUNNER_TEMP/constraints.txt"
          pip install -c "$RUNNER_TEMP/constraints.txt" -e ".[dev]"

      # Shard across every runner core and use the sys.monitoring coverage core
      # (Python 3.12+, valid because no branch coverage is configured): measured
      # 11% overhead against 47% for the default tracer, at a line rate within
      # half a point of it. The 60s per-test cap raises pyproject's 30s global,
      # which worker contention on a slower runner breaches. `make test-ci` is
      # the single source of truth for this invocation (see AGENTS.md's "CI
      # test invocation"), so both matrix legs stay identical by construction.
      - name: Run tests with coverage
        if: needs.changes.outputs.code != 'false'
        run: make test-ci

      # On a documentation-only change no tests ran, so there is no
      # coverage.xml. The artifact is still published, carrying this marker
      # instead: sonarcloud.yml's required check has to tell "CI deliberately
      # produced no coverage" apart from "the coverage artifact could not be
      # downloaded", and the absence of an artifact cannot distinguish them.
      # Without the marker, an expired or failed download reported the quality
      # gate as green without SonarCloud having run at all. Restricted to the
      # 3.12 leg, like the upload below: the artifact is scoped to the whole
      # workflow run, not to one job, so a second leg publishing the same
      # `coverage-xml` name would collide with the first.
      - name: Write the no-coverage marker (documentation-only change)
        if: needs.changes.outputs.code == 'false' && matrix.python-version == '3.12'
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: echo "$REASON" > no-coverage.marker

      # if-no-files-found: error, not ignore. Neither path existing means the
      # test step ran and produced no coverage.xml, which is a real failure
      # that must not reach the scan job as a silent "docs-only" success.
      #
      # Gated to the 3.12 leg only (see the marker step above), never on the
      # detector: a failing "Run tests with coverage" on that leg still
      # reaches this step with nothing to upload, and `if-no-files-found:
      # error` is what turns that into the real failure, exactly as before
      # the matrix. A failing python-test-matrix job reports job conclusion
      # != success, which sonarcloud.yml's `CI_CONCLUSION != "success"` check
      # catches before it ever looks at whether the artifact downloaded.
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: |
            coverage.xml
            no-coverage.marker
          if-no-files-found: error

  # Unmatrixed aggregator that owns the "Python Tests" required-check
  # identity (see python-test-matrix's own comment for why the matrixed job
  # cannot hold that name itself). `if: always()` so it still runs and
  # reports even when python-test-matrix is skipped or fails, the same
  # fail-open contract every other required job follows; it reports the
  # matrix job's own aggregate result rather than re-deriving pass/fail.
  python-test:
    name: Python Tests
    needs: python-test-matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check matrix result
        run: |
          result="${{ needs.python-test-matrix.result }}"
          if [ "$result" != "success" ]; then
            echo "::error::python-test-matrix result was '$result'"
            exit 1
          fi
          echo "python-test-matrix succeeded"

  integration:
    name: Integration Test
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Documentation-only change (skipping integration test)
        if: needs.changes.outputs.code == 'false'
        run: echo "Documentation-only change (${{ needs.changes.outputs.reason }}). Reporting success without re-running integration."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.code != 'false'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: needs.changes.outputs.code != 'false'
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Build wheel
        if: needs.changes.outputs.code != 'false'
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - name: Install wheel into an isolated venv
        if: needs.changes.outputs.code != 'false'
        run: |
          # A dedicated venv, not the runner's own Python, so this installs and
          # tests the actual built wheel rather than silently reusing an
          # editable dev install (or its egg-link) already on sys.path.
          python -m venv /tmp/sova-wheel-venv
          /tmp/sova-wheel-venv/bin/pip install --upgrade pip
          /tmp/sova-wheel-venv/bin/pip install dist/*.whl
          echo "/tmp/sova-wheel-venv/bin" >> "$GITHUB_PATH"

      - name: Verify CLI entrypoint
        if: needs.changes.outputs.code != 'false'
        run: |
          sova --version
          sova --help

      - name: Verify packaged resources ship in the wheel
        if: needs.changes.outputs.code != 'false'
        run: |
          # Resolved from outside the checkout: `python -c` puts the current
          # directory on sys.path, so running this from the repo root would
          # import the source tree instead of the wheel and every assertion
          # below would pass no matter what the wheel actually contains.
          site_packages=$(cd /tmp && python -c "import sova, pathlib; print(pathlib.Path(sova.__file__).parent)")
          case "$site_packages" in
            "${GITHUB_WORKSPACE:?}"*)
              echo "Resolved the checkout, not the wheel: $site_packages" >&2
              exit 1
              ;;
          esac
          # Compare each resource tree in BOTH directions. A one-sided
          # `test -d`/`test -f` spot check passes while the wheel ships a
          # single command and omits the other 27, or ships empty guideline,
          # skill and persona directories. A file the source tree has and the
          # wheel lacks means `[tool.setuptools.package-data]` is missing a
          # glob; a file only the wheel has is a stale artifact of an earlier
          # build that `python -m build` did not clean.
          status=0
          for root in commands/data core/schemas dashboard/static dashboard/templates; do
            slug=${root//\//-}
            src="/tmp/resources-src-$slug.txt"
            whl="/tmp/resources-wheel-$slug.txt"
            git -C "$GITHUB_WORKSPACE" ls-files "sova/$root" \
              | sed "s|^sova/$root/||" | LC_ALL=C sort >"$src"
            if [ ! -s "$src" ]; then
              echo "No tracked files under sova/$root: this check is comparing nothing" >&2
              exit 1
            fi
            if [ ! -d "$site_packages/$root" ]; then
              echo "Wheel is missing sova/$root entirely" >&2
              status=1
              continue
            fi
            find "$site_packages/$root" -type f -not -path '*/__pycache__/*' -print \
              | sed "s|^$site_packages/$root/||" | LC_ALL=C sort >"$whl"
            if ! diff -u "$src" "$whl"; then
              echo "sova/$root differs between the source tree and the wheel (see diff above)" >&2
              status=1
            fi
          done
          exit "$status"

      - name: Install into a test repo
        if: needs.changes.outputs.code != 'false'
        run: |
          tmp=$(mktemp -d)
          git init "$tmp/test-project"
          sova install "$tmp/test-project"

          # Verify install artifacts
          test -d "$tmp/test-project/.claude"
          test -d "$tmp/test-project/.claude/commands"
          test -d "$tmp/test-project/.claude/agent-memory"
          test -f "$tmp/test-project/.claude/sova.db"

          # Every packaged command must land in the project, and the project
          # must gain nothing the wheel does not carry. A `-gt 0` count passes
          # when 27 of 28 commands silently fail to render. No canonical
          # command declares a `runtimes:` filter today, so the two sets are
          # expected to match exactly; adding such a filter means updating
          # this comparison in the same change.
          site_packages=$(cd /tmp && python -c "import sova, pathlib; print(pathlib.Path(sova.__file__).parent)")
          find "$site_packages/commands/data/commands" -maxdepth 1 -name '*.md' \
            -printf '%f\n' | LC_ALL=C sort >/tmp/commands-packaged.txt
          find "$tmp/test-project/.claude/commands" -maxdepth 1 -name '*.md' \
            -printf '%f\n' | LC_ALL=C sort >/tmp/commands-installed.txt
          if ! diff -u /tmp/commands-packaged.txt /tmp/commands-installed.txt; then
            echo "Installed commands do not match the packaged set (see diff above)" >&2
            exit 1
          fi

          # Config is now DB-backed; verify project_settings table has rows
          count=$(sqlite3 "$tmp/test-project/.claude/sova.db" "SELECT COUNT(*) FROM project_settings;")
          test "$count" -gt 0

          echo "Integration test passed"

  # Secrets scanning runs on EVERY change (including docs-only PRs). A leaked
  # credential in a markdown file is still a leak. Not gated on the `changes`
  # job. Scans git history via `gitleaks git`, matching the pre-push hook.
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # full history so gitleaks git can scan all commits

      # Checksum verified (not just downloaded over TLS) before the tarball is
      # ever extracted: TLS authenticates the connection to GitHub, not that
      # the release asset itself is the one gitleaks actually published. A
      # mismatch fails the job (`sha256sum -c -`'s own exit code), matching
      # this repo's fail-closed convention elsewhere (see bash-patterns.md).
      # The hash must be bumped alongside GITLEAKS_VERSION on every upgrade;
      # read it from https://github.com/gitleaks/gitleaks/releases, asset
      # `gitleaks_<version>_checksums.txt`.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks git . --log-opts="HEAD" --no-banner --redact --config .gitleaks.toml

  invariants:
    name: Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin main:refs/remotes/origin/main || true

      - name: Run invariant checks
        run: |
          errors=0
          for script in invariants/*.sh; do
            name=$(basename "$script" .sh)
            echo "--- $name ---"
            if bash "$script" . main; then
              echo "  PASS"
            else
              echo "  FAIL"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "=== $errors invariant(s) failed ==="
            exit 1
          fi
          echo "=== All invariants passed ==="
