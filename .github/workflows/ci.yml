name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'personas/**'
      - 'knowledge/**'
      - 'assets/**'
      - 'guidelines/**'
      - 'skills/**'
      - 'templates/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'personas/**'
      - 'knowledge/**'
      - 'assets/**'
      - 'guidelines/**'
      - 'skills/**'
      - 'templates/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  lint-static:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on invariant scripts
        run: |
          shellcheck --severity=warning \
            invariants/*.sh

      - name: Check executable permissions
        run: |
          errors=0
          for f in invariants/*.sh; do
            if [ ! -x "$f" ]; then
              echo "ERROR: $f is not executable"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors permission errors. Fix with: chmod +x <file>"
            exit 1
          fi
          echo "All scripts have correct permissions"

      - name: Check YAML frontmatter in all commands
        run: |
          errors=0
          for f in commands/*.md; do
            name=$(basename "$f")
            # Check file starts with ---
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "ERROR: $name missing frontmatter opening ---"
              errors=$((errors + 1))
              continue
            fi
            # Extract frontmatter (between first --- and second ---)
            frontmatter=$(awk 'NR==1{next} /^---$/{exit} {print}' "$f")
            # Check required fields
            for field in name description user-invocable; do
              if ! echo "$frontmatter" | grep -q "^${field}:"; then
                echo "ERROR: $name missing required field: $field"
                errors=$((errors + 1))
              fi
            done
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors frontmatter errors"
            exit 1
          fi
          echo "All $(find commands -name '*.md' | wc -l | tr -d ' ') commands have valid frontmatter"

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check sova/ tests/

      - name: Ruff format check
        run: ruff format --check sova/ tests/

  python-test:
    name: Python Tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install package
        run: pip install .

      - name: Verify CLI entrypoint
        run: sova --help

      - name: Install into a test repo
        run: |
          tmp=$(mktemp -d)
          git init "$tmp/test-project"
          sova install "$tmp/test-project"

          # Verify install artifacts
          test -f "$tmp/test-project/sova.toml"
          test -d "$tmp/test-project/.claude"
          test -d "$tmp/test-project/.claude/commands"
          test -d "$tmp/test-project/.claude/agent-memory"
          test -f "$tmp/test-project/.claude/sova.db"

          echo "Integration test passed"

  invariants:
    name: Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin main:refs/remotes/origin/main || true

      - name: Run invariant checks
        run: |
          errors=0
          for script in invariants/*.sh; do
            name=$(basename "$script" .sh)
            echo "--- $name ---"
            if bash "$script" . main; then
              echo "  PASS"
            else
              echo "  FAIL"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "=== $errors invariant(s) failed ==="
            exit 1
          fi
          echo "=== All invariants passed ==="
