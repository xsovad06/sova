name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on invariant scripts
        run: |
          shellcheck --severity=warning \
            invariants/*.sh

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check sova/ tests/

      - name: Ruff format check
        run: ruff format --check sova/ tests/

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  validate-commands:
    name: Validate Commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check YAML frontmatter in all commands
        run: |
          errors=0
          for f in commands/*.md; do
            name=$(basename "$f")
            # Check file starts with ---
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "ERROR: $name missing frontmatter opening ---"
              errors=$((errors + 1))
              continue
            fi
            # Extract frontmatter (between first --- and second ---)
            frontmatter=$(awk 'NR==1{next} /^---$/{exit} {print}' "$f")
            # Check required fields
            for field in name description user-invocable; do
              if ! echo "$frontmatter" | grep -q "^${field}:"; then
                echo "ERROR: $name missing required field: $field"
                errors=$((errors + 1))
              fi
            done
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors frontmatter errors"
            exit 1
          fi
          echo "All $(find commands -name '*.md' | wc -l | tr -d ' ') commands have valid frontmatter"

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install .

      - name: Verify CLI entrypoint
        run: sova --help

      - name: Install into a test repo
        run: |
          tmp=$(mktemp -d)
          git init "$tmp/test-project"
          sova install "$tmp/test-project"

          # Verify install artifacts
          test -f "$tmp/test-project/sova.toml"
          test -d "$tmp/test-project/.claude"
          test -d "$tmp/test-project/.claude/commands"
          test -d "$tmp/test-project/.claude/agent-memory"
          test -f "$tmp/test-project/.claude/sova.db"

          echo "Integration test passed"

  permissions:
    name: File Permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check executable permissions
        run: |
          errors=0
          for f in invariants/*.sh; do
            if [ ! -x "$f" ]; then
              echo "ERROR: $f is not executable"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors permission errors. Fix with: chmod +x <file>"
            exit 1
          fi
          echo "All scripts have correct permissions"
