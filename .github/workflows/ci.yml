name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Decide whether this run needs the expensive suite. Expensive jobs
  # (Python Lint, Python Tests, Integration Test) gate their real work on
  # this so a documentation push does not burn CI minutes.
  #
  # Detection is DELTA-AWARE: it is not enough to ask whether the whole pull
  # request is documentation (on a code-carrying PR it never is, so that
  # question alone made every docs amend re-run the full suite). The detector
  # also compares against the last successful run of this workflow on this
  # branch, so a markdown-only push on top of already-green code is free.
  # See .github/scripts/detect-code-changes.sh for the full contract.
  #
  # These jobs are REQUIRED status checks in the main-protection ruleset,
  # so they must always run and report success. On a docs-only change the
  # job still runs, skips its expensive steps, and exits 0 so the required
  # check is satisfied without doing redundant work. A blanket
  # paths-ignore would instead skip the job entirely, leaving the required
  # check pending forever and blocking the merge.
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      # "true" when this run needs the expensive suite. "false" only on
      # positive evidence that nothing but markdown is at stake, either
      # across the whole pull request or since the last successful run of
      # this workflow on this branch. Every failure path yields "true".
      code: ${{ steps.decide.outputs.code }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      # Fetch the detector script itself from the BASE branch via the
      # contents API, rather than a full checkout at the base SHA. Two
      # reasons: the script only ever calls `gh api` (see its own header
      # comment), so a full working-tree checkout buys nothing; and this
      # matches sonarcloud.yml's identical fetch step, so both workflows
      # trust the same script the same way instead of two different
      # mechanisms. This trigger is `pull_request`, not `pull_request_target`,
      # so unlike sonarcloud.yml this is defense-in-depth against a narrower
      # tampering vector (a fork PR quietly editing only the script), not full
      # immunity: under `pull_request`, GitHub already resolves this entire
      # workflow file from the fork's own head ref, so a fork PR can edit any
      # part of this job, including the `if:` gates below. That is the
      # existing security model for every `pull_request`-triggered job in
      # this file (none of them touch secrets or gain write access), not a
      # gap introduced here.
      #
      # A fetch failure (this script's own introducing PR, before it exists
      # on the base branch; a future PR that renames or deletes it) falls
      # back to the full suite rather than failing the job outright.
      - name: Fetch the detector from the base branch
        id: fetch-detector
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/detect-code-changes.sh"
          if gh api               "repos/${{ github.repository }}/contents/.github/scripts/detect-code-changes.sh?ref=${BASE_SHA}"               --jq '.content' | base64 -d > "$dest"; then
            chmod +x "$dest"
            echo "path=$dest" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::detector unavailable, running the full suite"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect code changes
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          WORKFLOW_FILE: ci.yml
          DETECTOR: ${{ steps.fetch-detector.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "$DETECTOR" ] || [ ! -x "$DETECTOR" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "reason=detector-unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          "$DETECTOR" detect >> "$GITHUB_OUTPUT"

  lint-static:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on bash scripts
        run: |
          shellcheck --severity=warning \
            invariants/*.sh \
            .github/scripts/*.sh

      - name: Check executable permissions
        run: |
          errors=0
          for f in invariants/*.sh .github/scripts/*.sh; do
            if [ ! -x "$f" ]; then
              echo "ERROR: $f is not executable"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors permission errors. Fix with: chmod +x <file>"
            exit 1
          fi
          echo "All scripts have correct permissions"

      - name: Check YAML frontmatter in all commands
        run: |
          errors=0
          for f in commands/*.md; do
            name=$(basename "$f")
            # Check file starts with ---
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "ERROR: $name missing frontmatter opening ---"
              errors=$((errors + 1))
              continue
            fi
            # Extract frontmatter (between first --- and second ---)
            frontmatter=$(awk 'NR==1{next} /^---$/{exit} {print}' "$f")
            # Check required fields
            for field in name description user-invocable; do
              if ! echo "$frontmatter" | grep -q "^${field}:"; then
                echo "ERROR: $name missing required field: $field"
                errors=$((errors + 1))
              fi
            done
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors frontmatter errors"
            exit 1
          fi
          echo "All $(find commands -name '*.md' | wc -l | tr -d ' ') commands have valid frontmatter"

  python-lint:
    name: Python Lint
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change (skipping lint)
        if: needs.changes.outputs.code == 'false'
        run: echo "No Python touched (${{ needs.changes.outputs.reason }}). Reporting success without re-running Ruff."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.code != 'false'

      - uses: actions/setup-python@v5
        if: needs.changes.outputs.code != 'false'
        with:
          python-version: "3.12"

      - name: Install Ruff
        if: needs.changes.outputs.code != 'false'
        run: pip install ruff

      - name: Ruff check
        if: needs.changes.outputs.code != 'false'
        run: ruff check sova/ tests/

      - name: Ruff format check
        if: needs.changes.outputs.code != 'false'
        run: ruff format --check sova/ tests/

  # Real work is skipped ONLY on an explicit docs-only signal
  # (needs.changes.outputs.code == 'false'). If the `changes` gate is skipped
  # or fails, its output is empty (not 'false'), so the suite runs -- fail-open.
  # The job-level `if` uses always() so a failed `needs: changes` does not skip
  # the whole job (a skipped required check would strand the PR forever).
  python-test:
    name: Python Tests
    needs: changes
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change (skipping tests)
        if: needs.changes.outputs.code == 'false'
        run: echo "Documentation-only change (${{ needs.changes.outputs.reason }}). Reporting success without re-running tests."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.code != 'false'

      - uses: actions/setup-python@v5
        if: needs.changes.outputs.code != 'false'
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install package
        if: needs.changes.outputs.code != 'false'
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        if: needs.changes.outputs.code != 'false'
        run: pytest tests/ -v --cov=sova --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: needs.changes.outputs.code != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    name: Integration Test
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change (skipping integration test)
        if: needs.changes.outputs.code == 'false'
        run: echo "Documentation-only change (${{ needs.changes.outputs.reason }}). Reporting success without re-running integration."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.code != 'false'

      - uses: actions/setup-python@v5
        if: needs.changes.outputs.code != 'false'
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install package
        if: needs.changes.outputs.code != 'false'
        run: pip install .

      - name: Verify CLI entrypoint
        if: needs.changes.outputs.code != 'false'
        run: sova --help

      - name: Install into a test repo
        if: needs.changes.outputs.code != 'false'
        run: |
          tmp=$(mktemp -d)
          git init "$tmp/test-project"
          sova install "$tmp/test-project"

          # Verify install artifacts
          test -d "$tmp/test-project/.claude"
          test -d "$tmp/test-project/.claude/commands"
          test -d "$tmp/test-project/.claude/agent-memory"
          test -f "$tmp/test-project/.claude/sova.db"
          # Config is now DB-backed; verify project_settings table has rows
          count=$(sqlite3 "$tmp/test-project/.claude/sova.db" "SELECT COUNT(*) FROM project_settings;")
          test "$count" -gt 0

          echo "Integration test passed"

  # Secrets scanning runs on EVERY change (including docs-only PRs) -- a leaked
  # credential in a markdown file is still a leak. Not gated on the `changes`
  # job. Scans git history via `gitleaks git`, matching the pre-push hook.
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks git can scan all commits

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks git . --no-banner --redact --config .gitleaks.toml

  invariants:
    name: Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin main:refs/remotes/origin/main || true

      - name: Run invariant checks
        run: |
          errors=0
          for script in invariants/*.sh; do
            name=$(basename "$script" .sh)
            echo "--- $name ---"
            if bash "$script" . main; then
              echo "  PASS"
            else
              echo "  FAIL"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "=== $errors invariant(s) failed ==="
            exit 1
          fi
          echo "=== All invariants passed ==="
