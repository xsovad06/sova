name: SonarCloud

on:
  # pull_request_target runs in the base repo context so secrets are
  # available even for PRs from forks. The workflow YAML always comes
  # from the base branch (tamper-proof). Coverage (pip install + pytest)
  # runs on fork code; secrets are scoped to individual steps.
  pull_request_target:
    branches: [main]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      # Required by the detector to read this workflow's own past runs and
      # find the last successful one to compare against.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For fork PRs: analyze the PR head, not the base branch
          ref: ${{ github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      # Decide whether this run needs the coverage run and the scan.
      #
      # Detection is DELTA-AWARE: asking only "is the whole pull request
      # documentation" can never be true on a code-carrying PR, so that
      # question alone made every documentation amend re-run the full
      # 15-minute analysis. The detector also compares against the last
      # successful run of this workflow on this branch, so a markdown-only
      # push on top of already-green code is free.
      #
      # The script is fetched from the BASE branch through the API into
      # RUNNER_TEMP, never read from the head checkout in the workspace:
      # under pull_request_target a fork must not be able to edit the script
      # that decides whether its own code gets scanned. Every failure path
      # inside the script fails open (code=true).
      # A push event has no PR diff base, so detect() always returns
      # code=true/non-pr regardless of what the fetch below would find.
      # Skip the fetch entirely for push, rather than spending an API call
      # and a RUNNER_TEMP write on a result that is thrown away unused.
      - name: Fetch the detector from the base branch
        id: fetch-detector
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/detect-code-changes.sh"
          if gh api \
              "repos/${{ github.repository }}/contents/.github/scripts/detect-code-changes.sh?ref=${BASE_SHA}" \
              --jq '.content' | base64 -d > "$dest"; then
            chmod +x "$dest"
            echo "path=$dest" >> "$GITHUB_OUTPUT"
          else
            # Could not fetch the trusted copy: fall through to the full run.
            echo "::warning::detector unavailable, running the full analysis"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect code changes
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          WORKFLOW_FILE: sonarcloud.yml
          DETECTOR: ${{ steps.fetch-detector.outputs.path }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request_target" ]; then
            # Matches detect()'s own non-pr outcome; the fetch step above was
            # skipped for exactly this case, so DETECTOR is empty here too.
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "reason=non-pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$DETECTOR" ] || [ ! -x "$DETECTOR" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "reason=detector-unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          "$DETECTOR" detect >> "$GITHUB_OUTPUT"

      - name: Documentation-only change (skipping SonarCloud)
        if: steps.changes.outputs.code != 'true'
        run: echo "Documentation-only change (${{ steps.changes.outputs.reason }}). Reporting success without re-running coverage or scan."

      # Coverage for push and pull_request_target events, only when code changed.
      # pull_request_target uses the workflow from main (tamper-proof)
      # and SONAR_TOKEN is scoped to its own step.
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.code == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request_target')
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install package with test dependencies
        if: steps.changes.outputs.code == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request_target')
        run: pip install -e ".[dev]" pytest-cov pytest-timeout

      - name: Run tests with coverage
        if: steps.changes.outputs.code == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request_target')
        run: pytest tests/ --cov=sova --cov-report=xml -q --timeout=60

      - name: Find associated PR
        id: find-pr
        if: steps.changes.outputs.code == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" != "main" ]; then
            PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number // empty' 2>/dev/null || echo '')
            echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "base=main" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check SONAR_TOKEN is available
        id: check-token
        if: steps.changes.outputs.code == 'true'
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SONAR_TOKEN not set -- skipping SonarCloud scan"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Scan
        if: steps.changes.outputs.code == 'true' && steps.check-token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.python.coverage.reportPaths=coverage.xml
            ${{ steps.find-pr.outputs.number != '' && format(
              '-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}',
              steps.find-pr.outputs.number,
              steps.find-pr.outputs.head,
              steps.find-pr.outputs.base
            ) || '' }}
