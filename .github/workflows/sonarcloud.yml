name: SonarCloud

on:
  # pull_request_target runs in the base repo context so secrets are
  # available even for PRs from forks. The workflow YAML always comes
  # from the base branch (tamper-proof). Coverage (pip install + pytest)
  # runs on fork code; secrets are scoped to individual steps.
  pull_request_target:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'personas/**'
      - 'knowledge/**'
      - 'assets/**'
      - 'guidelines/**'
      - 'skills/**'
      - 'templates/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'personas/**'
      - 'knowledge/**'
      - 'assets/**'
      - 'guidelines/**'
      - 'skills/**'
      - 'templates/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For fork PRs: analyze the PR head, not the base branch
          ref: ${{ github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      # Coverage for push and pull_request_target events.
      # pull_request_target uses the workflow from main (tamper-proof)
      # and SONAR_TOKEN is scoped to its own step.
      - uses: actions/setup-python@v5
        if: github.event_name == 'push' || github.event_name == 'pull_request_target'
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install package with test dependencies
        if: github.event_name == 'push' || github.event_name == 'pull_request_target'
        run: pip install -e ".[dev]" pytest-cov pytest-timeout

      - name: Run tests with coverage
        if: github.event_name == 'push' || github.event_name == 'pull_request_target'
        run: pytest tests/ --cov=sova --cov-report=xml -q --timeout=60

      - name: Find associated PR
        id: find-pr
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" != "main" ]; then
            PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number // empty' 2>/dev/null || echo '')
            echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "base=main" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check SONAR_TOKEN is available
        id: check-token
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SONAR_TOKEN not set -- skipping SonarCloud scan"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Scan
        if: steps.check-token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            ${{ steps.find-pr.outputs.number != '' && format(
              '-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}',
              steps.find-pr.outputs.number,
              steps.find-pr.outputs.head,
              steps.find-pr.outputs.base
            ) || '' }}
