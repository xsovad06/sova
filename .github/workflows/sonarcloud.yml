name: SonarCloud

on:
  # pull_request_target runs in the base repo context so secrets are
  # available even for PRs from forks. Safe because the workflow YAML
  # always comes from the base branch (tamper-proof) and we never
  # execute code from the PR (no pip install / pytest on fork PRs).
  pull_request_target:
    branches: [main]
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For fork PRs: analyze the PR head, not the base branch
          ref: ${{ github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      # Coverage only for push events (trusted code).
      # Fork PRs get static analysis (bugs, smells, security, duplication)
      # without coverage -- we never execute untrusted code with secrets.
      - uses: actions/setup-python@v5
        if: github.event_name == 'push'
        with:
          python-version: "3.12"

      - name: Install package with test dependencies
        if: github.event_name == 'push'
        run: pip install -e ".[dev]" pytest-cov

      - name: Run tests with coverage
        if: github.event_name == 'push'
        run: pytest tests/ --cov=sova --cov-report=xml -q

      - name: Check SONAR_TOKEN is available
        id: check-token
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SONAR_TOKEN not set -- skipping SonarCloud scan"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Scan
        if: steps.check-token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
