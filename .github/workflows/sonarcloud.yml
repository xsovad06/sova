name: SonarCloud

# Triggered by the CI workflow's completion rather than pull_request_target or
# push directly (issue #1187). This lets the scan reuse the coverage report
# CI already produced instead of re-running the whole test suite a second
# time just to generate sonar.python.coverage.reportPaths input: that
# duplication was costing a second ~15 minute run on every PR and push.
#
# workflow_run always executes in the context of this (base) repository, even
# when the triggering CI run came from a fork PR, so SONAR_TOKEN and
# GITHUB_TOKEN are available here exactly as they were for the former
# pull_request_target trigger. No fork code is EXECUTED in this job: the
# checkout below is read-only input to a static scan. It is still fork
# CONTENT, though, and the scanner reads `sonar-project.properties` out of
# that workspace, so the one property that decides where the authenticated
# analysis is uploaded is pinned on the scan step itself (see SONAR_HOST_URL
# there) rather than trusted from the checkout.
#
# Because this job runs as a different workflow than the PR's own checks, the
# automatic job-status check GitHub reports for it lands on this workflow's
# own trigger commit (the default branch tip), not the PR head, so it can
# never satisfy branch protection. The required "SonarCloud Analysis" check is
# created and completed explicitly via the Checks API instead, targeting
# workflow_run.head_sha, so it reports on the commit branch protection
# actually evaluates. The job is named something else on purpose so that
# automatic check cannot shadow this one (see the job's own comment).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Keyed on the triggering run's head REPOSITORY and branch, and (as before
# this moved to workflow_run) a push is never cancelled: two merges landing on
# main in quick succession can have their CI runs finish out of order, and
# cancelling the newer commit's scan because the older one's arrived late would
# leave main analyzed at the older tree and report `failure` for a commit never
# scanned.
#
# The repository half matters because head_branch is a bare branch name with no
# owner in it: a fork PR from `someone/sova:main` would otherwise share a group
# with this repo's own `main` push, and since every non-push run sets
# cancel-in-progress, that fork's scan would cancel the push's. A cancelled run
# reports the required check as `cancelled` (or, if it is cancelled before the
# first step creates it, leaves it uncreated), either of which blocks the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: ${{ github.event.workflow_run.event != 'push' }}

jobs:
  sonarcloud:
    # Deliberately NOT "SonarCloud Analysis": GitHub creates an automatic check
    # run named after the job, and on a push to main that check lands on the
    # same commit as the explicit one created below. Sharing the name would put
    # two same-named checks on one commit, and since the scan runs under
    # continue-on-error the automatic one reports success even when the quality
    # gate failed. The required check name belongs to the Checks API call alone.
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    steps:
      # FIRST step in the job, before anything that can fail. The terminal
      # reporter below is gated on this step's output, so any step that ran
      # ahead of it and failed would abort the job with no check created at
      # all, leaving the required check unreported ("Expected: waiting for
      # status") and the PR blocked just as surely as leaving it pending.
      - name: Create pending check run
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXTERNAL_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Retried: a failure here leaves steps.check.outputs.id empty, which
          # skips the terminal reporter too (it is gated on that output), so a
          # transient API error would otherwise strand the PR on "Expected:
          # waiting for status" with no self-healing path.
          id=""
          for attempt in 1 2 3; do
            if id=$(gh api "repos/${REPO}/check-runs" -X POST \
              -f name="SonarCloud Analysis" \
              -f head_sha="${HEAD_SHA}" \
              -f status=in_progress \
              -f details_url="${DETAILS_URL}" \
              -f external_id="${EXTERNAL_ID}" \
              --jq '.id'); then
              break
            fi
            id=""
            echo "::warning::attempt ${attempt} to create the pending check run failed"
            sleep $((attempt * 5))
          done
          if [ -z "$id" ]; then
            echo "::error::could not create the pending check run after 3 attempts"
            exit 1
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      # workflow_run.pull_requests is empty for fork PRs (a documented GitHub
      # limitation), so the PR is resolved from the head commit instead, via
      # the same commits/{sha}/pulls lookup for same-repo and fork PRs alike.
      #
      # Gated on the ORIGINAL event being `pull_request`, because
      # commits/{sha}/pulls is documented to return the MERGED pull request a
      # commit arrived in once that commit is on the default branch. Running it
      # unconditionally meant every post-merge push to main resolved the PR
      # that had just been merged and was then analyzed with
      # -Dsonar.pullrequest.* parameters, decorating an already-closed PR
      # instead of updating main's own branch analysis. A push (and a manual
      # workflow_dispatch of CI) leaves every output empty and falls through to
      # the branch-analysis parameters below.
      #
      # Among the pull requests the lookup does return, only an OPEN one whose
      # own head is this exact commit describes the analysis being run; the
      # `// .[0]` tail keeps an open PR whose head has moved on (a force-push
      # landing between CI finishing and this scan starting) rather than
      # silently degrading that PR to branch analysis. A lookup FAILURE is a
      # hard error, never an empty result: `|| echo '[]'` would have turned a
      # transient GitHub outage into a spurious `sonar.branch.name` analysis of
      # a PR branch.
      #
      # An empty resolution (no open PR found for this head) is retried up to
      # 3 times with a short pause: commits/{sha}/pulls can lag just after a
      # PR is opened, and treating that transient lag the same as "genuinely
      # no PR" would make the pr-guard step below fail a brand-new PR's check.
      - name: Resolve PR for this run's head commit
        id: pr
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr="{}"
          for attempt in 1 2 3; do
            if ! pulls="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls")"; then
              echo "::error::Could not list pull requests for ${HEAD_SHA}"
              exit 1
            fi
            open="$(jq -c '[.[] | select(.state == "open")]' <<<"$pulls")"
            pr="$(jq -c --arg sha "$HEAD_SHA" \
              '[.[] | select(.head.sha == $sha)][0] // .[0] // {}' <<<"$open")"
            if [ -n "$(jq -r '.number // empty' <<<"$pr")" ] || [ "$attempt" = 3 ]; then
              break
            fi
            echo "::notice::no open PR found for ${HEAD_SHA} on attempt ${attempt}; retrying in case the commits/pulls index is lagging"
            sleep 1
          done
          {
            echo "number=$(jq -r '.number // empty' <<<"$pr")"
            echo "head=$(jq -r '.head.ref // empty' <<<"$pr")"
            echo "base=$(jq -r '.base.ref // empty' <<<"$pr")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: github.event.workflow_run.conclusion == 'success'
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Guarded with continue-on-error so the terminal reporter below, not an
      # aborted job, decides what a failed download means. It means FAILURE:
      # ci.yml publishes the coverage-xml artifact on every run of its
      # python-test job, carrying a no-coverage.marker instead of a
      # coverage.xml on the documentation-only path, so "the artifact is
      # missing" is never the intended docs-only case. An expired or
      # unreachable artifact is a scan that did not happen, and reporting the
      # required check green for it would pass the quality gate without
      # SonarCloud ever running.
      - name: Download coverage report from the triggering CI run
        id: artifact
        if: github.event.workflow_run.conclusion == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # Which of the two shapes arrived decides everything downstream: a real
      # coverage.xml is scanned, the marker is an intentional skip. This is
      # read off the downloaded files rather than inferred from the download's
      # own outcome, which cannot tell "CI had nothing to measure" from "the
      # artifact could not be fetched".
      - name: Classify the downloaded artifact
        id: coverage
        if: steps.artifact.outcome == 'success'
        run: |
          set -euo pipefail
          if [ -f coverage.xml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CI published no coverage (documentation-only change); skipping the scan"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # A docs-only commit's "no coverage to scan" success has to be justified
      # by a green SonarCloud run, not just a green CI run: ci.yml's baseline
      # for the docs-only skip is the last successful run of CI ITSELF, which
      # succeeds independently of the SonarCloud quality gate. Without this
      # check, pushing a code commit whose quality gate fails and then
      # amending with a docs-only commit (exactly what /address-pr's cycle and
      # a force-push amend both do) flips the required check green on the
      # unresolved gate: CI run 2 sees a markdown-only tree delta from CI run
      # 1 (which succeeded) and reports code=false, so this job never
      # consults the actual SonarCloud verdict from run 1 at all. This looks
      # up the most recent earlier successful ci.yml run on this branch (the
      # run the detector would have compared against; a layer-1
      # `docs-only-pr` skip has no detector baseline at all, so this check is
      # strictly more conservative there) and reads THAT commit's own
      # SonarCloud check, mirroring its verdict instead of hardcoding success.
      #
      # `gh api` switches from GET to POST as soon as any -f/-F parameter is
      # given, so --method GET must be explicit here, and `--jq --arg` is not
      # valid syntax (the flag takes exactly one expression and no --arg); the
      # sha is instead passed to a separate `jq --arg` invocation over the
      # captured response. Each `gh api` call's exit status is captured
      # explicitly rather than allowed to abort under `set -e`, but a failure
      # is never read as "no baseline": verdict=unknown is written instead,
      # and the terminal reporter treats "unknown" as a failure (fail
      # closed), the same as an in-progress baseline check, since a lookup
      # that could not complete proves nothing about the gate.
      - name: Resolve baseline verdict for docs-only skip
        id: baseline
        if: steps.coverage.outputs.present == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
        run: |
          set -uo pipefail
          if ! runs="$(gh api --method GET \
            -f "branch=${HEAD_BRANCH}" \
            -f status=success \
            -f "event=${EVENT_NAME}" \
            -F per_page=5 \
            "repos/${REPO}/actions/workflows/ci.yml/runs")"; then
            echo "::warning::could not list CI runs for ${HEAD_BRANCH}; treating the baseline verdict as unknown"
            echo "verdict=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          baseline_sha="$(jq -r --arg sha "$HEAD_SHA" \
            '[.workflow_runs[] | select(.head_sha != $sha)][0].head_sha // empty' <<<"$runs")"
          if [ -z "$baseline_sha" ]; then
            echo "::notice::no earlier successful CI run found; treating the docs-only skip as a first scan"
            echo "verdict=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! check_runs="$(gh api --method GET "repos/${REPO}/commits/${baseline_sha}/check-runs")"; then
            echo "::warning::could not read check runs for baseline ${baseline_sha}; treating the baseline verdict as unknown"
            echo "verdict=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status="$(jq -r '[.check_runs[] | select(.name == "SonarCloud Analysis")][0].status // empty' <<<"$check_runs")"
          if [ -n "$status" ] && [ "$status" != "completed" ]; then
            echo "::warning::baseline SonarCloud check on ${baseline_sha} is still '${status}'; treating the baseline verdict as unknown"
            echo "verdict=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          verdict="$(jq -r '[.check_runs[] | select(.name == "SonarCloud Analysis")][0].conclusion // empty' <<<"$check_runs")"
          echo "sha=${baseline_sha}" >> "$GITHUB_OUTPUT"
          echo "verdict=${verdict:-none}" >> "$GITHUB_OUTPUT"

      - name: Check SONAR_TOKEN is available
        id: check-token
        if: steps.coverage.outputs.present == 'true'
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SONAR_TOKEN not set, skipping SonarCloud scan"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # A pull_request-triggered CI run whose head commit resolves to no open
      # PR (closed/merged between CI finishing and the scan starting, or the
      # commits/{sha}/pulls index not yet caught up on a just-opened PR, which
      # the PR-resolution step above already retries 3 times) must not
      # silently fall back to branch analysis: that registers the PR's
      # feature branch as a long-lived branch in SonarCloud and evaluates it
      # against the main-branch gate with no PR decoration, the exact
      # pollution the hard-error-on-API-failure above exists to prevent,
      # reached through a different door. The terminal reporter fails this
      # case closed (conclusion=failure), not neutral: a `neutral` check
      # satisfies a required status check, which would pass the gate with no
      # scan having run at all, and a closed/merged PR (the one case this
      # guard also catches) is unaffected by a failing check on an old head.
      - name: Guard against unresolvable PR context
        id: pr-guard
        if: steps.check-token.outputs.available == 'true'
        env:
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if [ "$WORKFLOW_RUN_EVENT" = "pull_request" ] && [ -z "$PR_NUMBER" ]; then
            echo "::warning::pull_request CI run has no resolvable open PR for its head commit after retries; failing closed rather than running a branch analysis of a PR branch"
            echo "resolvable=false" >> "$GITHUB_OUTPUT"
          else
            echo "resolvable=true" >> "$GITHUB_OUTPUT"
          fi

      # No PR context (a direct push to main, or a run with no associated
      # PR) falls back to Sonar's branch-analysis parameters instead of PR
      # parameters, since push-to-main is a valid trigger path with no PR to
      # decorate.
      #
      # SONAR_HOST_URL is pinned rather than left to default, because the
      # workspace holds fork-authored content on a fork PR and the scanner
      # reads `sonar-project.properties` from it: a `sonar.host.url` planted
      # there would otherwise redirect the authenticated analysis upload and
      # hand SONAR_TOKEN to that host. The action puts this on the scanner's
      # command line, which wins over the properties file.
      #
      # sonar.scm.revision is pinned for the same class of reason, minus the
      # security angle: the scanner's GitHub Actions auto-detection derives it
      # from GITHUB_SHA, which under workflow_run is the DEFAULT BRANCH tip,
      # not the commit being analyzed.
      - name: SonarCloud Scan
        id: scan
        if: steps.check-token.outputs.available == 'true' && steps.pr-guard.outputs.resolvable == 'true'
        continue-on-error: true
        # Own timeout, shorter than the job's: a step-level timeout marks
        # `steps.scan.outcome` as 'failure', which the terminal reporter names
        # correctly ("the quality gate did not pass"). A job-level timeout
        # instead reports `job.status == 'cancelled'`, which reads in the
        # check run as "superseded, nothing to see" and is indistinguishable
        # from a concurrency-group supersede.
        timeout-minutes: 15
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }}
            ${{ steps.pr.outputs.number != '' && format(
              '-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}',
              steps.pr.outputs.number,
              steps.pr.outputs.head,
              steps.pr.outputs.base
            ) || format('-Dsonar.branch.name={0}', github.event.workflow_run.head_branch) }}

      # One terminal step completes the check for every outcome, so the
      # required "SonarCloud Analysis" check can never be left pending: a
      # non-success CI run, a missing artifact, a missing token, the scan's own
      # verdict, a cancellation, and an unexpected failure in any step above
      # (an unguarded checkout failure would otherwise strand the PR forever)
      # all land here.
      - name: Report check result
        if: always() && steps.check.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHECK_ID: ${{ steps.check.outputs.id }}
          JOB_STATUS: ${{ job.status }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          COVERAGE_PRESENT: ${{ steps.coverage.outputs.present }}
          BASELINE_VERDICT: ${{ steps.baseline.outputs.verdict }}
          TOKEN_AVAILABLE: ${{ steps.check-token.outputs.available }}
          PR_GUARD_RESOLVABLE: ${{ steps.pr-guard.outputs.resolvable }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          set -euo pipefail
          if [ "$CI_CONCLUSION" != "success" ]; then
            # Cancelled counts as a failure here, never a silent success.
            conclusion=failure
            title="CI did not succeed"
            summary="The triggering CI run concluded with '${CI_CONCLUSION}'. SonarCloud analysis was not run."
          elif [ "$JOB_STATUS" = "failure" ]; then
            conclusion=failure
            title="SonarCloud workflow failed"
            summary="A step in this workflow failed before the scan could report. See the workflow run for details."
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            # Reported as cancelled, not failure: this job was superseded (the
            # concurrency group) or cancelled by hand, so the quality gate was
            # never consulted and must not be blamed. Falling through to the
            # final else would write "the quality gate did not pass" for a
            # commit that was never scanned.
            conclusion=cancelled
            title="SonarCloud analysis cancelled"
            summary="This run was cancelled before the scan could report. No quality gate verdict was produced."
          elif [ "$ARTIFACT_OUTCOME" != "success" ]; then
            # ci.yml uploads coverage-xml on every run of python-test, so a
            # failed download is an expired, deleted or unreachable artifact,
            # never the docs-only path. The scan did not happen; say so rather
            # than passing the required check on a gate nobody consulted.
            conclusion=failure
            title="Coverage artifact unavailable"
            summary="CI succeeded, but its coverage-xml artifact could not be downloaded. SonarCloud analysis was not run."
          elif [ "$COVERAGE_PRESENT" != "true" ]; then
            # The artifact carried a no-coverage.marker instead of a
            # coverage.xml: per .github/scripts/detect-code-changes.sh that is
            # a docs-only change, where python-test skips its own test step.
            # That alone is NOT enough to pass: ci.yml's own baseline for this
            # skip is the last successful run of CI itself, which succeeds
            # independently of the SonarCloud quality gate, so a code commit
            # whose gate failed and was never fixed can reach here on a later
            # docs-only amend. BASELINE_VERDICT mirrors the last scanned
            # commit's own "SonarCloud Analysis" check instead of hardcoding
            # success. "none" (no earlier scanned commit to compare against)
            # and "success" are legitimate passes. "neutral" and "cancelled"
            # are not gate failures either (SONAR_TOKEN missing or a
            # superseded run on that earlier commit, never an actual quality
            # gate verdict), so blocking a docs-only push on them would be a
            # false negative; only a genuine gate failure
            # (failure/timed_out/action_required) blocks. "unknown" (the
            # baseline step's own lookup failed, or that commit's scan is
            # still in progress) fails closed, the one case here that is not
            # a baseline verdict at all.
            case "$BASELINE_VERDICT" in
              none | success | neutral | cancelled)
                conclusion=success
                title="No coverage to scan"
                summary="CI deliberately produced no coverage (documentation-only change). Skipping SonarCloud analysis."
                ;;
              unknown)
                conclusion=failure
                title="Baseline SonarCloud verdict unknown"
                summary="This commit only changes documentation, but the last scanned commit's SonarCloud verdict could not be established (an API failure, or that commit's scan is still in progress). Failing closed rather than passing an unverified gate."
                ;;
              *)
                conclusion=failure
                title="Baseline SonarCloud gate not satisfied"
                summary="This commit only changes documentation, but the last scanned commit on this branch reported '${BASELINE_VERDICT}'. A docs-only push cannot clear that gate on its own; fix the underlying commit."
                ;;
            esac
          elif [ "$TOKEN_AVAILABLE" != "true" ]; then
            conclusion=neutral
            title="SONAR_TOKEN unavailable"
            summary="SONAR_TOKEN secret was not set; the scan was skipped."
          elif [ "$PR_GUARD_RESOLVABLE" = "false" ]; then
            conclusion=failure
            title="PR could not be resolved"
            summary="This pull_request CI run has no resolvable open PR for its head commit, even after retries. Failing the check rather than running a branch-level scan of a PR branch or passing the gate without a scan."
          elif [ "$SCAN_OUTCOME" = "success" ]; then
            conclusion=success
            title="SonarCloud Analysis"
            summary="SonarCloud quality gate passed."
          else
            conclusion=failure
            title="SonarCloud Analysis"
            summary="SonarCloud scan failed, or the quality gate did not pass."
          fi
          # Retried for the same reason as the pending check's own creation:
          # a transient failure here leaves the required check `in_progress`
          # forever, blocking the PR just as hard as never creating it.
          for attempt in 1 2 3; do
            if gh api "repos/${REPO}/check-runs/${CHECK_ID}" -X PATCH \
              -f status=completed \
              -f conclusion="${conclusion}" \
              -f "output[title]=${title}" \
              -f "output[summary]=${summary}"; then
              exit 0
            fi
            echo "::warning::attempt ${attempt} to report the check result failed"
            sleep $((attempt * 5))
          done
          echo "::error::could not report the check result after 3 attempts"
          exit 1
