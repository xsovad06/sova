# Weekly update PRs for the Python dependencies (pyproject.toml and the
# uv.lock CI installs from) and for the actions pinned in .github/workflows/.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
