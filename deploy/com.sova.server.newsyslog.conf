# Reference newsyslog.d template for the SOVA server launchd service.
#
# launchd's StandardOutPath/StandardErrorPath (see com.sova.server.plist) grow
# forever on their own; newsyslog is macOS's own rotation mechanism for files
# like these. This file is a reference only: 'sova server install-service
# --type launchd' prints the real, path-substituted version of this file
# (PID file path included) and a copy command, since writing into
# /etc/newsyslog.d/ is a system-wide change this project will not make
# without your explicit action.
#
# To install by hand: substitute ~ below for your actual home directory
# (newsyslog.d does not expand ~) and /path/to/project/.claude/sova-server.pid
# for your project's actual PID file (printed by 'sova server status'), then:
#   sudo cp com.sova.server.newsyslog.conf /etc/newsyslog.d/sova-server.conf
#
# Caveat: launchd opens these two files once, at process start, and keeps the
# descriptor, so after a rotation the server would keep writing to the
# rotated-away inode. The trailing [pid_file] [sig_num] fields below have
# newsyslog send SIGHUP (1) to the PID in that file after each rotation. The
# server handles it by reopening the files named by SOVA_SERVER_LOG and
# SOVA_SERVER_ERR_LOG (set in the plist's EnvironmentVariables) in place, with
# no restart, so the agents the server launched are not disturbed. The server
# takes over SIGHUP only when one of those variables is set; with both unset it
# keeps the default action. When stdout is a terminal, SIGHUP only logs that it
# skipped the reopen.
# SOVA's own application log, {project}/.claude/sova.log, is rotated in-process
# by server.log_max_bytes / server.log_backup_count and needs none of this.
#
# logfilename                                  [owner:group]  mode  count  size(KB)  when  flags  [pid_file]                                  [sig_num]
~/Library/Logs/sova/sova-server.log                            644   5      10240     *     J     /path/to/project/.claude/sova-server.pid   1
~/Library/Logs/sova/sova-server.err                            644   5      10240     *     J     /path/to/project/.claude/sova-server.pid   1
