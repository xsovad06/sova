{% extends "base.html" %}
{% block title %}Memory - Morning Agent{% endblock %}
{% block content %}
<h2 class="text-2xl font-semibold mb-6">Agent Memory</h2>

<!-- Search -->
<div class="flex gap-3 mb-6">
  <input id="memory-search" type="text" placeholder="Search memories (FTS5)..."
         class="bg-surface border border-gray-600 rounded px-3 py-2 text-sm text-gray-300 flex-1"
         onkeyup="if(event.key==='Enter') searchMemory()">
  <button onclick="searchMemory()" class="bg-accent/20 text-accent px-4 py-2 rounded text-sm hover:bg-accent/30 transition-colors">
    Search
  </button>
</div>

<!-- Tags -->
<div class="flex flex-wrap gap-2 mb-6" id="tag-cloud"></div>

<!-- Search results -->
<div id="search-results" class="mb-6 hidden">
  <h3 class="text-sm font-medium text-gray-400 uppercase tracking-wide mb-3">Search Results</h3>
  <div class="space-y-3" id="search-results-list"></div>
</div>

<!-- Markdown files -->
<div class="bg-surface-card rounded-lg border border-gray-700/50">
  <div class="px-4 py-3 border-b border-gray-700/50 flex gap-2" id="file-tabs"></div>
  <div class="p-4 prose prose-invert prose-sm max-w-none" id="file-content">
    <p class="text-gray-500">Select a file to view</p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let activeFile = null;

async function loadMemoryPage() {
  // Load tags
  const tags = await fetchAPI(apiUrl('/memory/tags'));
  const tagEl = document.getElementById('tag-cloud');
  tagEl.innerHTML = tags.length === 0
    ? '<span class="text-gray-500 text-xs">No tags in memory database</span>'
    : tags.map(t => `
        <button onclick="searchByTag('${escapeHtml(t)}')"
                class="text-xs px-2 py-1 rounded bg-accent-purple/20 text-accent-purple hover:bg-accent-purple/30 transition-colors">
          ${escapeHtml(t)}
        </button>
      `).join('');

  // Load file tabs
  const files = await fetchAPI(apiUrl('/memory/files'));
  const tabsEl = document.getElementById('file-tabs');
  tabsEl.innerHTML = files.map(f => `
    <button onclick="loadFile('${f.name}')"
            class="file-tab text-xs px-3 py-1.5 rounded transition-colors
                   ${f.name === activeFile ? 'bg-sidebar-active text-white' : 'text-gray-400 hover:bg-sidebar-hover hover:text-gray-200'}">
      ${f.name}.md <span class="text-gray-600">(${f.lines})</span>
    </button>
  `).join('');

  // Auto-load first file or from URL param
  const params = new URLSearchParams(window.location.search);
  const fileParam = params.get('file');
  if (fileParam && files.some(f => f.name === fileParam)) {
    loadFile(fileParam);
  } else if (files.length > 0 && !activeFile) {
    loadFile(files[0].name);
  }
}

async function loadFile(name) {
  activeFile = name;
  const data = await fetchAPI(apiUrl(`/memory/files/${name}`));
  document.getElementById('file-content').innerHTML = data.html;
  // Update active tab styling
  document.querySelectorAll('.file-tab').forEach(btn => {
    btn.classList.remove('bg-sidebar-active', 'text-white');
    btn.classList.add('text-gray-400');
  });
  event?.target?.classList?.add('bg-sidebar-active', 'text-white');
  event?.target?.classList?.remove('text-gray-400');
  loadMemoryPage();
}

async function searchMemory() {
  const q = document.getElementById('memory-search').value.trim();
  if (!q) return;
  const results = await fetchAPI(apiUrl(`/memory/search?q=${encodeURIComponent(q)}`));
  const container = document.getElementById('search-results');
  const list = document.getElementById('search-results-list');
  if (results.length === 0) {
    container.classList.remove('hidden');
    list.innerHTML = '<p class="text-gray-500 text-sm">No results found</p>';
    return;
  }
  container.classList.remove('hidden');
  list.innerHTML = results.map(r => `
    <div class="bg-surface-card rounded-lg p-3 border border-gray-700/50">
      <div class="text-sm text-gray-300 mb-1">${escapeHtml(r.content || '')}</div>
      <div class="flex gap-2 text-xs text-gray-500">
        ${r.tags ? `<span class="text-accent-purple">${escapeHtml(r.tags)}</span>` : ''}
        ${r.created_at ? `<span>Created: ${r.created_at}</span>` : ''}
      </div>
    </div>
  `).join('');
}

function searchByTag(tag) {
  document.getElementById('memory-search').value = tag;
  searchMemory();
}

loadMemoryPage();
</script>
{% endblock %}
