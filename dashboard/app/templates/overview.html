{% extends "base.html" %}
{% block title %}Overview - Morning Agent{% endblock %}
{% block content %}
<h2 class="text-2xl font-semibold mb-6">Overview</h2>

<!-- Summary cards -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8" id="summary-cards">
  <div class="bg-surface-card rounded-lg p-4 border border-gray-700/50">
    <p class="text-xs text-gray-500 uppercase tracking-wide">Active Tasks</p>
    <p class="text-3xl font-bold mt-1" id="card-active">--</p>
    <p class="text-xs text-gray-500 mt-1" id="card-active-detail"></p>
  </div>
  <div class="bg-surface-card rounded-lg p-4 border border-gray-700/50">
    <p class="text-xs text-gray-500 uppercase tracking-wide">Today's Cost</p>
    <p class="text-3xl font-bold text-accent-green mt-1" id="card-today-cost">--</p>
  </div>
  <div class="bg-surface-card rounded-lg p-4 border border-gray-700/50">
    <p class="text-xs text-gray-500 uppercase tracking-wide">7-Day Cost</p>
    <p class="text-3xl font-bold text-accent-yellow mt-1" id="card-7d-cost">--</p>
    <p class="text-xs text-gray-500 mt-1" id="card-sessions"></p>
  </div>
  <div class="bg-surface-card rounded-lg p-4 border border-gray-700/50">
    <p class="text-xs text-gray-500 uppercase tracking-wide">Completion Rate</p>
    <p class="text-3xl font-bold text-accent-purple mt-1" id="card-completion">--</p>
    <p class="text-xs text-gray-500 mt-1" id="card-completion-detail"></p>
  </div>
</div>

<!-- Two-column layout -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <!-- Recent Activity -->
  <div class="bg-surface-card rounded-lg border border-gray-700/50">
    <div class="px-4 py-3 border-b border-gray-700/50">
      <h3 class="text-sm font-medium text-gray-400">Recent Activity</h3>
    </div>
    <div class="p-4 space-y-2 max-h-96 overflow-y-auto" id="recent-logs">
      <p class="text-gray-500 text-sm">Loading...</p>
    </div>
  </div>

  <!-- Memory Files -->
  <div class="bg-surface-card rounded-lg border border-gray-700/50">
    <div class="px-4 py-3 border-b border-gray-700/50">
      <h3 class="text-sm font-medium text-gray-400">Memory Files</h3>
    </div>
    <div class="p-4 space-y-2" id="memory-files">
      <p class="text-gray-500 text-sm">Loading...</p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadOverview() {
  try {
    const data = await fetchAPI(apiUrl('/overview'));

    // Tasks
    const t = data.tasks;
    document.getElementById('card-active').textContent = t.active_count;
    document.getElementById('card-active-detail').textContent =
      `${t.in_progress} in progress, ${t.paused} paused`;

    // Costs
    const c = data.costs;
    document.getElementById('card-today-cost').textContent = '$' + c.today_cost_usd.toFixed(2);
    document.getElementById('card-7d-cost').textContent = '$' + c.rolling_7d_usd.toFixed(2);
    document.getElementById('card-sessions').textContent = `${c.total_sessions} total sessions`;

    // Completion
    const total = t.completed + t.failed;
    const rate = total > 0 ? Math.round((t.completed / total) * 100) : 0;
    document.getElementById('card-completion').textContent = total > 0 ? rate + '%' : 'N/A';
    document.getElementById('card-completion-detail').textContent =
      `${t.completed} done, ${t.failed} failed of ${t.total_history} total`;

    // Recent logs
    const logsEl = document.getElementById('recent-logs');
    if (data.recent_logs.length === 0) {
      logsEl.innerHTML = '<p class="text-gray-500 text-sm">No log entries</p>';
    } else {
      logsEl.innerHTML = data.recent_logs.map(l => `
        <div class="flex items-start gap-2 text-xs font-mono">
          <span class="text-gray-600 shrink-0">${l.timestamp.substring(11, 19)}</span>
          <span class="shrink-0 ${levelColor(l.level)}">${l.level}</span>
          <span class="text-accent shrink-0">[${l.component}]</span>
          <span class="text-gray-300 break-all">${escapeHtml(l.message)}</span>
        </div>
      `).join('');
    }

    // Memory files
    const memEl = document.getElementById('memory-files');
    if (data.memory_files.length === 0 && data.memory_count === 0) {
      memEl.innerHTML = '<p class="text-gray-500 text-sm">No memory data</p>';
    } else {
      let html = '';
      if (data.memory_count > 0) {
        html += `<div class="flex justify-between text-sm py-1">
          <span class="text-gray-300">SQLite memories</span>
          <span class="text-accent">${data.memory_count} entries</span>
        </div>`;
      }
      html += data.memory_files.map(f => `
        <div class="flex justify-between text-sm py-1">
          <a href="/memory?file=${f.name}" class="text-gray-300 hover:text-accent transition-colors">${f.name}.md</a>
          <span class="text-gray-500">${f.lines} lines</span>
        </div>
      `).join('');
      memEl.innerHTML = html;
    }
  } catch (e) {
    console.error('Failed to load overview:', e);
  }
}

loadOverview();
setInterval(loadOverview, 10000);
</script>
{% endblock %}
