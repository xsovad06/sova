[project]
name = "sova"
version = "0.1.0"
description = "SOVA: Software Orchestration Via Agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Damian Sova", email = "sovicka99@gmail.com" },
]
keywords = ["ai", "automation", "agents", "github", "cli", "developer-tools", "code-review", "tdd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12,<1.0",
    "fastapi>=0.115,<0.137",
    "starlette>=0.46,<2.0",
    "uvicorn[standard]>=0.54.0,<1.0",
    "sqlalchemy[asyncio]>=2.1.5,<2.2",
    "alembic>=1.13,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "aiosqlite>=0.20,<1.0",
    "jinja2>=3.1,<4.0",
    "httpx>=0.27,<1.0",
    "rich>=13.0,<16.0",
    "structlog>=24.0,<28.0",
    "tomlkit>=0.13,<1.0",
    "mcp>=2.3.0,<3.0",
    "cachetools>=5.3,<8.0",
    "psutil>=5.9,<8.0",
    "slowapi>=0.1.9,<1.0",
    "jsonschema>=4.0,<5.0",
    "packaging>=23.0,<27.0",
]

[project.urls]
Repository = "https://github.com/xsovad06/sova"
Issues = "https://github.com/xsovad06/sova/issues"
Documentation = "https://github.com/xsovad06/sova/blob/main/README.md"

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
litellm = ["litellm>=1.40"]
vertex = ["google-auth>=2.0", "requests>=2.20"]
batch = ["sova[vertex]"]
compression = ["headroom-ai>=0.3.0"]
awareness = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
]
embeddings = ["sentence-transformers>=2.2"]
postgres = ["asyncpg>=0.30"]
ldap = ["ldap3>=2.9"]
keyring = ["keyring>=24.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.0",
    "ruff>=0.4",
    "respx>=0.22",
]

[project.scripts]
sova = "sova.cli.app:app"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sova*"]

[tool.setuptools.package-data]
"sova.db" = ["alembic.ini", "migrations/*.mako"]
"sova.dashboard" = ["templates/*.html", "static/**/*"]
"sova.core.schemas" = ["*.json"]
"sova.commands" = ["data/commands/*.md", "data/guidelines/*.md", "data/personas/*.md", "data/skills/**/*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Test helpers legitimately catch broadly (fixtures, cleanup, failure injection).
"tests/**" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["sova", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
markers = [
    "runtime: tests requiring real process lifecycle (deselect with -m 'not runtime')",
    "stress: high-concurrency stress tests (deselect with -m 'not stress')",
    "chaos: failure injection and crash recovery tests (deselect with -m 'not chaos')",
    "codex_smoke: opt-in smoke tests against a real Codex CLI (set SOVA_CODEX_SMOKE=1; deselect with -m 'not codex_smoke')",
    "evaluation: opt-in model-evaluation harness tests against live providers (set SOVA_EVAL_LIVE=1; deselect with -m 'not evaluation')",
]
# "error" promotes every warning not explicitly allowlisted below into a test
# failure, so a new, unreviewed warning is caught instead of scrolling by
# unnoticed in a wall of output (issue #1209). Each entry below is a warning
# category confirmed benign by inspection, scoped as narrowly as the warning
# itself allows: most come from unawaited sqlite/aiosqlite connections and
# AsyncMock coroutines in test doubles that the suite never runs to
# completion, never from production code.
filterwarnings = [
    "error",
    # sqlite3/aiosqlite connections are garbage-collected rather than closed
    # when a test's in-memory DB engine goes out of scope; nothing is left
    # unflushed since the DB is in-memory and discarded with the process.
    "ignore:unclosed database.*:ResourceWarning",
    "ignore:unclosed <aiosqlite.core.Connection.*:ResourceWarning",
    # aiosqlite 0.22 words the same warning differently.
    "ignore:<aiosqlite\\.core\\.Connection object at .* was deleted before being closed:ResourceWarning",
    # The same aiosqlite GC above, but when __del__ runs during garbage
    # collection outside any test's own call stack, Python treats its
    # ResourceWarning as unraisable and pytest's unraisablehook re-wraps it
    # into this category instead, surfacing on whichever test happens to run
    # when collection fires rather than on the test that created the
    # connection. The message pytest generates names only the deallocator,
    # not the warning it wraps, so this is matched on that name rather than
    # on "unclosed" like the entries above. Python 3.12 phrases it
    # "Exception ignored in:", 3.14 "Exception ignored while calling
    # deallocator"; CI runs both. The 3.12 colon is matched with "." because
    # a literal colon would end the filter's message field.
    "ignore:Exception ignored (in.|while calling deallocator) <function Connection\\.__del__:pytest.PytestUnraisableExceptionWarning",
    # The same unclosed connection seen from aiosqlite's worker thread: once
    # the test's event loop has closed, the thread's attempt to hand back a
    # result raises "Event loop is closed", which pytest reports per thread.
    "ignore:Exception in thread .*\\(_connection_worker_thread\\):pytest.PytestUnhandledThreadExceptionWarning",
    # sova.db.migrate's lock file is intentionally left for the OS to reclaim
    # at process exit rather than closed per-test; see sova/db/migrate.py.
    "ignore:unclosed file.*sova\\.db\\.migrate\\.lock.*:ResourceWarning",
    # A mocked async collaborator (AsyncMock) that a test's own early return,
    # exception path, or cancellation never awaits still creates a coroutine
    # object, which warns on its own __del__. This entry is deliberately the
    # widest in the list, and it is the one to narrow first: "coroutine X was
    # never awaited" is also exactly how a forgotten `await` on production
    # code surfaces, so the category-wide ignore costs real signal. Measured
    # while promoting warnings to errors, replacing it with
    # "ignore:coroutine 'AsyncMockMixin\\._execute_mock_call' was never awaited"
    # (the AsyncMock case alone) fails five tests on pre-existing leaks, none
    # of them a test double: 'create_subprocess_exec' (tests/test_ipc.py),
    # 'poll.<locals>._run_poll' (sova/cli/commands/supervisor.py, reached from
    # tests/test_supervisor_cli.py), '_ConnectionManager._produce_loop'
    # (tests/test_dashboard.py's websocket tests) and 'Queue.get' (garbage
    # collected during the setup of a tests/test_output_stream_service.py test,
    # so leaked by an earlier test on the same xdist worker, not yet traced).
    # Fix those, then narrow this entry to the AsyncMock message.
    "ignore:coroutine .* was never awaited:RuntimeWarning",
    # Third-party: starlette.testclient's own documented httpx migration path,
    # unrelated to SOVA code. StarletteDeprecationWarning subclasses
    # UserWarning, not DeprecationWarning.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
