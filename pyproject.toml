[project]
name = "sova"
version = "0.1.0"
description = "SOVA: Software Orchestration Via Agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Damian Sova", email = "sovicka99@gmail.com" },
]
keywords = ["ai", "automation", "agents", "github", "cli", "developer-tools", "code-review", "tdd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12,<1.0",
    "fastapi>=0.162.0,<0.163",
    "starlette>=1.10.0,<2.0",
    "uvicorn[standard]>=0.54.0,<1.0",
    "sqlalchemy[asyncio]>=2.1.8,<2.2",
    "alembic>=1.13,<2.0",
    "pydantic>=2.14.2,<3.0",
    "pydantic-settings>=2.16.2,<3.0",
    "aiosqlite>=0.20,<1.0",
    "jinja2>=3.1,<4.0",
    "httpx>=0.27,<1.0",
    "rich>=13.0,<16.0",
    "structlog>=24.0,<28.0",
    "tomlkit>=0.13,<1.0",
    "mcp>=2.3.0,<3.0",
    "cachetools>=7.2.8,<8.0",
    "psutil>=5.9,<8.0",
    "slowapi>=0.1.9,<1.0",
    "jsonschema>=4.0,<5.0",
    "packaging>=23.0,<27.0",
]

[project.urls]
Repository = "https://github.com/xsovad06/sova"
Issues = "https://github.com/xsovad06/sova/issues"
Documentation = "https://github.com/xsovad06/sova/blob/main/README.md"

[project.optional-dependencies]
anthropic = ["anthropic>=2.4.0"]
litellm = ["litellm>=1.106.6"]
vertex = ["google-auth>=2.62.1", "requests>=2.20"]
batch = ["sova[vertex]"]
compression = ["headroom-ai>=0.42.0"]
awareness = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.62.1",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
]
embeddings = ["sentence-transformers>=2.2"]
postgres = ["asyncpg>=0.30", "psycopg[binary]>=3.2"]
ldap = ["ldap3>=2.9"]
keyring = ["keyring>=24.0"]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.0",
    "ruff>=0.17.3",
    "respx>=0.22",
]

[project.scripts]
sova = "sova.cli.app:app"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sova*"]

[tool.setuptools.package-data]
"sova.db" = ["alembic.ini", "migrations/*.mako"]
"sova.dashboard" = ["templates/*.html", "static/**/*"]
"sova.core.schemas" = ["*.json"]
"sova.commands" = ["data/commands/*.md", "data/guidelines/*.md", "data/personas/*.md", "data/skills/**/*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Test helpers legitimately catch broadly (fixtures, cleanup, failure injection).
"tests/**" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["sova", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Left unset, pytest-asyncio raises a deprecation warning while configuring,
# which "error" below turns into a session abort from pytest 9.2 on. No async
# fixture declares a wider scope, so "function" matches the implicit default.
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = [
    "runtime: tests requiring real process lifecycle (deselect with -m 'not runtime')",
    "stress: high-concurrency stress tests (deselect with -m 'not stress')",
    "chaos: failure injection and crash recovery tests (deselect with -m 'not chaos')",
    "codex_smoke: opt-in smoke tests against a real Codex CLI (set SOVA_CODEX_SMOKE=1; deselect with -m 'not codex_smoke')",
    "evaluation: opt-in model-evaluation harness tests against live providers (set SOVA_EVAL_LIVE=1; deselect with -m 'not evaluation')",
    "slow(reason): slow by nature; exempt from SOVA_TEST_DURATION_BUDGET (tests/duration_budget.py), and the reason is required",
]
# "error" promotes every warning not explicitly allowlisted below into a test
# failure, so a new, unreviewed warning is caught instead of scrolling by
# unnoticed in a wall of output (issue #1209). Each entry below is a warning
# category confirmed benign by inspection, scoped as narrowly as the warning
# itself allows: most come from AsyncMock coroutines in test doubles that the
# suite never runs to completion, never from production code. There is no entry
# for an unclosed sqlite/aiosqlite connection: tests share one engine per worker
# (tests/conftest.py:reset_db_rows), whose teardown drains feed writes and
# disposes every other engine, so a leaked connection fails the run (#1383).
filterwarnings = [
    "error",
    # sova.db.migrate's lock file is intentionally left for the OS to reclaim
    # at process exit rather than closed per-test; see sova/db/migrate.py.
    "ignore:unclosed file.*sova\\.db\\.migrate\\.lock.*:ResourceWarning",
    # A mocked async collaborator (AsyncMock) that a test's own early return,
    # exception path, or cancellation never awaits still creates a coroutine
    # object, which warns on its own __del__. This entry is deliberately the
    # widest in the list, and it is the one to narrow first: "coroutine X was
    # never awaited" is also exactly how a forgotten `await` on production
    # code surfaces, so the category-wide ignore costs real signal. Measured
    # while promoting warnings to errors, replacing it with
    # "ignore:coroutine 'AsyncMockMixin\\._execute_mock_call' was never awaited"
    # (the AsyncMock case alone) fails tests on pre-existing leaks, none of
    # them a test double: 'create_subprocess_exec' (tests/test_ipc.py),
    # '_ConnectionManager._produce_loop'
    # (tests/test_dashboard.py's websocket tests) and 'Queue.get' (garbage
    # collected during the setup of a tests/test_output_stream_service.py test,
    # so leaked by an earlier test on the same xdist worker, not yet traced).
    # Fix those, then narrow this entry to the AsyncMock message.
    "ignore:coroutine .* was never awaited:RuntimeWarning",
    # The same unawaited AsyncMock coroutine, when garbage collection
    # finalizes it while a namedtuple's __new__ is running: CPython builds
    # that __new__ from a string with an empty __builtins__, so the
    # "never awaited" warning cannot import `warnings` and raises
    # KeyError('__import__') instead, which pytest reports as unraisable on
    # whichever test happens to be running (seen on Python 3.14 in CI,
    # reproduced locally with gc.set_threshold(1)). Scoped to AsyncMock's
    # coroutine so a production coroutine finalized this way still fails.
    "ignore:Exception ignored while finalizing coroutine <coroutine object AsyncMockMixin\\._execute_mock_call:pytest.PytestUnraisableExceptionWarning",
    # Third-party: starlette.testclient's own documented httpx migration path,
    # unrelated to SOVA code. StarletteDeprecationWarning subclasses
    # UserWarning, not DeprecationWarning.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
