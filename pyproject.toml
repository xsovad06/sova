[project]
name = "sova"
version = "0.1.0"
description = "SOVA: Software Orchestration Via Agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Damian Sova", email = "sovicka99@gmail.com" },
]
keywords = ["ai", "automation", "agents", "github", "cli", "developer-tools", "code-review", "tdd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.29.1,<1.0",
    "fastapi>=0.163.1,<0.164",
    "starlette>=1.10.0,<2.0",
    "uvicorn[standard]>=0.54.0,<1.0",
    "sqlalchemy[asyncio]>=2.1.9,<2.2",
    "alembic>=1.13,<2.0",
    "pydantic>=2.14.3,<3.0",
    "pydantic-settings>=2.16.3,<3.0",
    "aiosqlite>=0.20,<1.0",
    "jinja2>=3.1,<4.0",
    "httpx>=0.27,<1.0",
    "rich>=13.0,<16.0",
    "structlog>=24.0,<28.0",
    "tomlkit>=0.13,<1.0",
    "mcp>=2.3.0,<3.0",
    "cachetools>=8.0.0,<9.0",
    "psutil>=5.9,<8.0",
    "slowapi>=0.1.9,<1.0",
    "jsonschema>=4.0,<5.0",
    "packaging>=23.0,<27.0",
]

[project.urls]
Repository = "https://github.com/xsovad06/sova"
Issues = "https://github.com/xsovad06/sova/issues"
Documentation = "https://github.com/xsovad06/sova/blob/main/README.md"

[project.optional-dependencies]
anthropic = ["anthropic>=2.9.0"]
litellm = ["litellm>=1.111.0.dev4"]
vertex = ["google-auth>=2.62.2", "requests>=2.20"]
batch = ["sova[vertex]"]
compression = ["headroom-ai>=0.44.0"]
awareness = [
    "google-api-python-client>=2.202.0",
    "google-auth>=2.62.2",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
]
postgres = ["asyncpg>=0.30", "psycopg[binary]>=3.3.9"]
ldap = ["ldap3>=2.9"]
keyring = ["keyring>=24.0"]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.0",
    "ruff>=0.17.5",
    "import-linter>=2.17,<3",
    "respx>=0.22",
]

[project.scripts]
sova = "sova.cli.app:app"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sova*"]

[tool.setuptools.package-data]
"sova.db" = ["alembic.ini", "migrations/*.mako"]
"sova.dashboard" = ["templates/*.html", "static/**/*"]
"sova.core.schemas" = ["*.json"]
"sova.commands" = ["data/commands/*.md", "data/guidelines/*.md", "data/skills/**/*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Test helpers legitimately catch broadly (fixtures, cleanup, failure injection).
"tests/**" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["sova", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Left unset, pytest-asyncio raises a deprecation warning while configuring,
# which "error" below turns into a session abort from pytest 9.2 on. No async
# fixture declares a wider scope, so "function" matches the implicit default.
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = [
    "runtime: tests requiring real process lifecycle (deselect with -m 'not runtime')",
    "stress: high-concurrency stress tests (deselect with -m 'not stress')",
    "chaos: failure injection and crash recovery tests (deselect with -m 'not chaos')",
    "codex_smoke: opt-in smoke tests against a real Codex CLI (set SOVA_CODEX_SMOKE=1; deselect with -m 'not codex_smoke')",
    "evaluation: opt-in model-evaluation harness tests against live providers (set SOVA_EVAL_LIVE=1; deselect with -m 'not evaluation')",
    "slow(reason): slow by nature; exempt from SOVA_TEST_DURATION_BUDGET (tests/duration_budget.py), and the reason is required",
]
# "error" promotes every warning not explicitly allowlisted below into a test
# failure, so a new, unreviewed warning is caught instead of scrolling by
# unnoticed in a wall of output (issue #1209). Each entry below is a warning
# category confirmed benign by inspection, scoped as narrowly as the warning
# itself allows: most come from AsyncMock coroutines in test doubles that the
# suite never runs to completion, never from production code. There is no entry
# for an unclosed sqlite/aiosqlite connection: tests share one engine per worker
# (tests/conftest.py:reset_db_rows), whose teardown drains feed writes and
# disposes every other engine, so a leaked connection fails the run (#1383).
filterwarnings = [
    "error",
    # sova.db.migrate's lock file is intentionally left for the OS to reclaim
    # at process exit rather than closed per-test; see sova/db/migrate.py.
    "ignore:unclosed file.*sova\\.db\\.migrate\\.lock.*:ResourceWarning",
    # A mocked async collaborator (AsyncMock) that a test's own early return,
    # exception path, or cancellation never awaits still creates a coroutine
    # object, which warns on its own __del__. Scoped to AsyncMock's coroutine:
    # "coroutine X was never awaited" for any other coroutine is how a
    # forgotten `await` on production code surfaces, or a mocked asyncio.run,
    # wait_for or create_task dropping the coroutine it is handed (use
    # tests/conftest.py's closing_stand_in for those), so it must fail.
    "ignore:coroutine 'AsyncMockMixin\\._execute_mock_call' was never awaited:RuntimeWarning",
    # The same unawaited AsyncMock coroutine, when garbage collection
    # finalizes it while a namedtuple's __new__ is running: CPython builds
    # that __new__ from a string with an empty __builtins__, so the
    # "never awaited" warning cannot import `warnings` and raises
    # KeyError('__import__') instead, which pytest reports as unraisable on
    # whichever test happens to be running (seen on Python 3.14 in CI,
    # reproduced locally with gc.set_threshold(1)). Python 3.12 words the same
    # report "Exception ignored in: <coroutine object ..." rather than
    # "Exception ignored while finalizing coroutine <coroutine object ...", so
    # the pattern accepts both (a filter field cannot hold a colon, so "in."
    # matches "in:"). Scoped to AsyncMock's coroutine so a production
    # coroutine finalized this way still fails.
    "ignore:Exception ignored (while finalizing coroutine|in.) <coroutine object AsyncMockMixin\\._execute_mock_call:pytest.PytestUnraisableExceptionWarning",
    # Third-party: starlette.testclient's own documented httpx migration path,
    # unrelated to SOVA code. StarletteDeprecationWarning subclasses
    # UserWarning, not DeprecationWarning.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

# Import layering contract (issue #1213). Layers run top to bottom: a layer may import the layers
# below it and never one above. Siblings joined by " : " may import each other. Packages outside the
# order (agents, knowledge, a2a, mcp, awareness, oversight, monitoring, commands) are not layers, but import
# chains through them are still checked: a layer may import one only if nothing it pulls in sits above that layer.
# `make lint` and CI's Python Lint job run `lint-imports`. See docs/architecture-deep-dive.md, "Target layout".
[tool.importlinter]
root_package = "sova"

[[tool.importlinter.contracts]]
name = "SOVA layers"
type = "layers"
layers = [
    "sova.cli : sova.scheduler",
    "sova.dashboard",
    "sova.supervisor",
    "sova.roles",
    "sova.core",
    "sova.llm : sova.git : sova.ipc : sova.adapters",
    "sova.db",
    "sova.config",
    "sova.utils",
]
# The baseline: every upward import that exists today, generated from a real run. It can only shrink
# (tests/test_import_baseline.py pins the exact set, so an addition or a swap fails and a removal must also trim the pin).
# unmatched_ignore_imports_alerting is "error" explicitly, so deleting an import without deleting
# its entry here fails CI. Do not add an entry for a new upward import: invert the dependency instead.
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
    "sova.adapters.github -> sova.supervisor.github_quota",
    "sova.config.db_loader -> sova.db.models",
    "sova.config.db_loader -> sova.db.session",
    "sova.config.loader -> sova.llm.keyring_store",
    "sova.config.root -> sova.llm.provider",
    "sova.core.dag -> sova.dashboard.services.agent_lifecycle",
    "sova.core.steps.address_review -> sova.roles.reviewer",
    "sova.core.steps.create_pr -> sova.supervisor.coderabbit_quota",
    "sova.core.steps.create_pr -> sova.supervisor.pr_throttle",
    "sova.core.steps.develop -> sova.dashboard.services.feed_service",
    "sova.core.steps.push -> sova.dashboard.services.feed_service",
    "sova.dashboard.app -> sova.cli.commands.project",
    "sova.dashboard.routers.setup -> sova.cli.commands.project",
    "sova.dashboard.services.agent_finalize -> sova.scheduler.service",
    "sova.dashboard.services.batch_service -> sova.cli.commands.harden",
    "sova.git.pr -> sova.supervisor.github_quota",
    "sova.git.rebase -> sova.core.agent_dispatch",
    "sova.git.rebase -> sova.core.steps.rebase",
    "sova.git.worktree -> sova.core.steps.commit_convention",
    "sova.roles.developer -> sova.supervisor.labels",
    "sova.roles.reviewer -> sova.dashboard.services.work_verdict",
    "sova.roles.triage -> sova.supervisor.dependency_graph",
    "sova.supervisor.daemon -> sova.dashboard.services.supervisor_service",
    "sova.supervisor.dependency_graph -> sova.dashboard.services.spec_service",
    "sova.supervisor.gates.budget -> sova.dashboard.services.agent_validation",
    "sova.supervisor.gates.review_completed -> sova.dashboard.services.pr_service",
    "sova.supervisor.gates.review_completed -> sova.dashboard.services.work_verdict",
    "sova.supervisor.github_quota -> sova.dashboard.services.feed_service",
    "sova.supervisor.network_health -> sova.dashboard.services.feed_service",
    "sova.supervisor.planner -> sova.dashboard.services.feed_service",
    "sova.supervisor.planner -> sova.dashboard.services.pr_service",
    "sova.supervisor.planner -> sova.dashboard.services.supervisor_service",
    "sova.supervisor.pr_monitor -> sova.dashboard.services.pr_service",
    "sova.supervisor.pr_monitor -> sova.dashboard.services.work_state",
    "sova.supervisor.progression -> sova.dashboard.services.agent_lifecycle",
    "sova.supervisor.progression -> sova.dashboard.services.agent_recovery",
    "sova.supervisor.progression -> sova.dashboard.services.feed_service",
    "sova.supervisor.progression -> sova.dashboard.services.pr_service",
    "sova.supervisor.progression -> sova.dashboard.services.work_state",
    "sova.supervisor.progression -> sova.dashboard.services.work_verdict",
    "sova.supervisor.watchdog -> sova.dashboard.services.agent_lifecycle",
    "sova.supervisor.watchdog -> sova.dashboard.services.feed_service",
    "sova.utils.diagnostics -> sova.awareness",
    "sova.utils.diagnostics -> sova.config.db_loader",
    "sova.utils.diagnostics -> sova.config.loader",
    "sova.utils.diagnostics -> sova.config.models",
    "sova.utils.diagnostics -> sova.dashboard.services.models_service",
    "sova.utils.diagnostics -> sova.dashboard.services.settings_service",
    "sova.utils.diagnostics -> sova.db.session",
    "sova.utils.diagnostics -> sova.ipc.runtime",
    "sova.utils.diagnostics -> sova.llm.backends",
    "sova.utils.diagnostics -> sova.llm.client",
    "sova.utils.diagnostics -> sova.llm.keyring_store",
    "sova.utils.diagnostics -> sova.llm.models",
    "sova.utils.diagnostics -> sova.llm.provider",
    "sova.utils.env -> sova.config.loader",
    "sova.utils.env -> sova.config.models",
    "sova.utils.gh -> sova.supervisor.github_quota",
    "sova.utils.mcp_config -> sova.config.models",
]
