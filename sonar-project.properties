sonar.organization=xsovad06
sonar.projectKey=xsovad06_sova
sonar.projectName=SOVA

sonar.sources=sova/
sonar.tests=tests/

sonar.python.version=3.12

sonar.exclusions=\
  **/templates/*.html,\
  **/static/**,\
  **/__pycache__/**,\
  **/migrations/**,\
  **/alembic.ini,\
  **/*.sh,\
  tests/test_google_oauth.py,\
  tests/test_llm.py

sonar.test.inclusions=tests/**/*.py

# Exclude test files from duplication detection
# Tests have legitimate repetitive patterns for mocking and assertions
sonar.coverage.exclusions=tests/**
sonar.cpd.exclusions=tests/**

sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
