# SOVA -- Project Configuration (self-hosted)
max_parallel_agents = 4

[project]
github_repo = "xsovad06/sova"
github_user = "xsovad06"
base_branch = "main"
test_cmd = "make test"
lint_cmd = "make lint"
format_cmd = "make format"
check_cmd = "make check"

[task_source]
type = "github"
github_project_number = 2

[agent]
model = "claude-opus-4-6"
fallback_models = ["sonnet"]
max_budget = 10.00

[review]
enabled = true
max_rounds = 2

[notification]
desktop = true

[external_reviews]
enabled = true
tools = ["sonarcloud", "coderabbit"]

[external_reviews.sonarcloud]
project_key = "xsovad06_sova"

[commit]
format = "conventional"
pr_title_format = "conventional"
branch_naming = "conventional"
ai_coauthor = false

[monitoring]
enabled = true
interval = 5.0

[supervisor]
enabled = false
poll_interval_seconds = 240
log_retention_days = 14
auto_rebase = true
auto_develop = true
auto_address_review = true
auto_integrate = true
llm_planning = true
require_approval = false
task_queue = [20, 597, 691, 693, 694, 118, 33, 122, 125, 126]
auto_research = true
auto_triage = true

[server]
scheduler_enabled = true

[llm]
routing = {triage = "haiku", extraction = "haiku", pr_body = "haiku"}

[coderabbit_quota]
enabled = true
plan = "free"

[watchdog]
enabled = true

[oversight]
analysis_model = "claude-sonnet-4-5@20250929"
auto_create_issues = true
enabled = true
