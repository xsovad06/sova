# SOVA -- Project Configuration (self-hosted)
max_parallel_agents = 4

[project]
github_repo = "xsovad06/sova"
github_user = "xsovad06"
base_branch = "main"
test_cmd = "make test"
lint_cmd = "make lint"
format_cmd = "make format"
check_cmd = "make check"

[task_source]
type = "github"
github_project_number = 2

[agent]
model = "sonnet"
max_budget = 10.00

[roles]
researcher_model = "sonnet"
triage_model = "haiku"

[llm]
routing = {triage = "haiku", extraction = "haiku", pr_body = "haiku"}

[review]
enabled = true
max_rounds = 2

[notification]
desktop = true

[external_reviews]
enabled = true
tools = ["sonarcloud", "coderabbit"]

[external_reviews.sonarcloud]
project_key = "xsovad06_sova"

[commit]
format = "conventional"
pr_title_format = "conventional"
branch_naming = "conventional"
ai_coauthor = false

[monitoring]
enabled = true
interval = 5.0

[dashboard]
pr_author_filter = "all"

[supervisor]
enabled = false
poll_interval_seconds = 30
log_retention_days = 14
auto_rebase = true
auto_develop = true
auto_address_review = true
auto_integrate = true

[coderabbit_quota]
enabled = true
plan = "free"
